name: Publier le site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la version stable
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Récupérer la V8 RC
        uses: actions/checkout@v4
        with:
          ref: release/2026-08
          path: rc

      - name: Préparer la preview V8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/v8-preview
          mkdir -p site/v8-preview
          rsync -a --delete --exclude='.git/' --exclude='.github/' rc/ site/v8-preview/

          cp site/data/custom_stations.json site/v8-preview/data/custom_stations.json
          cp site/data/exchange_rates.json site/v8-preview/data/exchange_rates.json
          cp site/data/e55c_station_tariffs_v1.json.gz site/v8-preview/data/e55c_station_tariffs_v1.json.gz
          cp site/data/belib_station_tariffs_v1.json.gz site/v8-preview/data/belib_station_tariffs_v1.json.gz
          cp site/data/ionity_direct_stations_france.json.gz site/v8-preview/data/ionity_direct_stations_france.json.gz
          cp site/data/atlante_direct_stations_france.json.gz site/v8-preview/data/atlante_direct_stations_france.json.gz
          rm -rf site/v8-preview/data/non_tesla_france
          cp -R site/data/non_tesla_france site/v8-preview/data/non_tesla_france
          cp site/assets/france-catalog-v8.js site/v8-preview/assets/france-catalog.js
          cp site/assets/v8-belib-pricing.js site/v8-preview/assets/v8-belib-pricing.js

          cat > site/v8-preview/assets/preview-storage.js <<'JS'
          (function(){
            if(!location.pathname.includes('/v8-preview/'))return;
            window.TCC_PREVIEW=true;
            const uiGuardKey='tcc-preview-area-ui-repair-rc48bf';
            const stableBannerText='V8 Preview · RC4.8 · rc48bm · abonnements visibles · La Borne Bleue direct calculable · tarifs directs & abonnements · données canoniques France · auto-mise à jour désactivée';
            window.addEventListener('pageshow',function(event){if(event.persisted)setTimeout(function(){window.TCCV8AreaWorkflow?.repair?.();},0);});
            if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(reg){if(String(reg.scope||'').includes('/v8-preview/'))reg.unregister().catch(function(){});});}).catch(function(){});}
            if('caches' in window){caches.keys().then(function(keys){return Promise.all(keys.filter(function(k){return /^tcc-v8|^tcc-v800/.test(k);}).map(function(k){return caches.delete(k);}));}).catch(function(){});}
            const prefix='tcc:v8-preview:';
            const proto=Storage.prototype;
            const rawGet=proto.getItem,rawSet=proto.setItem,rawRemove=proto.removeItem;
            const resetMarker=prefix+'france-catalog-reset-20260818b';
            if(rawGet.call(window.localStorage,resetMarker)!=='1'){rawRemove.call(window.localStorage,prefix+'tccStationsV701');rawSet.call(window.localStorage,resetMarker,'1');}
            function scoped(storage,key){return storage===window.localStorage?prefix+String(key):key;}
            proto.getItem=function(key){return rawGet.call(this,scoped(this,key));};
            proto.setItem=function(key,value){return rawSet.call(this,scoped(this,key),value);};
            proto.removeItem=function(key){return rawRemove.call(this,scoped(this,key));};
            document.addEventListener('DOMContentLoaded',function(){
              const header=document.querySelector('header');
              if(header&&!document.getElementById('tccPreviewBanner')){
                const banner=document.createElement('div');
                banner.id='tccPreviewBanner';
                banner.textContent=stableBannerText;
                banner.style.cssText='margin-top:7px;padding:6px 9px;border-radius:10px;background:#312710;color:#ffc76a;font-size:10px;font-weight:800;text-align:center';
                header.appendChild(banner);
              }
              const banner=document.getElementById('tccPreviewBanner');
              if(banner){
                banner.dataset.stableLabel=stableBannerText;
                banner.setAttribute('aria-label',stableBannerText);
                banner.style.fontSize='0';
                if(!document.getElementById('tccPreviewBannerStableStyle')){
                  const style=document.createElement('style');
                  style.id='tccPreviewBannerStableStyle';
                  style.textContent='#tccPreviewBanner::after{content:attr(data-stable-label);font-size:10px;font-weight:800;line-height:1.45;white-space:normal}';
                  document.head.appendChild(style);
                }
              }
              setTimeout(function(){
                const ready=function(){const row=document.getElementById('v8OriginRefreshRow');const radius=document.getElementById('simMaxDistance');const button=document.getElementById('routeButton');return !!row&&!!radius&&row.contains(radius)&&!!button&&/Mettre à jour/i.test(String(button.textContent||''));};
                if(ready()){try{sessionStorage.removeItem(uiGuardKey);}catch(e){}return;}
                const repair=window.TCCV8AreaWorkflow?.repair;
                if(typeof repair==='function'){
                  repair();
                  setTimeout(function(){if(ready())try{sessionStorage.removeItem(uiGuardKey);}catch(e){}},600);
                  return;
                }
                try{if(sessionStorage.getItem(uiGuardKey)!=='1'){sessionStorage.setItem(uiGuardKey,'1');location.reload();}}catch(e){location.reload();}
              },2500);
            });
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('site/v8-preview/index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'<script src="assets/preview-storage\.js\?v=[^"]+"></script>\n?','',html)
          tag='<script src="assets/preview-storage.js?v=rc48bm-banner-20260825"></script>\n'
          marker='<script>window.escapeHtml'
          html=html.replace(marker,tag+marker,1) if marker in html else html.replace('</head>',tag+'</head>',1)
          for name in ('v8-vehicle-profiles','v8-redesign','v8-dynamic-filter','v8-area-workflow','v8-sync-guard','v8-rc4-extensions','v8-rc4-toggle-fix','v8-combined-tariff-fix','v8-source-first-offers','v8-source-integrity','v8-ambiguous-electra-warning','v8-tariff-display-fix','v8-subscription-selection','v8-subscription-stability-fix','v8-station-status'):
              html=re.sub(rf'<script src="assets/{name}\.js\?v=[^"]+" defer></script>\n?','',html)
          html=re.sub(r'assets/france-catalog\.js\?v=[^"]+', 'assets/france-catalog.js?v=rc48-atlante-20260824', html)
          html=re.sub(r'<script src="assets/v8-e55c-pricing\.js\?v=[^"]+" defer></script>\n?','',html)
          html=re.sub(r'<script src="assets/v8-belib-pricing\.js\?v=[^"]+" defer></script>\n?','',html)
          france_tag='<script src="assets/france-catalog.js?v=rc48-atlante-20260824" defer></script>'
          html=html.replace(france_tag,france_tag+'\n<script src="assets/v8-belib-pricing.js?v=rc48-belib-1" defer></script>',1)
          html=re.sub(r'assets/v8-offer-selection\.js\?v=[^"]+', 'assets/v8-offer-selection.js?v=rc48bl-20260824', html)
          html=re.sub(r'assets/update\.js\?v=[^"]+', 'assets/update.js?v=rc48bm-20260825', html)
          html=re.sub(r'assets/v8-overlay-area-bridge\.js\?v=[^"]+', 'assets/v8-overlay-area-bridge.js?v=rc48bm-lbb-20260825', html)
          html=re.sub(r'<script src="assets/v8-operator-tariff-overlay\.js\?v=[^"]+" defer></script>\n?','',html)
          html=re.sub(r'<script src="assets/v8-evadea-band-fallback\.js\?v=[^"]+" defer></script>\n?','',html)
          html=re.sub(r'<script src="assets/v8-regional-tariff-overlay\.js\?v=[^"]+" defer></script>\n?','',html)
          offer_tag='<script src="assets/v8-offer-selection.js?v=rc48bl-20260824" defer></script>'
          injected=(
              '<script src="assets/v8-operator-tariff-overlay.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-evadea-band-fallback.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-regional-tariff-overlay.js?v=rc48am-20260821" defer></script>\n'
          )
          html=html.replace(offer_tag,injected+offer_tag,1)
          scripts=(
              '<script src="assets/v8-vehicle-profiles.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-redesign.js?v=rc48be-20260823" defer></script>\n'
              '<script src="assets/v8-dynamic-filter.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-area-workflow.js?v=rc48bf-20260823" defer></script>\n'
              '<script src="assets/v8-sync-guard.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-rc4-extensions.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-rc4-toggle-fix.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-combined-tariff-fix.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-source-integrity.js?v=rc48bl-20260824" defer></script>\n'
              '<script src="assets/v8-ambiguous-electra-warning.js?v=rc48am-20260821" defer></script>\n'
              '<script src="assets/v8-subscription-selection.js?v=rc48bl-20260824" defer></script>\n'
              '<script src="assets/v8-subscription-stability-fix.js?v=rc48bm-20260825" defer></script>\n'
              '<script src="assets/v8-station-status.js?v=rc48ax-20260823" defer></script>\n'
          )
          html=html.replace('</body>',scripts+'</body>',1)
          p.write_text(html,encoding='utf-8')

          p=Path('site/v8-preview/assets/v8-redesign.js')
          s=p.read_text(encoding='utf-8')
          old="const capWrap=wrapperFor('simBatteryCapacity');if(capWrap)capWrap.classList.add('v8-hidden-capacity');"
          new="const capWrap=$('simBatteryCapacity')?.parentElement;if(capWrap)capWrap.classList.add('v8-hidden-capacity');"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('site/v8-preview/assets/august-release.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V8.0 RC1','V8.0 RC4.8').replace("const AUG_VERSION='8.0 RC1';","const AUG_VERSION='8.0 RC4.8';")
          s=s.replace("meta.content='8001'","meta.content='8004'")
          s=s.replace('Tesla Charge Companion 8.0 RC1','Tesla Charge Companion 8.0 RC4.8')
          required=('function rankingSubscriptionEligible','function physicalResultKey','available.filter(x=>rankingSubscriptionEligible(x.st))')
          missing=[item for item in required if item not in s]
          if missing: raise SystemExit('Classement abonnements avant Top 20 manquant: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')

          p=Path('site/v8-preview/assets/v8-operator-tariff-overlay.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const REVISION='rc48[^']+';","const REVISION='rc48am';",s,1)
          s=re.sub(r'\?v=\d{8}[a-z]','?v=20260821m',s)
          p.write_text(s,encoding='utf-8')

          p=Path('site/v8-preview/assets/update.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"assets/august-release\.js\?v=[^'\"`]+", 'assets/august-release.js?v=rc48bl-20260824', s)
          sw="if('serviceWorker' in navigator){"
          if sw in s:s=s.replace(sw,"if(!window.TCC_PREVIEW&&'serviceWorker' in navigator){",1)
          needle='  let checking=false;'
          guard="  if(window.TCC_PREVIEW){window.tccCheckForAppUpdate=async()=>false;return;}\n\n"
          if guard not in s and needle in s:s=s.replace(needle,guard+needle,1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check site/v8-preview/assets/france-catalog.js
          node --check site/v8-preview/assets/v8-belib-pricing.js
          node --check site/v8-preview/assets/v8-operator-tariff-overlay.js
          node --check site/v8-preview/assets/v8-evadea-band-fallback.js
          node --check site/v8-preview/assets/v8-regional-tariff-overlay.js
          node --check site/v8-preview/assets/v8-overlay-area-bridge.js
          node --check site/v8-preview/assets/v8-fastned-station-overlay.js
          node --check site/v8-preview/assets/v8-labornebleue-operator-fallback.js
          node --check site/v8-preview/assets/v8-direct-resolver-ui.js
          node --check site/v8-preview/assets/v8-direct-resolver-followup.js
          node --check site/v8-preview/assets/v8-reference-offers.js
          node --check site/v8-preview/assets/v8-tariff-display-fix.js
          node --check site/v8-preview/assets/v8-subscription-stability-fix.js
          node --check site/v8-preview/assets/august-release.js
          node --check site/v8-preview/assets/v8-offer-selection.js
          node --check site/v8-preview/assets/v8-redesign.js
          node --check site/v8-preview/assets/v8-area-workflow.js
          node --check site/v8-preview/assets/v8-source-integrity.js
          node --check site/v8-preview/assets/v8-subscription-selection.js
          node --check site/v8-preview/assets/v8-station-status.js
          node --check site/v8-preview/assets/update.js
          node --check site/v8-preview/scripts/test_fastned_v8_release.mjs
          node --check site/v8-preview/scripts/test_labornebleue_explicit_operator_fallback.mjs
          python -m json.tool site/v8-preview/data/non_tesla_france/status_snapshot.json >/dev/null
          node site/scripts/test_e55c_v8_overlay.mjs site/v8-preview/data/e55c_station_tariffs_v1.json.gz
          (cd site && node scripts/test_e55c_v8_runtime.mjs)
          node site/scripts/test_belib_v8_overlay.mjs site/v8-preview/data/belib_station_tariffs_v1.json.gz
          (cd site && node scripts/test_belib_v8_runtime.mjs v8-preview/data/belib_station_tariffs_v1.json.gz)
          (cd site && node scripts/test_ionity_v8_runtime.mjs)
          (cd site && node scripts/test_atlante_v8_runtime.mjs)
          (cd site/v8-preview && node scripts/test_fastned_v8_release.mjs data/fastned_direct_stations_france.json.gz)
          (cd site/v8-preview && node scripts/test_labornebleue_explicit_operator_fallback.mjs)
          grep -q 'stableBannerText=.*rc48bm.*abonnements visibles.*La Borne Bleue direct calculable' site/v8-preview/assets/preview-storage.js
          grep -q 'tccPreviewBannerStableStyle' site/v8-preview/assets/preview-storage.js
          grep -q 'france-catalog.js?v=rc48-atlante-20260824' site/v8-preview/index.html
          ! grep -q 'v8-e55c-pricing.js' site/v8-preview/index.html
          grep -q 'v8-belib-pricing.js?v=rc48-belib-1' site/v8-preview/index.html
          grep -q 'v8-operator-tariff-overlay.js?v=rc48am-20260821' site/v8-preview/index.html
          grep -q 'v8-offer-selection.js?v=rc48bl-20260824' site/v8-preview/index.html
          grep -q 'v8-source-integrity.js?v=rc48bl-20260824' site/v8-preview/index.html
          grep -q 'v8-evadea-band-fallback.js?v=rc48am-20260821' site/v8-preview/index.html
          grep -q 'v8-regional-tariff-overlay.js?v=rc48am-20260821' site/v8-preview/index.html
          grep -q 'assets/update.js?v=rc48bm-20260825' site/v8-preview/index.html
          grep -q 'v8-overlay-area-bridge.js?v=rc48bm-lbb-20260825' site/v8-preview/index.html
          grep -q 'v8-subscription-stability-fix.js?v=rc48bm-20260825' site/v8-preview/index.html
          grep -q 'v8-fastned-station-overlay.js?v=rc48-fastned-20260825' site/v8-preview/assets/v8-overlay-area-bridge.js
          grep -q "const REVISION='rc48bm-lbb-runtime-stable'" site/v8-preview/assets/v8-overlay-area-bridge.js
          grep -q 'lbbFallbackApi?.applyToPrepared' site/v8-preview/assets/v8-overlay-area-bridge.js
          grep -q 'lbbFallbackApi?.addDirect' site/v8-preview/assets/v8-overlay-area-bridge.js
          grep -q 'v8-labornebleue-operator-fallback.js?v=rc48bm-20260825' site/v8-preview/assets/update.js
          grep -q 'v8-subscription-stability-fix.js?v=rc48bm-20260825' site/v8-preview/assets/update.js
          grep -q "const REVISION='rc48bm-lbb-runtime-guard'" site/v8-preview/assets/v8-labornebleue-operator-fallback.js
          grep -q "const REVISION='rc48bm-subscription-host-stable'" site/v8-preview/assets/v8-subscription-stability-fix.js
          grep -q "const REVISION='rc48bm-offer-label-isolation'" site/v8-preview/assets/v8-tariff-display-fix.js
          grep -q "const REVISION='rc48am'" site/v8-preview/assets/v8-operator-tariff-overlay.js
          grep -q "const REVISION='rc48av-fee-breakdown-fix'" site/v8-preview/assets/v8-direct-resolver-followup.js
          grep -q 'function rankingSubscriptionEligible' site/v8-preview/assets/august-release.js
          grep -q 'available.filter(x=>rankingSubscriptionEligible(x.st))' site/v8-preview/assets/august-release.js
          grep -q 'v8-station-status.js?v=rc48ax-20260823' site/v8-preview/index.html
          grep -q 'v8-subscription-selection.js?v=rc48bl-20260824' site/v8-preview/index.html
          grep -q 'belib-nonresident' site/v8-preview/data/tariff_overlay_v1.json
          grep -q 'belib-resident' site/v8-preview/data/tariff_overlay_v1.json
          grep -q 'fastned-gold' site/v8-preview/data/tariff_overlay_v1.json
          grep -q 'belibConnectedTimePerMinute' site/v8-preview/assets/v8-belib-pricing.js
          ! grep -q 'belib_station_tariffs_v1' site/index.html
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          index=Path('site/v8-preview/index.html').read_text(encoding='utf-8')
          updater=Path('site/v8-preview/assets/update.js').read_text(encoding='utf-8')
          august=Path('site/v8-preview/assets/august-release.js').read_text(encoding='utf-8')
          subscriptions=Path('site/v8-preview/assets/v8-subscription-selection.js').read_text(encoding='utf-8')
          stability=Path('site/v8-preview/assets/v8-subscription-stability-fix.js').read_text(encoding='utf-8')
          lbb=Path('site/v8-preview/assets/v8-labornebleue-operator-fallback.js').read_text(encoding='utf-8')
          integrity=Path('site/v8-preview/assets/v8-source-integrity.js').read_text(encoding='utf-8')
          tariff_display=Path('site/v8-preview/assets/v8-tariff-display-fix.js').read_text(encoding='utf-8')
          checks={
              'cache update.js rc48bm':'update.js?v=rc48bm-20260825' in index,
              'cache bridge LBB rc48bm':'v8-overlay-area-bridge.js?v=rc48bm-lbb-20260825' in index,
              'UI abonnements chargée explicitement':'v8-subscription-stability-fix.js?v=rc48bm-20260825' in index,
              'chargeur august-release rc48bl':'august-release.js?v=rc48bl-20260824' in updater,
              'chargeur fallback LBB rc48bm':'v8-labornebleue-operator-fallback.js?v=rc48bm-20260825' in updater,
              'chargeur UI abonnements rc48bm':'v8-subscription-stability-fix.js?v=rc48bm-20260825' in updater,
              'candidate guard LBB':'function installCandidate' in lbb and 'applyToPrepared' in lbb,
              'host abonnements dynamique':'function subscriptionHost' in stability and "$('augCompareFilters')" in stability,
              'roaming protégé du rematching':"isRoamingProvider" in tariff_display and "p==='electroverse'" in tariff_display,
              'option coût/km':'<option value="costPerKm">Coût au km récupéré</option>' in august,
              'tri coût/km':"mode==='costPerKm'" in august,
              'kilomètres récupérés exposés':'data-recovered-km' in august,
              'reclassement abonnements':"mode!=='costPerKm'" in subscriptions,
              'recalcul complet après sélection':'selectionChanged' in subscriptions and 'Promise.resolve(run())' in subscriptions,
              'mapping Belib centralisé':'subscriptionIdForProvider' in subscriptions and 'isStationEligible' in subscriptions,
              'intégrité source respecte sélection':'(!m.subscriptionId||selected.has(m.subscriptionId))' in integrity,
              'détail temps de branchement Belib':'connectedTimeCost' in august,
          }
          missing=[name for name,ok in checks.items() if not ok]
          if missing: raise SystemExit('Contrôles preview manquants: '+', '.join(missing))
          overlay=json.loads(Path('site/v8-preview/data/tariff_overlay_v1.json').read_text(encoding='utf-8'))
          plans={plan['id']:plan for plan in overlay.get('subscriptions',[])}
          for plan_id in ('belib-nonresident','belib-resident'):
              plan=plans.get(plan_id)
              if not plan or plan.get('runtime')!='existing_belib_direct' or plan.get('monthlyFeeLabel')!='7 €/an' or 'pricePerKwh' in plan:
                  raise SystemExit(f'Abonnement Belib invalide: {plan_id}')
          if "return'belib-nonresident'" not in subscriptions or "return'belib-resident'" not in subscriptions or 'subscriptionIdForProvider(cleanProvider(row))' not in subscriptions:
              raise SystemExit('Rattachement centralisé des lignes Belib aux abonnements absent')
          atlante=[plan for plan in overlay.get('subscriptions',[]) if plan.get('selectionId')=='atlante-go']
          expected={
              'atlante-go-atlante':(0.29,{'Atlante'}),
              'atlante-go-powerdot':(0.42,{'Powerdot','Power Dot'}),
              'atlante-go-charge-league':(0.49,{'Electra','Fastned','IONITY','Ionity'}),
          }
          if len(atlante)!=3 or sum(plan.get('control') is True for plan in atlante)!=1:
              raise SystemExit('Contrôle multi-réseaux Atlante Go invalide')
          for plan in atlante:
              price,aliases=expected.get(plan.get('id'),(None,set()))
              if price is None or plan.get('pricePerKwh')!=price or plan.get('monthlyFeeEur')!=9.99 or plan.get('defaultSelected') is not False or set(plan.get('operatorAliases',[]))!=aliases:
                  raise SystemExit(f"Palier Atlante Go invalide: {plan.get('id')}")
          fastned=plans.get('fastned-gold')
          if not fastned or fastned.get('pricePerKwh')!=0.43 or fastned.get('monthlyFeeEur')!=5.99 or fastned.get('defaultSelected') is not False:
              raise SystemExit('Abonnement Fastned Gold invalide')
          with gzip.open('site/v8-preview/data/fastned_direct_stations_france.json.gz','rt',encoding='utf-8') as handle:
              fastned_data=json.load(handle)
          if fastned_data.get('dataset')!='fastned-direct-operated-stations-france' or fastned_data.get('operator')!='Fastned' or fastned_data.get('country')!='FR':
              raise SystemExit('Dataset Fastned national invalide')
          locations=fastned_data.get('locations',[])
          counts=fastned_data.get('counts',{})
