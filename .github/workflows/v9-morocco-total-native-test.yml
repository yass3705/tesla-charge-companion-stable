name: V9 Morocco Total native regression

on:
  push:
    paths:
      - 'v9-production-runtime/assets/v9/adapters/morocco-public.js'
      - 'v9-test/assets/v9/adapters/morocco-public.js'
      - 'v9-production-runtime/data/v9/source-registry.json'
      - 'v9-test/data/v9/source-registry.json'
      - '.github/workflows/v9-morocco-total-native-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Total native overlay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
            https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/reports/morocco/totalenergies/latest-native-overlay.json \
            -o /tmp/total-native.json

      - name: Validate production and test adapters
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/total-native.json','utf8'));
          const allowed=new Set(['available','occupied','out_of_service','unknown']);
          for(const root of ['v9-production-runtime','v9-test']){
            const adapter=require('./'+root+'/assets/v9/adapters/morocco-public.js');
            if(typeof adapter.normalizeTotalNativeDataset!=='function')throw new Error(root+': native normalizer missing');
            // Morocco semantics: occupied-like stays available; fault/offline stays unavailable.
            for(const v of ['Available','Charging','Preparing','Reserved','Occupied'])if(adapter.totalNativeConnectorState(v)!=='available')throw new Error(root+': Morocco status rule failed for '+v);
            for(const v of ['Faulted','Offline','Unavailable','Inoperative'])if(adapter.totalNativeConnectorState(v)!=='out_of_service')throw new Error(root+': Morocco unavailable rule failed for '+v);
            const fresh=adapter.normalizeTotalNativeDataset(data,{
              sourceId:'morocco-totalenergies-hosts',
              statusFresh:true,
              statusGeneratedAt:data.generated_at,
              minStations:18,
              minConnectors:38
            });
            const connectorCount=fresh.reduce((n,s)=>n+(s.evses||[]).reduce((m,e)=>m+(e.connectors||[]).length,0),0);
            const pricedConnectorCount=fresh.reduce((n,s)=>n+(s.evses||[]).reduce((m,e)=>m+(e.connectors||[]).filter(c=>c.tariff&&Number.isFinite(Number(c.tariff.rate))&&c.tariff.currency==='MAD'&&c.tariff.unit==='min').length,0),0);
            if(fresh.length<18)throw new Error(root+': station count '+fresh.length);
            if(connectorCount<38)throw new Error(root+': connector count '+connectorCount);
            if(pricedConnectorCount!==connectorCount)throw new Error(root+': priced connectors '+pricedConnectorCount+'/'+connectorCount);
            if(fresh.some(st=>!(st.offers||[]).length))throw new Error(root+': station without Total native offer');
            for(const st of fresh){
              if(!allowed.has(st.status?.state))throw new Error(root+': invalid station state '+st.status?.state);
              if(!/^MA:totalenergies-host:/.test(st.canonicalId))throw new Error(root+': unstable canonical id '+st.canonicalId);
            }
            const stale=adapter.normalizeTotalNativeDataset(data,{
              sourceId:'morocco-totalenergies-hosts',
              statusFresh:false,
              statusGeneratedAt:data.generated_at,
              minStations:18,
              minConnectors:38
            });
            for(let i=0;i<fresh.length;i++){
              if(stale[i].status?.state!==fresh[i].status?.state)throw new Error(root+': stale snapshot changed latest-known status');
              if(stale[i].status?.freshness!=='stale')throw new Error(root+': stale snapshot freshness metadata missing');
            }

            let raw=fs.readFileSync('./'+root+'/data/v9/source-registry.json','utf8').trim();
            if(raw.endsWith('\\n'))raw=raw.slice(0,-2);
            const registry=JSON.parse(raw);
            const source=registry.sources.find(x=>x.id==='morocco-totalenergies-hosts');
            if(!source)throw new Error(root+': Total source missing');
            if(source.profile!=='totalenergies-native')throw new Error(root+': wrong profile '+source.profile);
            if(source.freshnessMaxMinutes!==1560)throw new Error(root+': wrong freshness');
            if(source.expectedMinStations!==18||source.expectedMinConnectors!==38)throw new Error(root+': wrong floors');
            if(!(source.capabilities||[]).includes('tariff')||source.priority?.tariff!==100)throw new Error(root+': Total tariff capability not enabled');

            const sessionEngine=require('./'+root+'/assets/v9/session-engine.js');
            const alBaida=fresh.find(st=>st.sourceStationId==='8');
            if(!alBaida)throw new Error(root+': Al Baida missing');
            const dc180=(alBaida.offers||[]).find(o=>o.connectorKinds?.includes('DC')&&Number(o.minPowerKw)===180&&Number(o.maxPowerKw)===180);
            const dc50=(alBaida.offers||[]).find(o=>o.connectorKinds?.includes('DC')&&Number(o.minPowerKw)===50&&Number(o.maxPowerKw)===50);
            if(Number(dc180?.pricing?.rules?.[0]?.pricePerMinute)!==5.004)throw new Error(root+': Al Baida 180kW tariff mismatch');
            if(Number(dc50?.pricing?.rules?.[0]?.pricePerMinute)!==3)throw new Error(root+': Al Baida 50kW tariff mismatch');
            const eval180=sessionEngine.evaluateStation(alBaida,{durationMinutes:10,energyKwh:10,targetCurrency:'MAD'},{targetCurrency:'MAD'});
            if(eval180.chargingPowerKw!==180)throw new Error(root+': Al Baida selected power '+eval180.chargingPowerKw);
            if(Math.abs((eval180.best?.total??NaN)-50.04)>1e-6)throw new Error(root+': Al Baida 180kW 10min cost '+eval180.best?.total);
            if(eval180.best?.currency!=='MAD')throw new Error(root+': Al Baida currency '+eval180.best?.currency);
            console.log(root+': OK '+fresh.length+' stations / '+connectorCount+' connectors / '+pricedConnectorCount+' priced');
          }
          NODE

      - name: Ensure production/test adapter parity
        shell: bash
        run: |
          set -euo pipefail
          cmp v9-production-runtime/assets/v9/adapters/morocco-public.js v9-test/assets/v9/adapters/morocco-public.js
