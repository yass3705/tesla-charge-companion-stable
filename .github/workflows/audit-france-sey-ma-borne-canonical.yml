name: Audit France SEY ma Borne canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/sey_ma_borne_direct_tariffs_v1.json'
      - 'scripts/materialize_france_sey_ma_borne_offers.py'
      - 'scripts/test_sey_ma_borne_materializer.py'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-sey-ma-borne-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sey-ma-borne:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate SEY source and materializer
        run: |
          python -m py_compile scripts/materialize_france_sey_ma_borne_offers.py scripts/test_sey_ma_borne_materializer.py
          python scripts/test_sey_ma_borne_materializer.py
          python - <<'PY'
          import json
          d=json.load(open('data/sey_ma_borne_direct_tariffs_v1.json',encoding='utf-8'))
          assert d['dataset']=='sey-ma-borne-direct-tariffs-france'
          assert d['networkId']=='seymaborne'
          assert d['scope']['canonicalTariffNetworkId']=='seymaborne'
          assert d['scope']['explicitPanBrandRequired'] is True
          assert d['scope']['requiresPanContractingAuthorityMatch'] is False
          assert d['effectiveFrom']=='2026-03-01' and d['verifiedAt']=='2026-09-01'
          assert d['access']['monthlySubscriptionFeeEur']==0.0
          assert d['access']['badgeRequired'] is False and d['access']['freeAlizeAppAccess'] is True
          fam={x['id']:x for x in d['tariffFamilies']}
          assert next(r for r in fam['sey-22-ac-standard']['pricingRules'] if r['scope']=='allDay')['pricePerKwh']==0.36
          assert next(r for r in fam['sey-dc-30plus-standard']['pricingRules'] if r['scope']=='allDay')['pricePerKwh']==0.46
          assert d['cardPaymentReference']['rankable'] is False
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize explicit SEY ma Borne scope
        run: |
          python scripts/materialize_france_sey_ma_borne_offers.py \
            --source data/sey_ma_borne_direct_tariffs_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate SEY canonical coverage
        run: |
          python - <<'PY'
          import gzip,json
          r=json.load(open('build/france_irve_offers/sey_ma_borne_materialization_report.json',encoding='utf-8'))
          s=r['summary']
          assert 600 <= s['eligiblePdcCount'] <= 750, s
          assert 250 <= s['eligibleStationCount'] <= 350, s
          assert s['rankableCoveredPdcCount'] >= 600, s
          assert s['rankableCoveredPdcCount'] / s['eligiblePdcCount'] >= 0.90, s
          assert s['unresolvedPdcCount'] <= 75, s
          assert s['physicalInventoryMutationCount']==0
          with gzip.open('build/france_irve_offers/sey_ma_borne_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as f: offers=json.load(f)
          rank=[x for x in offers if x['rankable']]
          refs=[x for x in offers if not x['rankable']]
          assert len(rank)==s['rankableOfferCount']==s['rankableCoveredPdcCount']
          assert len(refs)==s['referenceOfferCount']==s['rankableCoveredPdcCount']
          assert all(x['tariffNetworkId']=='seymaborne' for x in offers)
          assert all(x['selectors']['explicitPanTariffNetworkId']=='seymaborne' for x in offers)
          assert all(x['subscriptionId'] is None for x in rank)
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY

      - name: Upload SEY audit
        uses: actions/upload-artifact@v4
        with:
          name: france-sey-ma-borne-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/sey_ma_borne_materialization_report.json
            build/france_irve_offers/sey_ma_borne_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
