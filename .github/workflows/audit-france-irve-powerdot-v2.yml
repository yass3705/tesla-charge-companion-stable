name: Audit France IRVE Powerdot v2
# Read-only validation. PAN IRVE remains the only physical inventory.

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/audit_powerdot_connector_identity_v2.py'
      - 'scripts/materialize_france_powerdot_offers.py'
      - 'scripts/test_powerdot_materializer.py'
      - '.github/workflows/audit-france-irve-powerdot-v2.yml'
  pull_request:
    branches:
      - release/2026-08
    paths:
      - 'scripts/audit_powerdot_connector_identity_v2.py'
      - 'scripts/materialize_france_powerdot_offers.py'
      - 'scripts/test_powerdot_materializer.py'
      - '.github/workflows/audit-france-irve-powerdot-v2.yml'

permissions:
  contents: read

jobs:
  audit-powerdot-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Powerdot scripts and tariff semantics
        run: |
          python -m py_compile \
            scripts/audit_powerdot_irve_matching.py \
            scripts/audit_powerdot_connector_identity_v2.py \
            scripts/materialize_france_powerdot_offers.py \
            scripts/test_powerdot_materializer.py \
            scripts/build_france_irve_canonical.py \
            scripts/run_france_irve_canonical.py \
            scripts/build_effective_france_tariff_network_registry.py \
            scripts/enrich_france_irve_network_identity.py \
            scripts/run_enrich_france_irve_network_identity.py
          python scripts/test_powerdot_materializer.py

      - name: Fetch current stable Powerdot source
        run: |
          mkdir -p .tmp/powerdot
          git fetch --no-tags --depth=1 origin main
          git show origin/main:data/powerdot_direct_france.json.gz > .tmp/powerdot/powerdot_direct_france.json.gz
          python - <<'PY'
          import gzip,json
          with gzip.open('.tmp/powerdot/powerdot_direct_france.json.gz','rt',encoding='utf-8') as f:
              data=json.load(f)
          source=data.get('source') or {}
          assert source.get('sourceType') == 'direct_cpo_public_adhoc_api'
          assert source.get('roaming') is False
          assert str(source.get('emspCode') or '').strip() == ''
          assert len(data.get('chargers') or []) >= 2200
          print(json.dumps({'generatedAt':data.get('generatedAt'),'counts':data.get('counts'),'source':source},ensure_ascii=False,indent=2))
          PY

      - name: Download PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84013/download' --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84098/download' --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Build canonical PAN inventory and identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Audit Powerdot location/PDC coverage
        run: |
          python scripts/audit_powerdot_irve_matching.py \
            --powerdot-gzip .tmp/powerdot/powerdot_direct_france.json.gz \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_powerdot \
            --geo-max-m 100

      - name: Resolve safe Powerdot connector/PDC identity v2
        run: |
          python scripts/audit_powerdot_connector_identity_v2.py \
            --powerdot-gzip .tmp/powerdot/powerdot_direct_france.json.gz \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_powerdot

      - name: Validate connector identity v2
        run: |
          python - <<'PY'
          import gzip,json
          report=json.load(open('build/france_irve_powerdot/powerdot_connector_identity_report_v2.json',encoding='utf-8'))
          with gzip.open('build/france_irve_powerdot/powerdot_safe_pdc_tariff_candidates_v2.json.gz','rt',encoding='utf-8') as f:
              rows=json.load(f)
          s=report['summary']
          assert report['productionReady'] is False
          assert s['safeCanonicalPdcTariffCount'] == len(rows)
          assert s['conflictingCanonicalPdcCount'] == 0
          assert s['safeCanonicalPdcTariffCount'] >= 4500
          assert s['safeCanonicalPdcTariffPctOfReferenced'] >= 60
          assert all(row['strategy'] in {'connector_explicit_id','entry_group_uniform','location_group_uniform'} for row in rows)
          assert 'status' not in report.get('connectorExplicitPdcPayloadPaths',{})
          assert 'type' not in report.get('connectorExplicitPdcPayloadPaths',{})
          assert 'connectorNumber' not in report.get('connectorExplicitPdcPayloadPaths',{})
          print(json.dumps(s,ensure_ascii=False,indent=2))
          print('explicit paths',json.dumps(report.get('connectorExplicitPdcPayloadPaths',{}),ensure_ascii=False))
          print('strategies',json.dumps(report.get('safeAssignmentStrategies',{}),ensure_ascii=False))
          PY

      - name: Materialize safe Powerdot offers by canonical PDC
        run: |
          python scripts/materialize_france_powerdot_offers.py \
            --safe-candidates build/france_irve_powerdot/powerdot_safe_pdc_tariff_candidates_v2.json.gz \
            --canonical-dir build/france_irve_identity \
            --powerdot-gzip .tmp/powerdot/powerdot_direct_france.json.gz \
            --out-dir build/france_irve_powerdot

      - name: Validate materialized Powerdot offers
        run: |
          python - <<'PY'
          import gzip,json
          identity=json.load(open('build/france_irve_powerdot/powerdot_connector_identity_report_v2.json',encoding='utf-8'))
          report=json.load(open('build/france_irve_powerdot/powerdot_materialization_report.json',encoding='utf-8'))
          with gzip.open('build/france_irve_powerdot/powerdot_pdc_offers_v1_1.json.gz','rt',encoding='utf-8') as f:
              offers=json.load(f)
          s=report['summary']
          assert report['productionReady'] is False
          assert s['materializedOfferCount'] == len(offers)
          assert s['safeCandidateCount'] == identity['summary']['safeCanonicalPdcTariffCount']
          assert s['canonicalPdcMissingCount'] == 0
          assert len({row['pdcId'] for row in offers}) == len(offers)
          assert all(row['operatorId']=='powerdot' and row['tariffNetworkId']=='powerdot' for row in offers)
          assert all(row['provenance']['physicalInventory']=='PAN IRVE static' for row in offers)
          assert all(row['matchMethod'].startswith('powerdot_') for row in offers)
          assert all(row['offerType']=='direct' and row['subscriptionId'] is None for row in offers)
          assert all(not row['rankable'] or row['pricingComponents']['pricePerKwh']>0 for row in offers)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Print unresolved heterogeneous sample
        if: always()
        run: |
          python - <<'PY'
          import json,os
          path='build/france_irve_powerdot/powerdot_connector_identity_report_v2.json'
          if not os.path.exists(path): raise SystemExit(0)
          report=json.load(open(path,encoding='utf-8'))
          print('summary',json.dumps(report.get('summary',{}),ensure_ascii=False,indent=2))
          samples=report.get('heterogeneousConnectorSchemaSamples') or []
          if samples:
              print('first heterogeneous schema sample')
              print(json.dumps(samples[0],ensure_ascii=False,indent=2))
          unresolved=[row for row in report.get('diagnostics',[]) if row.get('unresolvedPdcIds')]
          print('unresolved diagnostic count',len(unresolved))
          for row in unresolved[:10]:
              print(json.dumps(row,ensure_ascii=False))
          PY

      - name: Upload Powerdot v2 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-irve-powerdot-v2-audit
          path: |
            build/france_irve_powerdot/
            build/france_irve_identity/network_gap_report.json
            build/france_irve/operator_gap_report.json
          if-no-files-found: warn
          retention-days: 14
