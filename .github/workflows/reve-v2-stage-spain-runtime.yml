name: REVE V2 stage Spain runtime data
on:
  push:
    paths: ['.github/workflows/reve-v2-stage-spain-runtime.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reve-v2-pricing-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build from validated REVE source branch
        run: |
          git clone --depth 1 --branch reve-v2-web-extraction https://github.com/yass3705/tesla-stations-updater-test.git /tmp/reve
          cd /tmp/reve
          node scripts/reve-v2-build-tcc.mjs
          cd "$GITHUB_WORKSPACE"
          rm -rf v9-production-runtime/data/v9/spain-static
          mkdir -p v9-production-runtime/data/v9/spain-static
          cp /tmp/reve/data/reve-v2/tcc-integration/all.json.gz v9-production-runtime/data/v9/spain-static/
          cp /tmp/reve/data/reve-v2/tcc-integration/tile_*.json.gz v9-production-runtime/data/v9/spain-static/
          cp /tmp/reve/data/reve-v2/tcc-integration/spain-static-manifest.json v9-production-runtime/data/v9/spain-static/manifest.json
          cp /tmp/reve/data/reve-v2/tcc-integration/spain-reve-offers.json v9-production-runtime/data/v9/spain-reve-offers.json
          du -h v9-production-runtime/data/v9/spain-reve-offers.json v9-production-runtime/data/v9/spain-static/all.json.gz
          test $(stat -c%s v9-production-runtime/data/v9/spain-reve-offers.json) -lt 95000000
          node tests/reve-v2-pricing-thresholds.test.cjs
          node tests/reve-v2-identity-scope.test.cjs
          node tests/reve-v2-spain-runtime-e2e.test.cjs
      - name: Persist staged Spain data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-production-runtime/data/v9/spain-static v9-production-runtime/data/v9/spain-reve-offers.json
          git commit -m "data(v9): stage validated Spain REVE runtime dataset" || exit 0
          git push origin HEAD:reve-v2-pricing-engine
