name: V8 Powerdot France guard

on:
  push:
    branches: ["main"]
    paths: ["data/v8-powerdot-fr-filter.trigger"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter foreign Powerdot rows without poisoning France
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/france-catalog-v8.js')
          s=p.read_text(encoding='utf-8')
          old="""      if(data.chargers.some(entry=>entry?.location?.countryCode!=='FR'))throw new Error('Station Powerdot hors France');
      if(data.chargers.some(entry=>(entry?.charger?.connectors||[]).some(connector=>connector?.tariff?.subscriptionActive===true)))throw new Error('Tarif abonné présent dans la base Powerdot directe');
      window.TCC_POWERDOT_DIRECT_CATALOG_V1=data;
      return data;"""
          new="""      const sourceChargers=data.chargers;
      const frenchChargers=sourceChargers.filter(entry=>entry?.location?.countryCode==='FR');
      if(frenchChargers.length<2200)throw new Error(`Inventaire Powerdot France incomplet (${frenchChargers.length})`);
      if(frenchChargers.some(entry=>(entry?.charger?.connectors||[]).some(connector=>connector?.tariff?.subscriptionActive===true)))throw new Error('Tarif abonné présent dans la base Powerdot directe');
      const filtered={...data,chargers:frenchChargers,counts:{...(data.counts||{}),sourceApiSuccessChargers:sourceChargers.length,excludedForeignChargers:sourceChargers.length-frenchChargers.length}};
      window.TCC_POWERDOT_DIRECT_CATALOG_V1=filtered;
      return filtered;"""
          if old in s:
              s=s.replace(old,new,1)
          assert "const frenchChargers=sourceChargers.filter(entry=>entry?.location?.countryCode==='FR');" in s
          p.write_text(s,encoding='utf-8')
          PY

          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_loader.mjs
          node scripts/test_powerdot_v8_runtime.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/france-catalog-v8.js
          if git diff --cached --quiet; then
            echo 'Powerdot France guard already applied.'
          else
            git commit -m 'fix(v8): keep French Powerdot data when foreign rows leak in'
            git push origin HEAD:main
          fi
