name: V9 shadow parity

on:
  pull_request:
    paths:
      - 'assets/v9/**'
      - 'v9-shadow/**'
      - 'tests/v9-shadow-parity.test.cjs'
      - 'tests/v9-shadow-session-parity.test.cjs'
      - '.github/workflows/v9-shadow-parity.yml'
  push:
    branches: [main, 'refactor/unified-data-engine-v9']
    paths:
      - 'assets/v9/**'
      - 'v9-shadow/**'
      - 'tests/v9-shadow-parity.test.cjs'
      - 'tests/v9-shadow-session-parity.test.cjs'
      - '.github/workflows/v9-shadow-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check assets/v9/parity-engine.js
          node --check assets/v9/v8-shadow-adapter.js
          node --check tests/v9-shadow-parity.test.cjs
          node --check tests/v9-shadow-session-parity.test.cjs
          node --check v9-shadow/app.js
      - name: Run station identity parity contract
        run: node tests/v9-shadow-parity.test.cjs
      - name: Run full session parity contract
        run: node tests/v9-shadow-session-parity.test.cjs
