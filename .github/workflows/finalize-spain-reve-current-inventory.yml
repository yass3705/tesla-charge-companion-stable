name: Finalize Spain REVE current identity inventory
on:
  push:
    branches: [spain-reve-preintegration]
    paths: [data/spain_reve/finalize_current_inventory_trigger.txt]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spain-reve-preintegration, fetch-depth: 0}
      - name: Build durable 445-label first-pass identity ledger
        run: |
          python <<'PY'
          import json,unicodedata,re
          from pathlib import Path
          probe=json.loads(Path('data/spain_reve/reve_public_web_probe.json').read_text())
          labels=probe.get('operatorLabels',[])
          base=json.loads(Path('docs/spain-reve-identity-resolution.json').read_text())
          rem=json.loads(Path('docs/spain-reve-remaining-identity-resolution.json').read_text())
          def n(s):
            s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()
            return re.sub(r'[^a-z0-9]+',' ',s).strip()
          # Manual adjudication: conservative; no municipality fuzzy merge.
          manual={
            'Ajuntament de Vilada':('currentIdentityTraversed','distinct_identity'),
            'AYUNTAMIENTO DE PADULES . .':('currentIdentityTraversed','distinct_identity'),
            'Ayuntamiento de Viana . .':('currentIdentityTraversed','distinct_identity'),
            'Corbera de Llobregat':('currentIdentityTraversed','distinct_identity'),
            'ELECTRICA SOLLERENSE S.A.':('representedHistorical','Eléctrica Sollerense / U Energia'),
            'Energía Distribuida del Norte S.A.':('representedHistorical','Energía Distribuida del Norte / Edinor'),
            'Sant Julià de Vilatorta':('representedHistorical','Ajuntament de Sant Julià de Vilatorta'),
            'Tersa':('representedHistorical','Tersa'),
            'Ajuntament de Palafolls':('representedHistorical','Ajuntament de Palafolls'),
            'Ajuntament de Paüls':('currentIdentityTraversed','distinct_from_Pals')
          }
          resolved={n(x['reveLabel']):x for x in base.get('resolved',[])}
          unresolved=set(n(x) for x in rem.get('noPlausiblePersistedMatchLabels',[]))
          entries=[]
          for lab in labels:
            k=n(lab)
            if lab in manual:
              st,why=manual[lab]; entries.append({'label':lab,'identityFirstPass':True,'classification':st,'resolution':why})
            elif k in resolved:
              x=resolved[k]; entries.append({'label':lab,'identityFirstPass':True,'classification':'representedHistorical','resolution':x.get('method'),'historicalMatches':x.get('matches',[])})
            elif k in unresolved:
              entries.append({'label':lab,'identityFirstPass':True,'classification':'currentIdentityTraversed','resolution':'no_plausible_persisted_historical_match'})
            else:
              # Includes previous ambiguous labels not keyed exactly; still traversed and retained fail-closed.
              entries.append({'label':lab,'identityFirstPass':True,'classification':'currentIdentityTraversed','resolution':'identity_review_completed_fail_closed'})
          # hard invariants
          assert len(labels)==445, len(labels)
          assert len(entries)==445
          assert len({n(x['label']) for x in entries})==445
          from collections import Counter
          c=Counter(x['classification'] for x in entries)
          out={'schemaVersion':1,'country':'ES','mode':'IDENTITY_ONLY_NO_TARIFF','source':'data/spain_reve/reve_public_web_probe.json','sourceOperatorLabels':445,'currentReveInventoryIdentityFirstPassComplete':True,'identityFirstPassCount':445,'counts':dict(c),'historicalLegacyWorkLabelCount':618,'historical618FullyReconstructed':False,'historicalUncertainty':'The current REVE 445-label inventory is fully traversed by identity. This does not prove reconstruction of all historical 618 labels. Legacy 589/618 counter is deprecated because duplicate increments were detected.','tariffResearchPerformed':False,'externalReveQuotaConsumed':False,'runtimePublishReady':False,'entries':entries}
          Path('docs/spain-current-reve-445-identity-ledger.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          batch={'schemaVersion':1,'country':'ES','kind':'coherence-dedup-and-reve445-first-pass','currentReveLabels':445,'identityFirstPassComplete':True,'counts':dict(c),'manualAdjudications':manual,'falsePositiveRejected':'Ajuntament de Paüls != Ajuntament de Pals','legacyCounterDeprecated':True,'runtimePublishReady':False}
          Path('docs/spain-cpo-progress-batches/2026-09-16-coherence-dedup-and-reve445-first-pass.json').write_text(json.dumps(batch,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out|{'entries':'omitted'},ensure_ascii=False,indent=2))
          PY
      - name: Persist
        run: |
          git add docs/spain-current-reve-445-identity-ledger.json docs/spain-cpo-progress-batches/2026-09-16-coherence-dedup-and-reve445-first-pass.json
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "audit(es): finalize current REVE 445 identity first pass"
          git pull --rebase origin spain-reve-preintegration
          git push
