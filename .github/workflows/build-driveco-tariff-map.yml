name: Build DRIVECO EVSE tariff map

on:
  workflow_dispatch:
  push:
    branches: ["release/2026-08"]
    paths:
      - "scripts/build_driveco_evse_tariffs.py"
      - ".github/workflows/build-driveco-tariff-map.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: build-driveco-tariff-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Build conservative DRIVECO map
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_driveco_evse_tariffs.py
          python scripts/build_driveco_evse_tariffs.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/driveco_evse_tariffs_v1.json').read_text(encoding='utf-8'))
          assert p['operator']=='DRIVECO'
          assert p['country']=='FR'
          assert p['schemaVersion']=='1.1.0'
          assert p['sourcePolicy']['operatorDirectOnly'] is True
          assert p['sourcePolicy']['roamingExcluded'] is True
          assert p['sourcePolicy']['headlineReferencePricesNeverUsedAsFallback'] is True
          assert p['sourcePolicy']['matrixOSFInterpretedOnlyForValidatedPatterns'] is True
          assert p['sourcePolicy']['unvalidatedMultiTierMatrixOSFExcludedFromRanking'] is True
          assert p['validatedInventory']['exactEnergyPriceEvseCount']==1601
          assert p['validatedInventory']['qualichargeNumericCandidateRowsHeldBack']==184
          assert len(p['evses'])==1601
          assert all(v['energyPriceExact'] is True for v in p['evses'].values())
          assert all(v['rankable'] == v['fullSessionCostSafe'] for v in p['evses'].values())
          safe=[v for v in p['evses'].values() if v['rankable']]
          assert len(safe)==p['validatedInventory']['fullSessionCostSafeEvseCount']
          assert p['validatedInventory']['validatedSingleMatrixEvseCount'] > 0
          for v in safe:
              if v.get('matrixOSFRaw'):
                  o=v.get('occupancy') or {}
                  assert o.get('trigger')=='connected_after_charge_end'
                  assert o.get('graceMinutes')==15
                  assert abs(float(o.get('ratePerMinuteEur'))-0.20)<1e-9
          for v in p['evses'].values():
              if not v['rankable']:
                  assert v['rankingBlockReason'] in ('driveco_matrix_osf_semantics_unvalidated','driveco_matrix_osf_multi_tier_semantics_unvalidated')
          fp=p['firstPartyAppValidation']
          assert fp['rules']['graceMinutes']==15
          assert abs(fp['rules']['ratePerMinuteEur']-0.20)<1e-9
          assert fp['rules']['trigger']=='connected_after_charge_end'
          print('DRIVECO first-party validated EVSE map OK')
          print(json.dumps(p['validatedInventory'], ensure_ascii=False, indent=2))
          PY

      - name: Publish map on release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/driveco_evse_tariffs_v1.json
          if git diff --cached --quiet; then echo "No DRIVECO map changes"; exit 0; fi
          git commit -m "data(v8): publish first-party validated DRIVECO EVSE tariff map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin release/2026-08
            if git push origin HEAD:release/2026-08; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
