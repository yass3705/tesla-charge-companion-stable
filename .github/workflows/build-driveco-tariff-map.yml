name: Build DRIVECO EVSE tariff map

on:
  workflow_dispatch:
  push:
    branches: ["release/2026-08"]
    paths:
      - "scripts/build_driveco_evse_tariffs.py"
      - "scripts/merge_driveco_qualicharge_validated.py"
      - ".github/workflows/build-driveco-tariff-map.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: build-driveco-tariff-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Build conservative DRIVECO map
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_driveco_evse_tariffs.py scripts/merge_driveco_qualicharge_validated.py
          python scripts/build_driveco_evse_tariffs.py
          python scripts/merge_driveco_qualicharge_validated.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/driveco_evse_tariffs_v1.json').read_text(encoding='utf-8'))
          assert p['operator']=='DRIVECO'
          assert p['country']=='FR'
          assert p['schemaVersion']=='1.2.0'
          assert p['sourcePolicy']['operatorDirectOnly'] is True
          assert p['sourcePolicy']['roamingExcluded'] is True
          assert p['sourcePolicy']['headlineReferencePricesNeverUsedAsFallback'] is True
          assert p['sourcePolicy']['matrixOSFInterpretedOnlyForValidatedPatterns'] is True
          assert p['sourcePolicy']['unvalidatedMatrixOSFExcludedFromRanking'] is True
          assert p['sourcePolicy']['firstPartyScreenshotPromotionOnlyByWhitelistedEvse'] is True
          assert p['sourcePolicy']['qualichargeNumericTariffsExcludedUntilVatSemanticsValidated'] is False
          assert p['sourcePolicy']['qualichargeNumericTtcTransformValidated'] is True
          assert p['sourcePolicy']['qualichargeNumericOccupancyNotInferred'] is True
          inv=p['validatedInventory']
          assert inv['sourceResolvedEnergyEvseCount']==1601
          assert inv['sourceUnresolvedRows']==3841
          assert inv['firstPartyPromotedUnresolvedEvseCount']==10
          assert inv['fullSessionCostSafeEvseCount']==1607
          assert inv['validatedSingleMatrix020EvseCount']==715
          assert inv['validatedSingleMatrix030EvseCount']==172
          assert inv['validatedMultiTierMatrix020EvseCount']==710
          assert inv['unresolvedMultiTierMatrixEvseCount']==4
          assert inv['qualichargeNumericCandidateRowsHeldBack']==0
          assert inv['qualichargeNumericValidatedRows']==184
          assert inv['qualichargeNumericValidatedRawCounts']=={'0.45':6,'0.4583':156,'0.4917':22}
          assert inv['exactEnergyPriceEvseCount']==len(p['evses'])
          assert inv['exactEnergyPriceEvseCount']>=1611
          assert inv['qualichargeNumericOverlapWithExistingEvse']+inv['qualichargeNumericNewExactEnergyEvse']==184
          assert all(v['energyPriceExact'] is True for v in p['evses'].values())
          assert all(v['rankable'] == v['fullSessionCostSafe'] for v in p['evses'].values())
          safe=[v for v in p['evses'].values() if v['rankable']]
          assert len(safe)==1607
          for v in safe:
              o=v.get('occupancy') or {}
              assert o.get('trigger')=='connected_after_charge_end'
              assert o.get('graceMinutes')==15
              assert any(abs(float(o.get('ratePerMinuteEur'))-x)<1e-9 for x in (0.20,0.30))
          q=p['qualichargeNumericValidation']
          assert q['vatMultiplier']==1.20
          assert q['validatedMappings']=={'0.45':0.54,'0.4583':0.55,'0.4917':0.59}
          assert q['occupancyGeneralization'] is False
          print('DRIVECO validated EVSE + QualiCharge energy map OK')
          print(json.dumps(inv, ensure_ascii=False, indent=2))
          PY

      - name: Publish map on release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/driveco_evse_tariffs_v1.json
          if git diff --cached --quiet; then echo "No DRIVECO map changes"; exit 0; fi
          git commit -m "data(v8): publish validated DRIVECO EVSE tariff map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin release/2026-08
            if git push origin HEAD:release/2026-08; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
