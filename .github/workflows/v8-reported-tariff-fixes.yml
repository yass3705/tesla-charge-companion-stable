name: Repair reported V8 tariff regressions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v8-reported-tariff-fixes.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair main Powerdot semantics and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/france-catalog-v8.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const POWERDOT_URL='../data/powerdot_direct_france.json.gz';","const POWERDOT_URL='data/powerdot_direct_france.json.gz';")
          s=s.replace("const ETOTEM_URL='../data/etotem_direct_tariffs_france.json.gz';","const ETOTEM_URL='data/etotem_direct_tariffs_france.json.gz';")
          old="""  function powerdotConnectorKind(connector){
    const type=Number(connector?.type||0);
    if(type===2)return 'AC';
    if(type===1)return 'DC';
    return Number(connector?.maxPowerKw||0)<=22.5?'AC':'DC';
  }"""
          new="""  function powerdotConnectorKind(connector){
    const type=Number(connector?.type||0);
    // API Powerdot: type 1 = AC, type 2 = DC. La puissance ne sert que de
    // repli lorsque le type n'est pas fourni par la source opérateur.
    if(type===1)return 'AC';
    if(type===2)return 'DC';
    return Number(connector?.maxPowerKw||0)<=22.5?'AC':'DC';
  }"""
          if old in s:s=s.replace(old,new,1)
          elif "if(type===1)return 'AC';" not in s:raise SystemExit('Powerdot connector-kind block not found')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/test_powerdot_v8_runtime.mjs')
          t=p.read_text(encoding='utf-8')
          marker="const firstGrill=strict.find(station=>/first grill 45/i.test(station.name));"
          regression="""const orgeval=strict.find(station=>/marche frais - orgeval/i.test(station.name));assert(orgeval,'Marché Frais Orgeval absent');
const orgevalDirect=(orgeval.chargingConfigurations||[]).filter(config=>config.powerdotDirect);
assert(orgevalDirect.some(config=>config.kind==='AC'&&Number(config.powerKw)===22&&Number(config.pricing?.rules?.[0]?.pricePerKwh)===.44),'Orgeval AC 22 kW Powerdot != 0,44 ou mal classé');
assert(orgevalDirect.some(config=>config.kind==='DC'&&Number(config.powerKw)===200&&Number(config.pricing?.rules?.[0]?.pricePerKwh)===.59),'Orgeval DC 200 kW Powerdot != 0,59 ou mal classé');
"""
          if regression.strip() not in t:
              if marker not in t:raise SystemExit('Powerdot regression insertion marker missing')
              t=t.replace(marker,regression+marker,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_runtime.mjs

      - name: Commit main fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/france-catalog-v8.js scripts/test_powerdot_v8_runtime.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(v8): correct Powerdot connector semantics and local data paths'
            git push origin HEAD:main
          fi

      - name: Repair release Belib subscription gating
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/2026-08
          git worktree add ../release -B release/2026-08 origin/release/2026-08
          python - <<'PY'
          from pathlib import Path
          root=Path('../release')
          for rel in ('assets/v8-offer-selection.js','assets/v8-subscription-selection.js'):
              p=root/rel;s=p.read_text(encoding='utf-8')
              old="""    if(provider.includes('belib direct abonne non resident'))return'belib-nonresident';
    if(provider.includes('belib direct abonne resident'))return'belib-resident';"""
              new="""    if(provider.includes('belib direct abonne non resident')||provider==='abonne non resident')return'belib-nonresident';
    if(provider.includes('belib direct abonne resident')||provider==='abonne resident paris')return'belib-resident';"""
              if old in s:s=s.replace(old,new,1)
              elif "provider==='abonne resident paris'" not in s:raise SystemExit(f'Belib mapping block not found in {rel}')
              p.write_text(s,encoding='utf-8')

          p=root/'scripts/test_v8_subscription_ranking.mjs';s=p.read_text(encoding='utf-8')
          marker="assert.equal(subscriptions.subscriptionIdForProvider('Belib’ direct — Visiteur'), '');"
          extra="""assert.equal(subscriptions.subscriptionIdForProvider('Abonné résident Paris'), 'belib-resident');
assert.equal(subscriptions.subscriptionIdForProvider('Abonné non-résident'), 'belib-nonresident');
"""
          if extra.strip() not in s:
              if marker not in s:raise SystemExit('Belib short-label test marker missing')
              s=s.replace(marker,marker+'\n'+extra,1)
          marker2="assert.equal(collapsed[0].st._offerComparison.offers.length, 3, 'Les offres abonnées restent affichables.');"
          extra2="""
const shortLabelVariants = [
  variant('Abonné résident Paris', 5),
  variant('Abonné non-résident', 6),
  variant('Visiteur', 10),
];
storage.set('tccSubscriptionsV1', JSON.stringify({ selected: [] }));
collapsed = offers.collapseOfferVariants(shortLabelVariants);
assert.equal(collapsed[0].r.total, 10, 'Les libellés UI Belib courts ne doivent jamais activer un abonnement non sélectionné.');
"""
          if extra2.strip() not in s:
              if marker2 not in s:raise SystemExit('Belib short-label ranking marker missing')
              s=s.replace(marker2,marker2+extra2,1)
          p.write_text(s,encoding='utf-8')
          PY
          (cd ../release && node --check assets/v8-offer-selection.js && node --check assets/v8-subscription-selection.js && node scripts/test_v8_subscription_ranking.mjs)

      - name: Commit release fixes
        shell: bash
        run: |
          set -euo pipefail
          cd ../release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v8-offer-selection.js assets/v8-subscription-selection.js scripts/test_v8_subscription_ranking.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(v8): keep Belib subscriptions strictly opt-in for UI labels'
            git push origin HEAD:release/2026-08
          fi
