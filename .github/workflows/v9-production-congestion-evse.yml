name: Validate TCC V9 Electra EVSE congestion pricing
on:
  push:
    branches: [main]
    paths:
      - "v9-production-runtime/assets/v9/pricing-engine.js"
      - "tests/v9-production-congestion-evse.test.cjs"
      - ".github/workflows/v9-production-congestion-evse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pricing regression
        run: |
          node tests/v9-production-congestion-evse.test.cjs
          node tests/v9-production-ocpi-duration-pricing.test.cjs
          node tests/v9-production-bootstrap.test.cjs
