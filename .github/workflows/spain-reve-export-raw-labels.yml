name: Spain REVE offline raw CPO label snapshot

on:
  push:
    branches: ["spain-reve-preintegration"]
    paths:
      - ".github/workflows/spain-reve-export-raw-labels.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spain-reve-preintegration
          fetch-depth: 1

      - name: Extract raw CPO labels from persisted REVE locations snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, pathlib, re
          from collections import defaultdict

          src = pathlib.Path('data/spain_reve/reve_locations_raw.json.gz')
          cov_path = pathlib.Path('data/spain_reve/coverage.json')
          out = pathlib.Path('data/spain_reve/raw_cpo_labels_snapshot.json')
          if not src.exists() or not cov_path.exists():
              raise SystemExit('required persisted REVE inputs missing')

          with gzip.open(src, 'rt', encoding='utf-8') as f:
              root = json.load(f)
          coverage = json.loads(cov_path.read_text(encoding='utf-8'))
          canonical_by_party = {
              str(x.get('partyId') or '').strip(): str(x.get('cpoName') or '').strip()
              for x in ((coverage.get('cpos') or {}).get('items') or [])
              if str(x.get('partyId') or '').strip() and str(x.get('cpoName') or '').strip()
          }

          label_parties = defaultdict(set)
          evidence_paths = defaultdict(set)

          def sval(v):
              return v.strip() if isinstance(v, str) else ''

          def party_from(d):
              for k in ('party_id','partyId','partyID','cpo_party_id','cpoPartyId'):
                  v=sval(d.get(k))
                  if v: return v
              return ''

          def label_from(d):
              for k in ('cpo_name','cpoName','cpo_name_display','operator_name','operatorName'):
                  v=sval(d.get(k))
                  if v: return v
              return ''

          def inspect_cpo_dict(cpo, path):
              if not isinstance(cpo, dict): return
              label=''
              for k in ('name','cpo_name','cpoName','operator_name','operatorName'):
                  label=sval(cpo.get(k))
                  if label: break
              party=party_from(cpo)
              if label:
                  if party: label_parties[label].add(party)
                  evidence_paths[label].add(path)

          def walk(obj, path='$'):
              if isinstance(obj, dict):
                  if isinstance(obj.get('cpo'), dict):
                      inspect_cpo_dict(obj['cpo'], path+'.cpo')
                  label=label_from(obj)
                  party=party_from(obj)
                  if label:
                      if party: label_parties[label].add(party)
                      evidence_paths[label].add(path)
                  # Common REVE business_details shape.
                  bd=obj.get('business_details') or obj.get('businessDetails')
                  if isinstance(bd, dict):
                      label=sval(bd.get('name'))
                      if label:
                          p=party or party_from(bd)
                          if p: label_parties[label].add(p)
                          evidence_paths[label].add(path+'.business_details')
                  for k,v in obj.items():
                      walk(v, path+'.'+str(k))
              elif isinstance(obj, list):
                  for i,v in enumerate(obj):
                      walk(v, f'{path}[{i}]')

          walk(root)

          # If the recursive schema-specific pass found little, detect dicts containing both
          # a party identifier and a generic name. This remains fail-closed to same-object pairs.
          if len(label_parties) < 100:
              def fallback(obj, path='$'):
                  if isinstance(obj, dict):
                      p=party_from(obj)
                      n=sval(obj.get('name'))
                      if p and n:
                          label_parties[n].add(p); evidence_paths[n].add(path+'.name')
                      for k,v in obj.items(): fallback(v, path+'.'+str(k))
                  elif isinstance(obj,list):
                      for i,v in enumerate(obj): fallback(v,f'{path}[{i}]')
              fallback(root)

          items=[]
          for label in sorted(label_parties, key=lambda s:s.casefold()):
              parties=sorted(label_parties[label])
              canon=sorted({canonical_by_party[p] for p in parties if p in canonical_by_party})
              if len(parties)==1 and len(canon)==1:
                  hint='canonical' if label==canon[0] else 'supersededAlias'
              elif not parties:
                  hint='unmapped'
              else:
                  hint='ambiguous'
              items.append({
                  'label': label,
                  'partyIds': parties,
                  'canonicalByPartyId': canon,
                  'classificationHint': hint,
                  'evidencePathSamples': sorted(evidence_paths[label])[:3],
              })

          summary={
              'schemaVersion':1,
              'country':'ES',
              'source':'persisted data/spain_reve/reve_locations_raw.json.gz',
              'sourceBlobSha':'957335b7b96006fe853a3cf61d1ba314a5e88546',
              'provenance':'currentDurableRawLocationsSnapshot_not_historical618_membership_proof',
              'distinctRawLabels':len(items),
              'canonicalLabelCount':sum(1 for x in items if x['classificationHint']=='canonical'),
              'deterministicAliasCount':sum(1 for x in items if x['classificationHint']=='supersededAlias'),
              'ambiguousCount':sum(1 for x in items if x['classificationHint']=='ambiguous'),
              'unmappedCount':sum(1 for x in items if x['classificationHint']=='unmapped'),
              'items':items,
          }
          if len(items) < 100:
              raise SystemExit(f'fail closed: only {len(items)} labels extracted; schema inspection required')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k!='items'},ensure_ascii=False,indent=2))
          PY

      - name: Commit durable snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spain_reve/raw_cpo_labels_snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
            exit 0
          fi
          git commit -m "data(es): persist raw REVE CPO label snapshot"
          git push origin HEAD:spain-reve-preintegration
