name: Publish V8 RC4.8 — one shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc48-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch release branch — source-first tariff labels and vehicle pack details
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/2026-08
          git worktree add /tmp/tcc-rc origin/release/2026-08
          cd /tmp/tcc-rc

          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('assets/august-release.js','utf8');
          const old=`  function tariffLabel(st,time){
    let rules=legacyPricingToRules(st.pricing),rule=ruleForMinute(rules,mins(time));
    if(!rule)return'Tarif non disponible';
    let c=rule.currency||'EUR';
    if(rule.billing==='kwh')return\`${'${Number(rule.pricePerKwh||0).toFixed(3).replace(/0+$/,'').replace(/\\.$/,'')} ${c}/kWh'}\`;
    if(rule.billing==='minute')return\`${'${Number(rule.chargePerMinute||0).toFixed(3).replace(/0+$/,'').replace(/\\.$/,'')} ${c}/min'}\`;
    if(rule.billing==='powerMinute')return\`Tarif/min selon puissance (${'${c}'})\`;
    return'Tarif variable';
  }`;
          const neu=`  function tariffLabel(st,time){
    // Source-first: the configuration being rendered already carries the exact
    // pricing object. Build the commercial label from that object directly;
    // never rematch the DOM card to a station afterwards.
    let rules=legacyPricingToRules(st.pricing),rule=ruleForMinute(rules,mins(time));
    if(!rule)return'Tarif non disponible';
    let c=rule.currency||'EUR',parts=[];
    const fmt=(v,d=3)=>Number(v||0).toFixed(d).replace(/0+$/,'').replace(/\\.$/,'');
    if(Number(rule.pricePerKwh||0)>0)parts.push(\`${'${fmt(rule.pricePerKwh)} ${c}/kWh'}\`);
    if(Number(rule.chargePerMinute||0)>0)parts.push(\`${'${fmt(rule.chargePerMinute)} ${c}/min'}\`);
    if(Number(rule.connectionFee||0)>0)parts.push(\`${'${fmt(rule.connectionFee,2)} ${c} fixe'}\`);
    if(Number(rule.idlePerMinute||0)>0)parts.push(\`${'${fmt(rule.idlePerMinute)} ${c}/min après charge'}\`);
    if(Number(rule.afterMinutesRate||0)>0){
      const threshold=Math.max(0,Number(rule.afterMinutesThreshold||0));
      parts.push(\`${'${fmt(rule.afterMinutesRate)} ${c}/min après ${Math.round(threshold)} min'}\`);
    }
    if(rule.billing==='powerMinute'&&!parts.length)parts.push(\`Tarif/min selon puissance (${'${c}'})\`);
    let label=parts.length?parts.join(' + '):'Tarif variable';
    if(rule.scope==='timeWindow'&&rule.start&&rule.end)label+=\` · créneau ${'${rule.start}–${rule.end}'}\`;
    return label;
  }`;
          if(!s.includes(old))throw new Error('tariffLabel marker missing');
          s=s.replace(old,neu);
          fs.writeFileSync('assets/august-release.js',s);

          let r=fs.readFileSync('assets/v8-redesign.js','utf8');
          const oldSpec=`    if($('v8VehicleSpec'))$('v8VehicleSpec').innerHTML=\`Référence Companion : <b>${'${num(trim?.referenceConsumption).toFixed(1)}'} kWh/100 km</b> · AC <b>${'${num(trim?.acMaxKw,11)}'} kW</b> · DC <b>${'${num(trim?.dcMaxKw,175)}'} kW max</b>. Capacité batterie : <b>saisie utilisateur</b>.\`;`;
          const newSpec=`    if($('v8VehicleSpec')){\n      const pack=[trim?.batteryRef?\`réf. ${'${esc(trim.batteryRef)}'}\`:null,trim?.batteryMaker?esc(trim.batteryMaker):null,trim?.chemistry?esc(trim.chemistry):null,Number.isFinite(Number(trim?.batteryTotalKwh))?\`${'${Number(trim.batteryTotalKwh).toFixed(1).replace(/\\.0$/,'')}'} kWh total\`:null,trim?.wheels?\`jantes ${'${esc(trim.wheels)}'}\`:null].filter(Boolean).join(' · ');\n      $('v8VehicleSpec').innerHTML=\`${'${pack?`<b>${pack}</b><br>`:\'\'}'}Référence WLTP/Companion : <b>${'${num(trim?.referenceConsumption).toFixed(1)}'} kWh/100 km</b> · AC <b>${'${num(trim?.acMaxKw,11)}'} kW</b> · DC <b>${'${num(trim?.dcMaxKw,175)}'} kW max</b>.<br>Capacité utilisée pour la simulation : <b>${'${cap.toFixed(1)}'} kWh utiles</b> (saisie utilisateur).\`;\n    }`;
          if(!r.includes(oldSpec))throw new Error('vehicle spec marker missing');
          r=r.replace(oldSpec,newSpec);
          fs.writeFileSync('assets/v8-redesign.js',r);
          NODE

          node --check assets/august-release.js
          node --check assets/v8-redesign.js
          node --check assets/v8-vehicle-profiles.js
          grep -q "Source-first" assets/august-release.js
          grep -q "batteryTotalKwh" assets/v8-redesign.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/august-release.js assets/v8-redesign.js assets/v8-vehicle-profiles.js
          git commit -m 'feat(v8): source-first tariff labels and BlogTesla vehicle packs'
          git push origin HEAD:release/2026-08

      - name: Publish RC4.8 from main Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V8 Preview · RC4.7', 'V8 Preview · RC4.8')
          s=s.replace('V8.0 RC4.7', 'V8.0 RC4.8')
          s=s.replace('Tesla Charge Companion 8.0 RC4.7', 'Tesla Charge Companion 8.0 RC4.8')
          s=s.replace('rc47-20260818', 'rc48-20260818')
          s=s.replace('v=rc47', 'v=rc48')
          # The tariff display is now generated directly by august-release.js from
          # the selected configuration's pricing object. Remove the old DOM rematch layer.
          s=s.replace(",'v8-tariff-display-fix'", '')
          s=s.replace("              '<script src=\"assets/v8-tariff-display-fix.js?v=rc48-20260818\" defer></script>\\n'\n", '')
          s=s.replace("          node --check site/v8-preview/assets/v8-tariff-display-fix.js\n", '')
          s=s.replace("          grep -q 'v8-tariff-display-fix.js?v=rc48-20260818' site/v8-preview/index.html\n", '')
          s=s.replace('V8 RC4.7 preview prepared from release/2026-08','V8 RC4.8 preview prepared from release/2026-08')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'V8 Preview · RC4.8' .github/workflows/pages.yml
          grep -q 'v8-vehicle-profiles.js?v=rc48-20260818' .github/workflows/pages.yml
          if grep -q "<script src=\\\"assets/v8-tariff-display-fix.js" .github/workflows/pages.yml; then
            echo 'Old tariff DOM rematch still loaded' >&2; exit 1
          fi

      - name: Commit RC4.8 publisher and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-rc48-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml .github/workflows/publish-rc48-once.yml
          git commit -m 'feat(pages): publish V8 RC4.8 source-first pricing'
          git push
