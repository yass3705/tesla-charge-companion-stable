name: Patch V8 publish contract injection support

on:
  push:
    branches:
      - fix/netherlands-v8-publish
    paths:
      - .github/workflows/patch-netherlands-v8-publish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/netherlands-v8-publish
          fetch-depth: 0
      - name: Add registry-driven script injection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/sync_v8_publish_contract.py')
          s=p.read_text(encoding='utf-8')
          marker='\ndef main() -> None:\n'
          if marker not in s:
              raise SystemExit('main() anchor missing')
          if 'def inject_runtime_scripts(' not in s:
              fn=r'''

def inject_runtime_scripts(registry: dict, target_root: Path) -> int:
    """Inject registry-declared runtime scripts after a stable existing script tag."""
    config = registry.get("publish", {}).get("injectScripts") or {}
    if not config:
        return 0
    if not isinstance(config, dict):
        fail("publish.injectScripts must be an object")

    anchor = str(config.get("after") or "").strip()
    paths = config.get("paths") or []
    if not anchor or not isinstance(paths, list) or not paths:
        fail("publish.injectScripts requires after and non-empty paths")

    index = target_root / "index.html"
    if not index.is_file():
        fail("preview index.html missing before runtime script injection")
    html = index.read_text(encoding="utf-8")

    clean_paths: list[str] = []
    for item in paths:
        relative = str(item or "").strip()
        if not relative.startswith("assets/") or not relative.endswith(".js"):
            fail(f"invalid injected runtime script path: {relative!r}")
        if relative in clean_paths:
            fail(f"duplicate injected runtime script: {relative}")
        path = safe_path(target_root, relative)
        if not path.is_file():
            fail(f"injected runtime script missing: {relative}")
        clean_paths.append(relative)
        html = re.sub(
            rf'<script src="{re.escape(relative)}(?:\?[^\"]*)?" defer></script>\s*',
            "",
            html,
        )

    anchor_pattern = re.compile(
        rf'(<script src="{re.escape(anchor)}(?:\?[^\"]*)?" defer></script>)'
    )
    if not anchor_pattern.search(html):
        fail(f"runtime script injection anchor missing: {anchor}")

    tags = "\n".join(f'<script src="{relative}" defer></script>' for relative in clean_paths)
    html = anchor_pattern.sub(lambda match: match.group(1) + "\n" + tags, html, count=1)
    index.write_text(html, encoding="utf-8")

    for relative in clean_paths:
        if html.count(f'src="{relative}"') != 1:
            fail(f"runtime script injection integrity failed: {relative}")
    print(
        f"V8 publish contract: injected {len(clean_paths)} runtime scripts after {anchor}"
    )
    return len(clean_paths)
'''
              s=s.replace(marker,fn+marker,1)

          old='    validate_active_sources(registry, target_root)\n    deploy_id = install_preview_cache_guard(registry_path, target_root)\n'
          new='    validate_active_sources(registry, target_root)\n    injected_scripts = inject_runtime_scripts(registry, target_root)\n    deploy_id = install_preview_cache_guard(registry_path, target_root)\n'
          if old not in s:
              raise SystemExit('publish execution anchor missing')
          s=s.replace(old,new,1)

          old_summary='        f"{sum(1 for s in registry.get(\'sources\', []) if s.get(\'status\') == \'active\')} active sources, "\n        f"{stamped_refs} deploy-stamped asset refs, preview deploy {deploy_id}"\n'
          new_summary='        f"{sum(1 for s in registry.get(\'sources\', []) if s.get(\'status\') == \'active\')} active sources, "\n        f"{injected_scripts} injected runtime scripts, "\n        f"{stamped_refs} deploy-stamped asset refs, preview deploy {deploy_id}"\n'
          if old_summary not in s:
              raise SystemExit('summary anchor missing')
          s=s.replace(old_summary,new_summary,1)

          p.write_text(s,encoding='utf-8')
