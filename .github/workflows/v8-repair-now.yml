name: V8 tariff repair now

on:
  push:
    branches: ["main"]
    paths: ["data/v8-repair-now.trigger"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and validate Powerdot on main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/france-catalog-v8.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const POWERDOT_URL='../data/powerdot_direct_france.json.gz';","const POWERDOT_URL='data/powerdot_direct_france.json.gz';")
          s=s.replace("const ETOTEM_URL='../data/etotem_direct_tariffs_france.json.gz';","const ETOTEM_URL='data/etotem_direct_tariffs_france.json.gz';")
          s=s.replace("if(type===2)return 'AC';\n    if(type===1)return 'DC';","if(type===1)return 'AC';\n    if(type===2)return 'DC';",1)
          assert "const POWERDOT_URL='data/powerdot_direct_france.json.gz';" in s
          assert "if(type===1)return 'AC';\n    if(type===2)return 'DC';" in s
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_runtime.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/france-catalog-v8.js
          git commit -m 'fix(v8): correct Powerdot kind mapping and local paths'
          git push origin HEAD:main

      - name: Repair and validate Belib on release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/2026-08
          git worktree add ../rc -B release/2026-08 origin/release/2026-08
          python - <<'PY'
          from pathlib import Path
          root=Path('../rc')
          for rel in ('assets/v8-offer-selection.js','assets/v8-subscription-selection.js'):
              p=root/rel
              s=p.read_text(encoding='utf-8')
              s=s.replace("if(provider.includes('belib direct abonne non resident'))return'belib-nonresident';","if(provider.includes('belib direct abonne non resident')||provider==='abonne non resident')return'belib-nonresident';")
              s=s.replace("if(provider.includes('belib direct abonne resident'))return'belib-resident';","if(provider.includes('belib direct abonne resident')||provider==='abonne resident paris')return'belib-resident';")
              assert "provider==='abonne resident paris'" in s
              assert "provider==='abonne non resident'" in s
              p.write_text(s,encoding='utf-8')
          PY
          cd ../rc
          node --check assets/v8-offer-selection.js
          node --check assets/v8-subscription-selection.js
          node scripts/test_v8_subscription_ranking.mjs
          grep -q "provider==='abonne resident paris'" assets/v8-offer-selection.js
          grep -q "provider==='abonne resident paris'" assets/v8-subscription-selection.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v8-offer-selection.js assets/v8-subscription-selection.js
          git commit -m 'fix(v8): enforce Belib short-label subscriptions as opt-in'
          git push origin HEAD:release/2026-08
