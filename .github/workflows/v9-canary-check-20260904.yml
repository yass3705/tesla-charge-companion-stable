name: V9 canary one-shot check 2026-09-04

on:
  schedule:
    # 10:00 Africa/Casablanca on 2026-09-04 = 09:00 UTC.
    - cron: '0 9 4 9 *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: v9-canary-one-shot-check-20260904
  cancel-in-progress: false

jobs:
  inspect-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect PRs, current candidate, tests and observation window
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- v9-canary-check-20260904 -->';
            const workflowPath = '.github/workflows/v9-canary-check-20260904.yml';
            const expectedDate = '2026-09-04';
            const now = new Date();
            const utcDate = now.toISOString().slice(0, 10);

            if (context.eventName === 'schedule' && utcDate !== expectedDate) {
              core.notice(`One-shot guard: expected ${expectedDate}, got ${utcDate}; nothing executed.`);
              return;
            }

            const short = value => value ? String(value).slice(0, 12) : 'inconnu';
            const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
            const asDate = value => {
              const parsed = Date.parse(value || '');
              return Number.isFinite(parsed) ? new Date(parsed) : null;
            };
            const localFormat = new Intl.DateTimeFormat('fr-FR', {
              timeZone: 'Africa/Casablanca',
              dateStyle: 'full',
              timeStyle: 'long'
            });
            const localTimestamp = localFormat.format(now);

            async function readJson(path, ref) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(response.data) || !response.data.content) {
                  return { value: null, error: `${path}: contenu non exploitable` };
                }
                const text = Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8');
                return { value: JSON.parse(text), error: null };
              } catch (error) {
                return { value: null, error: `${path}: ${error.message}` };
              }
            }

            const [pr67Response, pr120Response] = await Promise.all([
              github.rest.pulls.get({ owner, repo, pull_number: 67 }),
              github.rest.pulls.get({ owner, repo, pull_number: 120 })
            ]);
            const pr67 = pr67Response.data;
            const pr120 = pr120Response.data;
            const currentSha = pr67.head.sha;

            const [observationResult, policyResult, rolloutResult, readinessResult, activationResult] = await Promise.all([
              readJson('ops/v9/canary-observation.json', currentSha),
              readJson('data/v9/canary-policy.json', currentSha),
              readJson('data/v9/rollout-config.json', currentSha),
              readJson('data/v9/access-readiness.json', currentSha),
              readJson('ops/v9/canary-activation.json', pr120.head.sha)
            ]);

            const observation = observationResult.value;
            const policy = policyResult.value;
            const rollout = rolloutResult.value;
            const readiness = readinessResult.value;
            const activation = activationResult.value;
            const readErrors = [
              observationResult.error,
              policyResult.error,
              rolloutResult.error,
              readinessResult.error,
              activationResult.error
            ].filter(Boolean);

            const runsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: currentSha,
              per_page: 100
            });
            const currentRuns = runsResponse.data.workflow_runs
              .filter(run => run.head_sha === currentSha)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const latestByName = new Map();
            for (const run of currentRuns) {
              if (!latestByName.has(run.name)) latestByName.set(run.name, run);
            }

            const candidateRuns = [...latestByName.values()].filter(run =>
              /^V9\b/i.test(run.name) || /Tesla Netherlands visibility regression/i.test(run.name)
            );
            const successfulRuns = candidateRuns.filter(run => run.status === 'completed' && run.conclusion === 'success');
            const pendingRuns = candidateRuns.filter(run => run.status !== 'completed');
            const unsuccessfulRuns = candidateRuns.filter(run =>
              run.status === 'completed' && !['success', 'neutral', 'skipped'].includes(run.conclusion)
            );

            const requiredNames = [
              'V9 unified data engine',
              'V9 Pages package test',
              'V9 isolated device test Pages',
              'V9 controlled device test safety',
              'V9 first device scenario pack safety',
              'V9 pre-canary safety',
              'V9 production readiness gate',
              'V9 shadow parity',
              'V9 canary policy safety',
              'V9 rollout safety gate',
              'V9 access gateway safety',
              'V9 pre-canary observation'
            ];
            const missingRequired = requiredNames.filter(name => !latestByName.has(name));
            const nonGreenRequired = requiredNames
              .map(name => latestByName.get(name))
              .filter(Boolean)
              .filter(run => run.status !== 'completed' || run.conclusion !== 'success');
            const requiredGreen = missingRequired.length === 0 && nonGreenRequired.length === 0;

            const aggregate = observation?.evidence?.aggregate || {};
            const minimumRuns = Math.max(25, number(observation?.window?.minimumRuns));
            const evidenceRuns = number(aggregate.runs);
            const evidenceGreen = Boolean(observation) &&
              number(aggregate.packs) >= 3 &&
              evidenceRuns >= minimumRuns &&
              number(aggregate.passes) === evidenceRuns &&
              ['failures', 'sourceErrors', 'routingErrors', 'criticalParityErrors']
                .every(key => number(aggregate[key]) === 0);

            const startedAt = asDate(observation?.window?.startedAt);
            const eligibleAfter = asDate(observation?.window?.eligibleAfter);
            const minimumHours = number(observation?.window?.minimumHours);
            const elapsedHours = startedAt ? Math.max(0, (now.getTime() - startedAt.getTime()) / 3600000) : 0;
            const windowDefinitionValid = Boolean(startedAt && eligibleAfter && minimumHours > 0) &&
              Math.abs((eligibleAfter.getTime() - startedAt.getTime()) - minimumHours * 3600000) < 1000;
            const windowComplete = windowDefinitionValid && now.getTime() >= eligibleAfter.getTime() && elapsedHours >= minimumHours;

            const observationSha = observation?.candidate?.sourceSha || null;
            const deploymentSha = observation?.candidate?.pagesDeployment?.checkoutSha || null;
            const candidateRecordedCurrent = observationSha === currentSha;
            const deploymentRecordedCurrent = deploymentSha === currentSha;
            const deployedAt = asDate(observation?.candidate?.pagesDeployment?.completedAt);
            const windowAlignedWithDeployment = Boolean(startedAt && deployedAt) &&
              startedAt.getTime() === deployedAt.getTime();

            let deploymentRun = null;
            let deploymentRunError = null;
            const deploymentRunId = number(observation?.candidate?.pagesDeployment?.runId);
            if (deploymentRunId) {
              try {
                deploymentRun = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: deploymentRunId })).data;
              } catch (error) {
                deploymentRunError = error.message;
              }
            }
            const deploymentRunGreen = Boolean(deploymentRun) &&
              deploymentRun.status === 'completed' &&
              deploymentRun.conclusion === 'success' &&
              deploymentRun.head_sha === currentSha;

            const canaryPercent = number(rollout?.canaryPercent);
            const canaryActive = policy?.active === true && rollout?.stage === 'canary' && canaryPercent > 0;
            const zeroTrafficSafe = policy?.active === false &&
              rollout?.stage === 'preview' &&
              canaryPercent === 0 &&
              number(observation?.window?.trafficPercent) === 0;
            const killSwitch = rollout?.killSwitch === true;
            const readinessGreen = readiness?.ready === true && readiness?.verdict === 'READY';

            const activationSha = activation?.candidate?.observationSourceSha || null;
            const activationCurrent = activationSha === currentSha &&
              activation?.fullWindowValidation?.conclusion === 'success' &&
              number(activation?.percent) === 1;
            const pr120TargetsCurrentBase = pr120.base.sha === currentSha;
            const activationPackageFresh = activationCurrent && pr120TargetsCurrentBase;

            const blockingReasons = [];
            if (readErrors.length) blockingReasons.push('fichiers de contrôle illisibles ou absents');
            if (!requiredGreen) blockingReasons.push('suite de tests requise non entièrement verte');
            if (!candidateRecordedCurrent) blockingReasons.push('observation liée à un ancien candidat');
            if (!deploymentRecordedCurrent || !deploymentRunGreen) blockingReasons.push('déploiement public de test non prouvé sur le SHA courant');
            if (!windowAlignedWithDeployment) blockingReasons.push('fenêtre non alignée avec le déploiement du candidat');
            if (!evidenceGreen) blockingReasons.push('preuves publiques insuffisantes ou non propres');
            if (!windowDefinitionValid) blockingReasons.push('définition de fenêtre invalide');
            if (!readinessGreen) blockingReasons.push('readiness différente de READY');

            let verdict;
            let nextAction;
            if (canaryActive) {
              if (blockingReasons.length || !activationPackageFresh || killSwitch) {
                verdict = 'RETOUR SÛR VERS V8 / 0 %';
                nextAction = 'Activer le mécanisme de repli, remettre le trafic V9 à 0 %, puis reconstruire des preuves sur le SHA courant avant toute nouvelle activation.';
              } else {
                verdict = `CANARY ACTIF À ${canaryPercent} % — MAINTIEN`;
                nextAction = `Maintenir strictement ${canaryPercent} %, surveiller les signaux de rollback et ne lancer ni extension de pourcentage ni fusion tant que la fenêtre canary n’est pas validée.`;
              }
            } else if (!zeroTrafficSafe) {
              verdict = 'CONFIGURATION À BLOQUER';
              nextAction = 'Restaurer le mode preview à 0 % avec la V8 comme chemin de repli avant toute autre opération.';
            } else if (!candidateRecordedCurrent || !deploymentRecordedCurrent || !deploymentRunGreen || !windowAlignedWithDeployment) {
              verdict = 'REMISE À ZÉRO DE L’OBSERVATION REQUISE';
              nextAction = `Garder la V9 à 0 %. Adapter d’abord le contrat d’observation au verrouillage manuel protégé, déployer explicitement le SHA ${short(currentSha)} dans /v9-test/, exécuter trois packs publics (au moins 25 runs, zéro signal de rollback), puis redémarrer une fenêtre complète de 24 h.`;
            } else if (!requiredGreen || !evidenceGreen || !readinessGreen || !windowDefinitionValid) {
              verdict = 'BLOQUÉ — AUCUNE PROMOTION';
              nextAction = 'Corriger les contrôles non verts, rejouer les packs publics et ne redémarrer l’observation qu’avec un candidat et des preuves cohérents.';
            } else if (!windowComplete) {
              verdict = 'OBSERVATION EN COURS';
              nextAction = `Continuer à 0 % jusqu’au ${eligibleAfter ? localFormat.format(eligibleAfter) : 'terme calculable'}, sans modifier le runtime ni les données du candidat.`;
            } else if (!activationPackageFresh) {
              verdict = 'FENÊTRE VERTE, PAQUET #120 À RAFRAÎCHIR';
              nextAction = `Rebaser et régénérer la PR #120 sur le SHA ${short(currentSha)}, relancer sa suite d’activation, puis soumettre le passage manuel à 1 % seulement si tous les contrôles restent verts.`;
            } else {
              verdict = 'ÉLIGIBLE À UNE REVUE MANUELLE POUR 1 %';
              nextAction = 'Effectuer la revue opérateur finale du paquet #120. Le contrôle n’autorise aucune fusion ou promotion automatique.';
            }

            const runStatus = run => {
              if (!run) return 'absent';
              if (run.status !== 'completed') return run.status;
              return run.conclusion || 'terminé';
            };
            const formatRunList = runs => runs.length
              ? runs.slice(0, 12).map(run => `- [${run.name}](${run.html_url}) — **${runStatus(run)}**`).join('\n')
              : '- Aucun.';
            const fmtSha = value => value ? `\`${short(value)}\`` : 'absent';
            const fmtDate = value => value ? localFormat.format(value) : 'inconnue';
            const prState = pr => `${pr.state === 'open' ? 'ouverte' : 'fermée'}${pr.merged_at ? ', fusionnée' : ''}${pr.draft ? ', brouillon' : ', prête à la revue'}`;

            const comment = `${marker}
@${owner} — contrôle automatique ponctuel du canary V9 effectué le **${localTimestamp}**.

## Verdict
**${verdict}**

| Contrôle | Résultat |
|---|---|
| PR #67 | ${prState(pr67)} — tête ${fmtSha(currentSha)} |
| PR #120 | ${prState(pr120)} — tête ${fmtSha(pr120.head.sha)} — base ${fmtSha(pr120.base.sha)} |
| Candidat inscrit dans l’observation | ${fmtSha(observationSha)} — ${candidateRecordedCurrent ? 'courant' : 'périmé'} |
| Candidat déployé dans /v9-test/ | ${fmtSha(deploymentSha)} — ${deploymentRunGreen ? 'run vert et SHA courant' : 'non prouvé sur le SHA courant'} |
| Tests du SHA courant | ${successfulRuns.length}/${candidateRuns.length} verts, ${unsuccessfulRuns.length} échec(s), ${pendingRuns.length} en cours |
| Preuves publiques | ${number(aggregate.packs)} packs, ${evidenceRuns} runs, ${number(aggregate.failures)} échec(s), ${number(aggregate.sourceErrors)} erreur(s) source, ${number(aggregate.routingErrors)} erreur(s) routage |
| Fenêtre | début ${fmtDate(startedAt)} — éligible après ${fmtDate(eligibleAfter)} — ${elapsedHours.toFixed(2)} h écoulées — ${windowComplete ? 'complète' : 'incomplète ou non courante'} |
| Trafic / repli | ${canaryPercent} % V9 — kill switch ${killSwitch ? 'ACTIF' : 'inactif'} — readiness ${readiness?.verdict || 'inconnue'} |
| Paquet d’activation #120 | candidat ${fmtSha(activationSha)} — ${activationPackageFresh ? 'courant' : 'à rafraîchir'} |

### Contrôles requis non verts ou absents
${formatRunList([...nonGreenRequired, ...missingRequired.map(name => ({ name, status: 'absent', conclusion: null, html_url: `https://github.com/${owner}/${repo}/actions` }))])}

${unsuccessfulRuns.length ? `### Autres tests V9 en échec\n${formatRunList(unsuccessfulRuns)}\n` : ''}
${readErrors.length ? `### Lecture des preuves\n${readErrors.map(error => `- ${error}`).join('\n')}\n` : ''}
${deploymentRunError ? `- Lecture du run de déploiement impossible : ${deploymentRunError}\n` : ''}
${blockingReasons.length ? `### Motifs de blocage\n${blockingReasons.map(reason => `- ${reason}`).join('\n')}\n` : ''}
## Prochaine action sûre
**${nextAction}**

> Ce contrôle n’a effectué ni fusion, ni déploiement, ni activation, ni modification du pourcentage de trafic.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: 120,
              per_page: 100
            });
            const previous = comments.find(item => typeof item.body === 'string' && item.body.includes(marker));
            let notification;
            if (previous) {
              notification = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body: comment
              });
            } else {
              notification = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: 120,
                body: comment
              });
            }

            core.summary
              .addHeading('V9 canary one-shot check')
              .addRaw(`Verdict: **${verdict}**\n\n`)
              .addRaw(`Notification: ${notification.data.html_url}\n\n`)
              .addRaw(`Next safe action: ${nextAction}\n`);
            await core.summary.write();

            // Remove the one-shot workflow only after the notification is safely posted.
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path: workflowPath,
                ref: context.payload.repository.default_branch
              });
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: workflowPath,
                message: 'chore(actions): remove completed V9 canary one-shot monitor',
                sha: current.data.sha,
                branch: context.payload.repository.default_branch
              });
              core.notice('One-shot workflow removed after successful notification.');
            } catch (error) {
              core.warning(`Notification posted, but self-cleanup failed: ${error.message}`);
            }
