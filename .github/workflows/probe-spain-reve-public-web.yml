name: Probe Spain REVE public web API

on:
  push:
    branches: [spain-reve-preintegration]
    paths:
      - data/spain_reve/web_probe_trigger.txt

permissions:
  contents: write

concurrency:
  group: probe-spain-reve-public-web
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spain-reve-preintegration
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe five public REVE location pages against real DGT stations
        run: |
          npm install --no-save @gasolinaradar/dgt-ev-collector@1.5.1
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('@gasolinaradar/dgt-ev-collector');
          async function main() {
            const startedAt = new Date().toISOString();
            let out = { startedAt, packageVersion: '1.5.1', source: 'public', maxPages: 5, perPage: 25 };
            try {
              const stations = await pkg.fetchStations({ logger: { info(){}, warn(){}, debug(){} } });
              const enriched = await pkg.enrichStations(stations, {
                source: 'public', acknowledgeUnsupported: true,
                maxPages: 5, perPage: 25, thresholdMeters: 100,
                logger: { info(){}, warn(){}, debug(){} }
              });
              const matched = enriched.filter(r => r && r.reveLocationId);
              const withPrices = matched.filter(r => Array.isArray(r.prices) && r.prices.length);
              const withAvailability = matched.filter(r => !!r.availability);
              const withReveData = matched.filter(r => !!r.reveData);
              const sample = withReveData[0] || matched[0] || null;
              const evses = sample?.reveData?.evses || [];
              const connectors = evses.flatMap(e => e.connectors || []);
              out.ok = true;
              out.dgtStationsLoaded = stations.length;
              out.matchedStations = matched.length;
              out.matchedWithPrices = withPrices.length;
              out.matchedWithAvailability = withAvailability.length;
              out.matchedWithReveData = withReveData.length;
              out.sample = sample ? {
                sourceStationId: sample.sourceStationId || null,
                name: sample.name || null,
                reveLocationId: sample.reveLocationId || null,
                operatorName: sample.operator?.name || null,
                priceCount: Array.isArray(sample.prices) ? sample.prices.length : 0,
                availabilityPresent: !!sample.availability,
                availabilityStatus: sample.availability?.status || null,
                reveDataEvseCount: evses.length,
                reveDataConnectorCount: connectors.length,
                connectorFields: [...new Set(connectors.flatMap(c => Object.keys(c)))].sort(),
                tariffBearingConnectors: connectors.filter(c => Array.isArray(c.tariffs) && c.tariffs.length).length,
                statusValues: [...new Set(evses.map(e => e.status).filter(Boolean))].sort()
              } : null;
              out.parityCandidates = withReveData.slice(0, 20).map(r => ({
                sourceStationId: r.sourceStationId || null,
                name: r.name || null,
                reveLocationId: r.reveLocationId || null,
                evses: (r.reveData?.evses || []).map(e => ({
                  id: e.id || null,
                  evse_id: e.evse_id || e.evseId || null,
                  status: e.status || null,
                  connectors: (e.connectors || []).map(c => ({
                    id: c.id || null,
                    tariffs: Array.isArray(c.tariffs) ? c.tariffs : []
                  }))
                }))
              }));
              out.finishedAt = new Date().toISOString();
            } catch (e) {
              out.ok = false;
              out.errorName = e && e.name ? String(e.name) : null;
              out.errorMessage = e && e.message ? String(e.message).slice(0,500) : String(e).slice(0,500);
              out.finishedAt = new Date().toISOString();
            }
            fs.writeFileSync('data/spain_reve/reve_public_web_probe.json', JSON.stringify(out, null, 2) + '\n');
            if (!out.ok) process.exitCode = 2;
          }
          main();
          NODE
      - name: Compare public-map sample semantically with persisted official external API records
        if: always()
        run: |
          python <<'PY'
          import gzip, json
          from pathlib import Path

          p = Path('data/spain_reve/reve_public_web_probe.json')
          out = json.loads(p.read_text())
          with gzip.open('data/spain_reve/reve_connector_tariffs_raw.json.gz','rt',encoding='utf-8') as f:
              tariffs = json.load(f)
          with gzip.open('data/spain_reve/reve_operational_status_raw.json.gz','rt',encoding='utf-8') as f:
              statuses = json.load(f)

          rep = {
              'candidateStations': 0, 'publicConnectors': 0, 'officialConnectorMatches': 0,
              'tariffExactMatches': 0, 'tariffMismatches': 0,
              'tariffSemanticMatches': 0, 'tariffSemanticMismatches': 0,
              'publicEvses': 0, 'officialStatusMatches': 0, 'statusExactMatches': 0,
              'statusMismatches': 0, 'examples': [], 'tariffShapeExamples': []
          }

          def canon(v):
              return json.dumps(v, sort_keys=True, separators=(',',':'), ensure_ascii=False)

          def semantic_scalars(v, prefix=''):
              out=[]
              if isinstance(v, dict):
                  for k,val in v.items():
                      kl=str(k).lower()
                      np=f'{prefix}.{kl}' if prefix else kl
                      if any(tok in kl for tok in ('price','amount','currency','energy','kwh','time','minute','hour','flat','parking','step','vat','tax','min','max','restriction')):
                          if isinstance(val,(str,int,float,bool)) or val is None:
                              out.append((np,val))
                      out.extend(semantic_scalars(val,np))
              elif isinstance(v,list):
                  for i,val in enumerate(v):
                      out.extend(semantic_scalars(val,f'{prefix}[]'))
              return out

          def semantic_signature(v):
              vals=[]
              for path,val in semantic_scalars(v):
                  if isinstance(val,float):
                      val=round(val,8)
                  vals.append((path,val))
              return sorted(vals, key=lambda x:(x[0], str(x[1])))

          for st in out.get('parityCandidates') or []:
              rep['candidateStations'] += 1
              ex = {'reveLocationId': st.get('reveLocationId'), 'connectorMatches': 0, 'statusMatches': 0}
              for ev in st.get('evses') or []:
                  rep['publicEvses'] += 1
                  skeys=[]
                  if ev.get('id'): skeys.append('id:'+str(ev['id']))
                  if ev.get('evse_id'): skeys.append('evse:'+str(ev['evse_id']))
                  official = next((statuses[k] for k in skeys if k in statuses), None)
                  if official is not None:
                      rep['officialStatusMatches'] += 1; ex['statusMatches'] += 1
                      if str(official.get('status')) == str(ev.get('status')):
                          rep['statusExactMatches'] += 1
                      else:
                          rep['statusMismatches'] += 1
                  for c in ev.get('connectors') or []:
                      rep['publicConnectors'] += 1
                      cid = c.get('id')
                      official_t = tariffs.get(str(cid)) if cid else None
                      if official_t is not None:
                          rep['officialConnectorMatches'] += 1; ex['connectorMatches'] += 1
                          public_tariffs = c.get('tariffs') or []
                          official_tariffs = official_t.get('tariffs') or []
                          if canon(official_tariffs) == canon(public_tariffs):
                              rep['tariffExactMatches'] += 1
                          else:
                              rep['tariffMismatches'] += 1
                          psig=semantic_signature(public_tariffs)
                          osig=semantic_signature(official_tariffs)
                          if psig == osig and (psig or osig):
                              rep['tariffSemanticMatches'] += 1
                          else:
                              rep['tariffSemanticMismatches'] += 1
                          if len(rep['tariffShapeExamples']) < 5:
                              rep['tariffShapeExamples'].append({
                                  'connectorId': cid,
                                  'publicSemantic': psig[:80],
                                  'officialSemantic': osig[:80],
                                  'publicTopLevelType': type(public_tariffs).__name__,
                                  'officialTopLevelType': type(official_tariffs).__name__
                              })
              if len(rep['examples']) < 5 and (ex['connectorMatches'] or ex['statusMatches']):
                  rep['examples'].append(ex)

          out['officialExternalApiParity'] = rep
          out.pop('parityCandidates', None)
          p.write_text(json.dumps(out, indent=2, ensure_ascii=False)+'\n')
          print(json.dumps(rep, indent=2, ensure_ascii=False))
          PY
      - name: Commit probe result
        if: always()
        run: |
          git add data/spain_reve/reve_public_web_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(es): compare REVE public web with official persisted streams"
          git pull --rebase origin spain-reve-preintegration
          git push
