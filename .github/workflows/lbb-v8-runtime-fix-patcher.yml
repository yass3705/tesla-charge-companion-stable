name: Patch La Borne Bleue V8 runtime bugs

on:
  push:
    branches:
      - fix/labornebleue-v8-runtime-20260825
    paths:
      - .github/workflows/lbb-v8-runtime-fix-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/labornebleue-v8-runtime-20260825

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair patch test marker
        run: python scripts/repair_lbb_patcher_marker.py

      - name: Apply patch
        run: python scripts/patch_lbb_v8_runtime_bugfix.py

      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/v8-subscription-selection.js
          node --check assets/v8-labornebleue-direct-overlay.js
          node --check scripts/test_labornebleue_v8_runtime.mjs
          node --check scripts/test_labornebleue_subscription_runtime.mjs

      - name: Download refreshed LBB data
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/national/labornebleue_direct_stations_idf.json.gz' -o /tmp/labornebleue.json.gz
          test -s /tmp/labornebleue.json.gz

      - name: Runtime regression tests
        run: |
          node scripts/test_labornebleue_v8_runtime.mjs assets/v8-labornebleue-direct-overlay.js /tmp/labornebleue.json.gz
          node scripts/test_labornebleue_subscription_runtime.mjs assets/v8-subscription-selection.js
          grep -q 'subscriptionId:cfg.subscriptionId' assets/app.js
          ! grep -q 'tccLabornebleueSubscriptionControl' assets/v8-labornebleue-direct-overlay.js
          grep -q 'address_operator' assets/v8-labornebleue-direct-overlay.js

      - name: Commit tested patch
        run: |
          rm .github/workflows/lbb-v8-runtime-fix-patcher.yml
          rm scripts/patch_lbb_v8_runtime_bugfix.py
          rm scripts/repair_lbb_patcher_marker.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v8): repair La Borne Bleue subscriptions and station matching'
          git push origin HEAD:fix/labornebleue-v8-runtime-20260825
