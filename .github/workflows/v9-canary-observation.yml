name: V9 pre-canary observation

on:
  pull_request:
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'data/tesla_stations.json'
      - 'data/ionity_direct_stations_france.json.gz'
      - 'data/atlante_direct_stations_france.json.gz'
      - 'data/powerdot_direct_france.json.gz'
      - 'data/netherlands_direct_tariffs_v1.json'
      - 'data/non_tesla_netherlands/**'
      - 'ops/v9/canary-observation.json'
      - 'ops/v9/canary-activation.json'
      - '.github/workflows/v9-device-test-pages.yml'
      - 'scripts/v9-canary-observation.cjs'
      - 'scripts/v9-canary-activation.cjs'
      - 'tests/v9-canary-observation.test.cjs'
      - 'tests/v9-canary-activation.test.cjs'
      - '.github/workflows/v9-canary-observation.yml'
  push:
    branches: [main, 'refactor/unified-data-engine-v9']
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'data/tesla_stations.json'
      - 'data/ionity_direct_stations_france.json.gz'
      - 'data/atlante_direct_stations_france.json.gz'
      - 'data/powerdot_direct_france.json.gz'
      - 'data/netherlands_direct_tariffs_v1.json'
      - 'data/non_tesla_netherlands/**'
      - 'ops/v9/canary-observation.json'
      - 'ops/v9/canary-activation.json'
      - '.github/workflows/v9-device-test-pages.yml'
      - 'scripts/v9-canary-observation.cjs'
      - 'scripts/v9-canary-activation.cjs'
      - 'tests/v9-canary-observation.test.cjs'
      - 'tests/v9-canary-activation.test.cjs'
      - '.github/workflows/v9-canary-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/v9-canary-observation.cjs
          node --check scripts/v9-canary-activation.cjs
          node --check tests/v9-canary-observation.test.cjs
          node --check tests/v9-canary-activation.test.cjs
      - name: Immutable observation contract
        run: node tests/v9-canary-observation.test.cjs
      - name: Canary activation contract
        run: node tests/v9-canary-activation.test.cjs
      - name: Evaluate pinned public candidate or approved activation
        env:
          TARGET_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if node -e "const p=require('./data/v9/canary-policy.json');process.exit(p.active===true?0:1)"; then
            node scripts/v9-canary-activation.cjs --ref "$TARGET_REF" --json
          else
            node scripts/v9-canary-observation.cjs --ref "$TARGET_REF" --json
          fi

# Operator approval confirmed after the completed 24h window: initial 1% only if every gate is green.
