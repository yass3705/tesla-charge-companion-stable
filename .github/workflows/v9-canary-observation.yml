name: V9 pre-canary observation

on:
  pull_request:
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'data/tesla_stations.json'
      - 'data/ionity_direct_stations_france.json.gz'
      - 'data/atlante_direct_stations_france.json.gz'
      - 'data/powerdot_direct_france.json.gz'
      - 'data/netherlands_direct_tariffs_v1.json'
      - 'data/non_tesla_netherlands/**'
      - 'ops/v9/canary-observation.json'
      - 'scripts/v9-canary-observation.cjs'
      - 'tests/v9-canary-observation.test.cjs'
      - '.github/workflows/v9-canary-observation.yml'
  push:
    branches: [main, 'refactor/unified-data-engine-v9']
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'data/tesla_stations.json'
      - 'data/ionity_direct_stations_france.json.gz'
      - 'data/atlante_direct_stations_france.json.gz'
      - 'data/powerdot_direct_france.json.gz'
      - 'data/netherlands_direct_tariffs_v1.json'
      - 'data/non_tesla_netherlands/**'
      - 'ops/v9/canary-observation.json'
      - 'scripts/v9-canary-observation.cjs'
      - 'tests/v9-canary-observation.test.cjs'
      - '.github/workflows/v9-canary-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/v9-canary-observation.cjs
          node --check tests/v9-canary-observation.test.cjs
      - name: Observation contract
        run: node tests/v9-canary-observation.test.cjs
      - name: Evaluate pinned public candidate
        run: node scripts/v9-canary-observation.cjs --json
