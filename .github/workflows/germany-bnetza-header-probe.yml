name: Germany BNetzA CSV header probe

on:
  pull_request:
    paths:
      - '.github/workflows/germany-bnetza-header-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print official BNetzA CSV header
        run: |
          python - <<'PY'
          import urllib.request
          url='https://data.bundesnetzagentur.de/Bundesnetzagentur/DE/Fachthemen/ElektrizitaetundGas/E-Mobilitaet/Ladesaeulenregister_BNetzA_2026-07-28.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'TCC-V9-DE-header-probe/1.0','Range':'bytes=0-16383'})
          with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read(16384)
          text=None
          for enc in ('utf-8-sig','utf-8','cp1252','latin-1'):
              try:
                  text=raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          print('BYTES',len(raw))
          print('FIRST_LINES')
          for i,line in enumerate((text or '').splitlines()[:8],1):
              print(f'{i}: {line}')
          PY
