name: V9 Switzerland build
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_switzerland_v9.py'
      - '.github/workflows/v9-switzerland-build.yml'
  schedule:
    - cron: '20 23 * * *'
permissions:
  contents: write
concurrency:
  group: v9-switzerland-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build_switzerland_v9.py
      - run: node tests/v9-switzerland-integration.test.cjs
      - name: Persist V9 Switzerland artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v9-production-runtime/data/v9/switzerland-static v9-production-runtime/data/v9/switzerland-offers.json v9-production-runtime/data/v9/switzerland-build-report.json
          git commit -m 'data(v9): refresh Switzerland national baseline and offers' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
