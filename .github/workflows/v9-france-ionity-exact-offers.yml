name: France V9 IONITY exact offers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - refactor/unified-data-engine-v9
    paths:
      - "assets/v9/adapters/direct-offers.js"
      - "assets/v9/browser-loaders.js"
      - "v9-app/app.js"
      - "tests/v9-france-ionity-exact-runtime.cjs"
      - ".github/workflows/v9-france-ionity-exact-offers.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic IONITY runtime tests
        run: node tests/v9-france-ionity-exact-runtime.cjs
      - name: Validate current published IONITY snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/operator_direct/ionity_exact_france.json \
            -o /tmp/ionity_exact_france.json
          node - <<'NODE'
          const fs=require('fs');
          const adapter=require('./assets/v9/adapters/direct-offers.js');
          const payload=JSON.parse(fs.readFileSync('/tmp/ionity_exact_france.json','utf8'));
          const normalized=adapter.normalizePayload(payload);
          const canonical=new Set();
          for(const r of normalized.offerRules)for(const e of r.evseIds||[])if(String(e).includes('*'))canonical.add(e);
          if(canonical.size!==1850)throw new Error(`Expected 1850 exact canonical EVSEs, got ${canonical.size}`);
          const prices=[...new Set(normalized.offerRules.map(r=>Number(r.pricing.pricePerKwh)))].sort((a,b)=>a-b);
          if(prices.length<2)throw new Error('IONITY mixed connector prices were collapsed');
          const bad=['FR*IOY*E1','FR*IOY*E2','FRTSLE2IOYGE'];
          for(const id of bad)if(canonical.has(id))throw new Error(`Known malformed EVSE leaked into exact offers: ${id}`);
          console.log('Published IONITY snapshot OK:',canonical.size,'EVSEs; prices',prices.join(', '));
          NODE
