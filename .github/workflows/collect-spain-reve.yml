name: Collect Spain REVE pre-integration

on:
  workflow_dispatch:
    inputs:
      force_new_cycle:
        description: "Start a fresh full national pass from page 1"
        required: false
        default: false
        type: boolean
      pages_per_run:
        description: "REVE pages to fetch this run (1-5)"
        required: false
        default: "4"
        type: choice
        options: ["1", "2", "3", "4", "5"]
  push:
    branches: ["spain-reve-preintegration"]
  schedule:
    # Runs hourly, but the collector exits immediately once the monthly cycle is complete.
    # A new cycle is automatically started during the first 48 hours of each month.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-spain-reve
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify REVE secret fingerprint
        shell: bash
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib, os, sys
          key = os.environ.get('REVE_API_KEY', '')
          fp = hashlib.sha256(key.encode()).hexdigest()[:12]
          expected = 'd661767a05f9'
          print(f'REVE secret length: {len(key)}')
          print(f'REVE secret fingerprint: {fp}')
          if fp != expected:
              print('REVE secret mismatch; stopping before API call.')
              sys.exit(42)
          print('REVE secret matches the Mac-tested key.')
          PY

      - name: Mirror Mac curl test
        shell: bash
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
        run: |
          status=$(curl -sS -o /tmp/reve-body.json -w '%{http_code}' \
            -H "x-api-key: $REVE_API_KEY" \
            -H "Accept: application/json" \
            "https://www.mapareve.es/api/external/v1/locations?page=1&limit=1")
          echo "REVE curl HTTP status: $status"
          head -c 300 /tmp/reve-body.json || true
          echo
          if [ "$status" != "200" ]; then
            exit 43
          fi
