name: Cleanup French custom stations once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-custom-france-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove French non-Tesla custom stations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/custom_stations.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          const removeIds = new Set([
            'alize-galard',
            'station-1786227827538',
            'izivia-levant',
            'lidl-saint-cyr',
            'one-nation',
            'station-1784992892709'
          ]);

          const before = data.stations.length;
          const removed = data.stations.filter(station => removeIds.has(station.id));
          const kept = data.stations.filter(station => !removeIds.has(station.id));

          if (before !== 16) {
            throw new Error(`Safety check failed: expected 16 stations before cleanup, found ${before}`);
          }
          if (removed.length !== 6) {
            throw new Error(`Safety check failed: expected to remove 6 stations, found ${removed.length}`);
          }
          if (kept.length !== 10) {
            throw new Error(`Safety check failed: expected 10 stations after cleanup, found ${kept.length}`);
          }

          data.stations = kept;
          data.updatedAt = new Date().toISOString();
          data.lastDevice = 'GitHub Actions - France cleanup';

          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('Removed stations:');
          for (const station of removed) {
            console.log(`- ${station.id}: ${station.name}`);
          }
          console.log(`Stations: ${before} -> ${kept.length}`);
          NODE

      - name: Commit cleaned custom stations
        shell: bash
        run: |
          if git diff --quiet -- data/custom_stations.json; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/custom_stations.json
          git commit -m "Clean French non-Tesla custom stations"
          git push
