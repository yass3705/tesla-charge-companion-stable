name: V8 Bump Direct

on:
  workflow_dispatch:
  push:
    branches: ["release/2026-08"]
    paths:
      - "assets/v8-bump-direct.js"
      - "scripts/test_bump_direct_v8.mjs"
      - ".github/workflows/v8-bump-direct.yml"

permissions:
  contents: write

concurrency:
  group: v8-bump-direct-release-2026-08
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch pinned validated Bump France snapshot
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/97b5987ebf7e78fefea94dc4274b16949e084d58/data/national/bump_direct_tariffs_tcc_france.json.gz'
          req=urllib.request.Request(url,headers={'User-Agent':'TeslaChargeCompanionV8-BumpPublisher/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              blob=r.read()
          assert blob[:2]==b'\x1f\x8b'
          p=Path('data/bump_direct_tariffs_tcc_france.json.gz');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob)
          print({'bytes':len(blob)})
          PY

      - name: Validate Bump direct perimeter and known tariffs
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          p=json.loads(gzip.decompress(Path('data/bump_direct_tariffs_tcc_france.json.gz').read_bytes()))
          c=p['counts'];s=p['scope']
          assert p['dataset']=='bump-direct-tariffs-tcc-france' and p['operator']=='Bump' and p['country']=='FR'
          assert s['directCpoOnly'] is True and s['roamingIncluded'] is False and s['foreignStationsExcluded'] is True and s['unresolvedCasesNeverRankable'] is True
          assert c['franceStations']==1506 and c['francePoints']==2252
          assert c['rankablePoints']==2074 and c['unresolvedPoints']==178
          assert c['rankable_static']==1409 and c['rankable_rule_based']==665
          assert c['unresolved_evse_mapping']==83 and c['unresolved_station_match']==72 and c['unresolved_no_numeric_price']==23
          assert not p.get('variableParseFailures')
          assert not any('L-' in str(st.get('address') or '') for st in p['stations'])
          points={x.get('idPdcItinerance'):x for st in p['stations'] for x in st.get('points',[]) if x.get('idPdcItinerance')}
          assert sum(1 for x in points.values() if x.get('rankable') is True)==2074
          a=points['FRBMPE1151']; assert a['rankable'] and abs(a['components']['energyEurPerKwh']-.384)<1e-9 and abs(a['components']['minPriceEur']-1)<1e-9
          b=points['FRBMPE6443']; assert b['rankable'] and abs(b['components']['energyEurPerKwh']-.456)<1e-9 and abs(b['components']['minPriceEur']-1)<1e-9
          d=points['FRBMPE6747']; assert d['rankable'] and abs(d['components']['energyEurPerKwh']-.55)<1e-9
          flat=next(r for r in d['rules'] if r['kind']=='flat_fee'); assert abs(flat['amountEur']-1.2)<1e-9 and flat['conditions'][0]['kind']=='energy_above_kwh' and abs(flat['conditions'][0]['value']-.5)<1e-9
          assert all(x.get('rankable') is not True for st in p['stations'] for x in st.get('points',[]) if x.get('status','').startswith('unresolved_'))
          print(c)
          PY

      - name: Test Bump runtime
        run: |
          node --check assets/v8-bump-direct.js
          node scripts/test_bump_direct_v8.mjs

      - name: Load Bump runtime in V8
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');text=p.read_text(encoding='utf-8')
          tag='<script src="assets/v8-bump-direct.js?v=bump-20260826a" defer></script>'
          # Normalize an existing Bump tag if this workflow is re-run.
          text=re.sub(r'<script\s+src="assets/v8-bump-direct\.js(?:\?[^\"]*)?"\s+defer></script>',tag,text)
          if tag not in text:
              lines=text.splitlines()
              pos=None
              for marker in ('assets/v8-driveco-direct-overlay.js','assets/v8-allego-direct.js','assets/v8-france-cpo-gap-overlay.js'):
                  hits=[i for i,line in enumerate(lines) if marker in line]
                  if hits: pos=hits[-1]; break
              if pos is None:
                  hits=[i for i,line in enumerate(lines) if '</body>' in line.lower()]
                  if not hits: raise SystemExit('No safe insertion point in index.html')
                  pos=hits[0]-1
              lines.insert(pos+1,tag);text='\n'.join(lines)+'\n'
          p.write_text(text,encoding='utf-8')
          assert text.count('assets/v8-bump-direct.js')==1
          print('Bump runtime loader present')
          PY

      - name: Validate loader and source pin
        run: |
          grep -F 'assets/v8-bump-direct.js?v=bump-20260826a' index.html
          grep -F '97b5987ebf7e78fefea94dc4274b16949e084d58' .github/workflows/v8-bump-direct.yml

      - name: Publish Bump V8 data and loader
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bump_direct_tariffs_tcc_france.json.gz index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(bump): publish exact France direct tariffs in V8 [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin release/2026-08 && git push origin HEAD:release/2026-08; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
