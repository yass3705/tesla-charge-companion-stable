name: V9 isolated device test Pages

on:
  pull_request:
    branches: ['refactor/unified-data-engine-v9']
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'v9-production-shell/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'ops/v9/production-shell-readiness.json'
      - '.github/workflows/v9-device-test-pages.yml'
  push:
    branches: ['refactor/unified-data-engine-v9']
    paths:
      - 'v9-app/**'
      - 'v9-gate/**'
      - 'v9-production-shell/**'
      - 'assets/v9/**'
      - 'data/v9/**'
      - 'ops/v9/production-shell-readiness.json'
      - '.github/workflows/v9-device-test-pages.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Type DEPLOY_V9_TEST to publish /v9-test/ while keeping main at root'
        required: true
        default: 'NO'
      target_sha:
        description: 'Exact observed V9 runtime candidate SHA to deploy'
        required: true
        default: '8d2c20b7c76004389edd8f4a3b80d6b314900ba0'
      confirm_replace_locked_test_deployment:
        description: 'Type REPLACE_LOCKED_V9_TEST to replace only the isolated /v9-test/ subtree'
        required: true
        default: 'NO'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-isolated-device-test-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (
        inputs.deploy == 'DEPLOY_V9_TEST' &&
        inputs.confirm_replace_locked_test_deployment == 'REPLACE_LOCKED_V9_TEST'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current V9 control plane and shell
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'refactor/unified-data-engine-v9' }}
          path: v9control
          fetch-depth: 0
      - name: Checkout exact observed V9 runtime candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || '8d2c20b7c76004389edd8f4a3b80d6b314900ba0' }}
          path: v9candidate
          fetch-depth: 0
      - name: Validate immutable candidate contract
        shell: bash
        run: |
          set -euo pipefail
          target="$(git -C v9candidate rev-parse HEAD)"
          expected="$(node -e "const x=require('./v9control/ops/v9/production-shell-readiness.json');process.stdout.write(x.observedCandidateSha)")"
          fingerprint="$(node -e "const x=require('./v9control/ops/v9/production-shell-readiness.json');process.stdout.write(x.runtimeFingerprint)")"
          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'candidate must resolve to an exact lowercase 40-character commit SHA.' >&2
            exit 1
          fi
          if [ "$target" != "$expected" ]; then
            echo "Runtime candidate $target differs from readiness-pinned candidate $expected." >&2
            exit 1
          fi
          shell_target="$(node -e "const x=require('./v9control/v9-production-shell/shell-config.json');process.stdout.write(x.observedCandidateSha)")"
          shell_fingerprint="$(node -e "const x=require('./v9control/v9-production-shell/shell-config.json');process.stdout.write(x.runtimeFingerprint)")"
          if [ "$shell_target" != "$expected" ] || [ "$shell_fingerprint" != "$fingerprint" ]; then
            echo 'Shell candidate/fingerprint does not match the production-shell readiness gate.' >&2
            exit 1
          fi
          echo "Pinned runtime candidate accepted: $target ($fingerprint)."
      - name: Checkout production main snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Build isolated /v9-test tree from pinned runtime + current shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/v9-test
          mkdir -p site/v9-test/{v9-app,v9-gate,v9-production-shell,assets/v9,data/v9,data/non_tesla_netherlands}
          rsync -a --delete v9candidate/v9-app/ site/v9-test/v9-app/
          rsync -a --delete v9candidate/v9-gate/ site/v9-test/v9-gate/
          cp v9candidate/v9-gate/test-gate.js site/v9-test/v9-gate/gate.js
          rsync -a --delete v9candidate/assets/v9/ site/v9-test/assets/v9/
          rsync -a --delete v9candidate/data/v9/ site/v9-test/data/v9/
          cp v9candidate/data/tesla_stations.json site/v9-test/data/tesla_stations.json
          cp v9candidate/data/ionity_direct_stations_france.json.gz site/v9-test/data/ionity_direct_stations_france.json.gz
          cp v9candidate/data/atlante_direct_stations_france.json.gz site/v9-test/data/atlante_direct_stations_france.json.gz
          cp v9candidate/data/powerdot_direct_france.json.gz site/v9-test/data/powerdot_direct_france.json.gz
          cp v9candidate/data/netherlands_direct_tariffs_v1.json site/v9-test/data/netherlands_direct_tariffs_v1.json
          rsync -a --delete v9candidate/data/non_tesla_netherlands/ site/v9-test/data/non_tesla_netherlands/
          rsync -a --delete v9control/v9-production-shell/ site/v9-test/v9-production-shell/
          node - <<'NODE'
          const fs=require('fs');
          const p='site/v9-test/v9-production-shell/shell-config.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.mode='shadow';
          x.controlBase='../../';
          x.controlIndex='../../index.html';
          x.controlFallback='../../';
          x.runtimeBase='v9-test';
          x.notes='Isolated Pages artifact: stable root UI + exact pinned V9 runtime; shadow only.';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
      - name: Validate isolated artifact and immutable production root
        shell: bash
        run: |
          set -euo pipefail
          cmp -s site/index.html <(git -C site show HEAD:index.html)
          cmp -s site/v9-test/assets/v9/runtime-engine.js v9candidate/assets/v9/runtime-engine.js
          cmp -s site/v9-test/data/v9/source-registry.json v9candidate/data/v9/source-registry.json
          cmp -s site/v9-test/data/tesla_stations.json v9candidate/data/tesla_stations.json
          test -s site/v9-test/v9-gate/index.html
          test -s site/v9-test/v9-app/index.html
          test -s site/v9-test/v9-production-shell/index.html
          test -s site/v9-test/v9-production-shell/bridge.js
          test -s site/v9-test/assets/v9/runtime-engine.js
          test -s site/v9-test/data/v9/source-registry.json
          node --check site/v9-test/v9-gate/gate.js
          node --check site/v9-test/v9-app/app.js
          node --check site/v9-test/v9-production-shell/bridge.js
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('site/v9-test/v9-production-shell/shell-config.json','utf8'));
          if(x.mode!=='shadow')throw new Error('isolated shell is not shadow-only');
          if(x.controlBase!=='../../'||x.controlIndex!=='../../index.html'||x.controlFallback!=='../../')throw new Error('isolated shell does not fail closed to production root');
          if(x.runtimeBase!=='v9-test')throw new Error('isolated shell does not point to pinned V9 runtime subtree');
          if(x.observedCandidateSha!=='8d2c20b7c76004389edd8f4a3b80d6b314900ba0')throw new Error('candidate pin lost');
          console.log('PASS isolated stable-UI/V9-engine shell artifact.');
          NODE
          echo 'Isolated V9 test package validated; production root remains byte-identical to main.'
      - name: Upload Pages artifact for explicit manual deployment only
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy == 'DEPLOY_V9_TEST' &&
          inputs.confirm_replace_locked_test_deployment == 'REPLACE_LOCKED_V9_TEST'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == 'DEPLOY_V9_TEST' &&
      inputs.confirm_replace_locked_test_deployment == 'REPLACE_LOCKED_V9_TEST'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production main + isolated V9 test subtree
        id: deployment
        uses: actions/deploy-pages@v4
