name: Audit France Metropolis canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/metropolis_direct_tariffs_v1.json'
      - 'scripts/materialize_france_metropolis_offers.py'
      - 'scripts/test_metropolis_materializer.py'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-metropolis-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metropolis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate source and materializer
        run: |
          python -m py_compile scripts/materialize_france_metropolis_offers.py scripts/test_metropolis_materializer.py
          python scripts/test_metropolis_materializer.py
          python - <<'PY'
          import json
          d=json.load(open('data/metropolis_direct_tariffs_v1.json',encoding='utf-8'))
          assert d['verifiedAt']=='2026-09-01'
          assert d['validFrom']=='2026-01-01'
          assert d['scope']['legacyMetropolis100NeverUsed'] is True
          subs={x['id']:x for x in d['subscriptions']}
          assert subs['metropolis-liberte']['annualFeeEur']==10.0
          assert subs['metropolis-mensuel']['monthlyFeeEur']==9.90
          assert subs['metropolis-mensuel']['expressPricePerKwh']==0.53
          assert all(x['rankableWhenSelected'] is False for x in subs.values())
          PY
      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json
      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84013/download' --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84098/download' --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv
      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py --static-csv .tmp/irve/static.csv --dynamic-csv .tmp/irve/dynamic.csv --registry data/france_irve_operator_registry_v1.json --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py --canonical-dir build/france_irve --operator-registry data/france_irve_operator_registry_v1.json --network-registry build/france_irve/effective_tariff_network_registry.json --out-dir build/france_irve_identity
      - name: Materialize Metropolis
        run: python scripts/materialize_france_metropolis_offers.py --source data/metropolis_direct_tariffs_v1.json --canonical-dir build/france_irve_identity --out-dir build/france_irve_offers
      - name: Validate canonical coverage
        run: |
          python - <<'PY'
          import gzip,json
          r=json.load(open('build/france_irve_offers/metropolis_materialization_report.json',encoding='utf-8'));s=r['summary']
          assert 180 <= s['eligibleStationCount'] <= 240,s
          assert 900 <= s['eligiblePdcCount'] <= 1250,s
          assert s['coveredPdcCount'] + s['unresolvedPdcCount'] == s['eligiblePdcCount'],s
          assert s['publicRankableOfferCount'] == s['coveredPdcCount'],s
          assert s['subscriptionReferenceOfferCount'] == 2*s['coveredPdcCount'],s
          assert s['physicalInventoryMutationCount']==0,s
          f=r['familyPdcCounts']
          assert f.get('metropolis-city-22_25',0)>0 and f.get('metropolis-express-150_180',0)>0,f
          with gzip.open('build/france_irve_offers/metropolis_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as fh:offers=json.load(fh)
          assert all(x['tariffNetworkId']=='metropolis' for x in offers)
          assert all(all(rule.get('parkingPerMinute',0)==0 for rule in x['pricingRules']) for x in offers)
          refs=[x for x in offers if x['subscriptionId'] is not None]
          assert refs and all(x['rankable'] is False for x in refs)
          assert all('monthly_post_charge_allowance_state_not_tracked' in x['blockedReasons'] for x in refs)
          public=[x for x in offers if x['subscriptionId'] is None]
          assert public and all(x['rankable'] is True for x in public)
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Upload Metropolis audit
        uses: actions/upload-artifact@v4
        with:
          name: france-metropolis-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/metropolis_materialization_report.json
            build/france_irve_offers/metropolis_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
