name: V9 self enrollment safety

on:
  pull_request:
    paths:
      - 'assets/v9/self-enrollment-engine.js'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - 'tests/v9-self-enrollment.test.cjs'
      - '.github/workflows/v9-self-enrollment.yml'
  push:
    branches: [main, refactor/unified-data-engine-v9]
    paths:
      - 'assets/v9/self-enrollment-engine.js'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - 'tests/v9-self-enrollment.test.cjs'
      - '.github/workflows/v9-self-enrollment.yml'
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/v9/self-enrollment-engine.js
          node --check scripts/v9-first-device-test-runbook.cjs
      - name: Self enrollment contract
        run: node tests/v9-self-enrollment.test.cjs
      - name: Repository access state invariant
        run: node scripts/v9-first-device-test-runbook.cjs
