name: Build e-Vadea EVSE tariff map

on:
  workflow_dispatch:
  push:
    branches: ["release/2026-08"]
    paths:
      - "scripts/build_evadea_evse_tariffs.py"
      - ".github/workflows/build-evadea-tariff-map.yml"

permissions:
  contents: write

concurrency:
  group: build-evadea-tariff-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Compile builder
        run: python -m py_compile scripts/build_evadea_evse_tariffs.py

      - name: Build validated e-Vadea map
        run: python scripts/build_evadea_evse_tariffs.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/evadea_evse_tariffs_v1.json').read_text(encoding='utf-8'))
          assert p['operator']=='e-Vadea'
          assert p['validatedInventory']['rowCount']==331
          assert p['validatedInventory']['uniqueEvseCount']==331
          assert p['validatedInventory']['contextCounts']=={'motorway':325,'off_motorway':6}
          assert len(p['evses'])==331
          assert all(v['pricePerKwhEur'] in (0.40,0.48,0.58,0.62) for v in p['evses'].values())
          assert all(v['occupancy']['graceMinutes']==5 for v in p['evses'].values())
          assert all(v['occupancy']['startedBlockMinutes']==15 for v in p['evses'].values())
          print('e-Vadea EVSE map validated')
          PY

      - name: Publish map on release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evadea_evse_tariffs_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(v8): publish validated e-Vadea EVSE tariff map [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin release/2026-08
            if git push origin HEAD:release/2026-08; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
