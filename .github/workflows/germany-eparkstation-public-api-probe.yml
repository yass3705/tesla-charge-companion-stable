name: Germany eparkstation public API probe

on:
  pull_request:
    paths:
      - 'scripts/probe_eparkstation_public_api_v9.py'
      - '.github/workflows/germany-eparkstation-public-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public eparkstation routes
        run: python scripts/probe_eparkstation_public_api_v9.py
