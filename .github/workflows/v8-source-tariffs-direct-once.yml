name: V8 source tariff display — one shot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v8-source-tariffs-direct-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Patch tariffLabel to read simulated source pricing directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/august-release.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('  function tariffLabel(st,time){')
          end=s.find('  function congestionInfo(', start)
          if start < 0 or end < 0:
              raise SystemExit(f'tariffLabel boundaries missing: start={start} end={end}')
          replacement="""  function tariffLabel(st,time){
    let rules=legacyPricingToRules(st.pricing),rule=ruleForMinute(rules,mins(time));
    if(!rule)return'Tarif non disponible';
    let c=(rule.currency||'EUR').toUpperCase(),parts=[];
    const fmt=(v,d=3)=>Number(v||0).toFixed(d).replace(/0+$/,'').replace(/\\.$/,'');
    if(rule.billing==='kwh'&&Number(rule.pricePerKwh||0)>0)parts.push(`${fmt(rule.pricePerKwh)} ${c}/kWh`);
    if(Number(rule.chargePerMinute||0)>0)parts.push(`${fmt(rule.chargePerMinute)} ${c}/min`);
    if(rule.billing==='minute'&&!Number(rule.chargePerMinute||0))parts.push(`tarif à la minute (${c})`);
    if(rule.billing==='powerMinute')parts.push(`tarif/min selon puissance (${c})`);
    if(Number(rule.connectionFee||0)>0)parts.push(`${fmt(rule.connectionFee,2)} ${c} fixe`);
    if(Number(rule.idlePerMinute||0)>0)parts.push(`${fmt(rule.idlePerMinute)} ${c}/min occupation`);
    if(Number(rule.afterMinutesRate||0)>0&&Number(rule.afterMinutesThreshold||0)>0)parts.push(`${fmt(rule.afterMinutesRate)} ${c}/min après ${Math.round(rule.afterMinutesThreshold)} min`);
    if(rule.scope==='timeWindow'&&(rule.start||rule.end))parts.push(`créneau ${rule.start||'00:00'}–${rule.end||'24:00'}`);
    return parts.length?parts.join(' + '):'Tarif variable';
  }
"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          node --check assets/august-release.js
          grep -q "connectionFee" assets/august-release.js
          grep -q "afterMinutesThreshold" assets/august-release.js
          grep -q "créneau" assets/august-release.js

      - name: Commit release source-first tariff display
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/august-release.js
          git commit -m 'fix(v8): display tariff components from source pricing'
          git push origin HEAD:release/2026-08
