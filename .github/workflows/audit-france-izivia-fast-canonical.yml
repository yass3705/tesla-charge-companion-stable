name: Audit France IZIVIA FAST canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_izivia_fast_offers.py'
      - 'scripts/test_izivia_fast_materializer.py'
      - 'data/izivia_fast_direct_tariff_v1.json'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-izivia-fast-canonical.yml'

permissions:
  contents: read

jobs:
  izivia-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate IZIVIA FAST materializer
        run: |
          python -m py_compile scripts/materialize_france_izivia_fast_offers.py scripts/test_izivia_fast_materializer.py
          python scripts/test_izivia_fast_materializer.py

      - name: Validate official FAST tariff source
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/izivia_fast_direct_tariff_v1.json',encoding='utf-8'))
          assert d.get('dataset')=='izivia-fast-direct-france-v1'
          assert d.get('schemaVersion')=='1.0.0'
          s=d.get('scope') or {}
          assert s.get('countryCode')=='FR'
          assert s.get('network')=='IZIVIA FAST'
          assert s.get('onlyDirectCpo') is True
          assert s.get('roamingIncluded') is False
          assert s.get('subscriptionDiscountsIncluded') is False
          assert s.get('failClosed') is True
          t=d.get('tariff') or {}
          assert t.get('currency')=='EUR' and t.get('billing')=='kwh'
          got=[(r.get('start'),r.get('end'),float(r.get('pricePerKwh'))) for r in t.get('windows') or []]
          assert got==[
            ('00:00','11:30',0.30),
            ('11:30','15:00',0.35),
            ('15:00','18:00',0.30),
            ('18:00','24:00',0.35),
          ]
          print(json.dumps({'generatedAt':d.get('generatedAt'),'windows':got},ensure_ascii=False,indent=2))
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize IZIVIA FAST canonical offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_izivia_fast_offers.py \
            --source data/izivia_fast_direct_tariff_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate IZIVIA FAST canonical scope
        run: |
          python - <<'PY'
          import gzip,json
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/izivia_fast_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/izivia_fast_materialization_report.json',encoding='utf-8'))
          s=report['summary']
          assert s['canonicalIziviaFastStationCount'] >= 550
          assert s['canonicalIziviaFastPdcCount'] >= 2000
          assert s['materializedOfferCount']==len(offers)==s['rankableOfferCount']
          assert s['rankableCoveredPdcCount']/s['canonicalIziviaFastPdcCount'] >= 0.95
          assert s['physicalInventoryMutationCount']==0
          assert s['happyHourPriceEurPerKwh']==0.30
          assert s['standardPriceEurPerKwh']==0.35
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs
              assert stations[sid].get('tariffNetworkId')=='izivia-fast'
              assert pdcs[pid].get('tariffNetworkId')=='izivia-fast'
              assert row.get('tariffNetworkId')=='izivia-fast'
              assert row.get('channel')=='direct'
              assert row.get('rankable') is True
              assert row.get('subscriptionId') is None
              prices=[r.get('pricePerKwh') for r in row.get('pricingRules',[])]
              assert prices==[0.30,0.35,0.30,0.35]
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload IZIVIA FAST audit
        uses: actions/upload-artifact@v4
        with:
          name: france-izivia-fast-canonical-audit
          path: |
            build/france_irve/operator_gap_report.json
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/izivia_fast_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/izivia_fast_materialization_report.json
          retention-days: 14
