name: V9 device test window console safety
on:
  pull_request:
    paths:
      - 'assets/v9/device-test-window-engine.js'
      - 'v9-device-test-console/**'
      - 'tests/v9-device-test-window-engine.test.cjs'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/rollout-config.json'
      - '.github/workflows/v9-device-test-window-console.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check assets/v9/device-test-window-engine.js
          node --check v9-device-test-console/console.js
      - name: Window plan contract
        run: node tests/v9-device-test-window-engine.test.cjs
      - name: Confirm repository remains closed by default
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const self=JSON.parse(fs.readFileSync('data/v9/self-enrollment-config.json'));
          const ready=JSON.parse(fs.readFileSync('data/v9/access-readiness.json'));
          const policy=JSON.parse(fs.readFileSync('data/v9/device-test-policy.json'));
          const rollout=JSON.parse(fs.readFileSync('data/v9/rollout-config.json'));
          if(self.enabled!==false) throw new Error('self-enrollment must remain disabled in repository');
          if(self.tokenSha256!=='') throw new Error('repository must not contain an active test token hash');
          if(ready.ready!==false || ready.verdict!=='BLOCKED') throw new Error('access readiness must remain BLOCKED');
          if(policy.enabled!==false) throw new Error('device-test policy must remain disabled');
          if(Number(rollout.canaryPercent)!==0) throw new Error('random canary must remain 0%');
          if(rollout.stage!=='preview') throw new Error('rollout stage must remain preview');
          NODE
      - name: Console cannot write GitHub
        run: |
          if grep -R -Ei 'api\.github\.com|github\.com/.*/contents|fetch\([^)]*(PUT|POST|PATCH|DELETE)' v9-device-test-console assets/v9/device-test-window-engine.js; then
            echo 'Unexpected GitHub write capability in local console' >&2
            exit 1
          fi
