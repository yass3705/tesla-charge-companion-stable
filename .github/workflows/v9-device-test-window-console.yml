name: V9 device test window console safety
on:
  pull_request:
    paths:
      - 'assets/v9/device-test-window-engine.js'
      - 'v9-device-test-console/**'
      - 'tests/v9-device-test-window-engine.test.cjs'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - '.github/workflows/v9-device-test-window-console.yml'
  push:
    branches: [main, refactor/unified-data-engine-v9]
    paths:
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - '.github/workflows/v9-device-test-window-console.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check assets/v9/device-test-window-engine.js
          node --check v9-device-test-console/console.js
          node --check scripts/v9-first-device-test-runbook.cjs
      - name: Window plan contract
        run: node tests/v9-device-test-window-engine.test.cjs
      - name: Repository access state invariant
        run: node scripts/v9-first-device-test-runbook.cjs
      - name: Console cannot write GitHub
        run: |
          if grep -R -Ei 'api\.github\.com|github\.com/.*/contents|fetch\([^)]*(PUT|POST|PATCH|DELETE)' v9-device-test-console assets/v9/device-test-window-engine.js; then
            echo 'Unexpected GitHub write capability in local console' >&2
            exit 1
          fi
