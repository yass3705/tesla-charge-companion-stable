name: Align France catalog to canonical corrected artifact — final one shot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/align-france-canonical-final-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-aedc-8246-9aba-3752734de656/raw?se=2026-08-18T13%3A07%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=f2c94db6-348a-5fa7-97e7-29543518a1dd&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T06%3A04%3A45Z&ske=2026-08-19T06%3A04%3A45Z&sks=b&skv=2026-02-06&sig=7ynCp2R/qq3cr%2BuknW3W01CNG8XY7O52n5ouJx5enqY%3D'
      EXPECTED_ZIP_SHA256: '44e9370628c453229ebbde1799a5c8e3599bc1eb782f9a4b167716a5f1d41461'
      EXPECTED_DATA_SHA256: '19d600ba24688402ed39d7c10b6c0295ace03751da3a4bb7b03dbf8b097f63b8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/france-canonical
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/france-canonical.zip
          echo "$EXPECTED_ZIP_SHA256  /tmp/france-canonical.zip" | sha256sum -c -
          unzip -q /tmp/france-canonical.zip -d /tmp/france-canonical
          echo "$EXPECTED_DATA_SHA256  /tmp/france-canonical/france_non_tesla_final.json.gz" | sha256sum -c -
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/france-canonical/france_non_tesla_final.summary.json','utf8'));
          if(s.schemaVersion!=='1.1.0'||s.stations!==42720||s.legacyElectraOnlyDedup?.collapsedLegacyElectraOnlyStations!==696)throw new Error('Canonical summary mismatch');
          NODE

      - name: Make geographic tile cache refresh-safe
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='assets/france-catalog.js';
          let s=fs.readFileSync(p,'utf8');
          const replacements=[
            ["async function readGzipJson(file){","async function readGzipJson(file,version=''){"],
            ["    if(rawCache.has(file))return rawCache.get(file);","    const cacheKey=`${file}|${version}`;\n    if(rawCache.has(cacheKey))return rawCache.get(cacheKey);"],
            ["      const response=await fetch(BASE+file,{cache:'force-cache'});","      const url=BASE+file+(version?`?v=${encodeURIComponent(version)}`:'');\n      const response=await fetch(url,{cache:'force-cache'});"],
            ["    rawCache.set(file,promise);","    rawCache.set(cacheKey,promise);"],
            ["    try{return await promise}catch(err){rawCache.delete(file);throw err}","    try{return await promise}catch(err){rawCache.delete(cacheKey);throw err}"],
            ["    if(!(radiusKm>0))return readGzipJson(manifest.allFile);","    const version=manifest.generatedAt||manifest.allSha256||'';\n    if(!(radiusKm>0))return readGzipJson(manifest.allFile,version);"],
            ["    const chunks=await Promise.all(tiles.map(t=>readGzipJson(t.file)));","    const chunks=await Promise.all(tiles.map(t=>readGzipJson(t.file,version)));"],
          ];
          for(const [oldText,newText] of replacements){
            if(s.includes(newText))continue;
            if(!s.includes(oldText))throw new Error(`Cache patch marker missing: ${oldText}`);
            s=s.replace(oldText,newText);
          }
          fs.writeFileSync(p,s);
          NODE
          node --check assets/france-catalog.js

      - name: Rebuild runtime from canonical source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_france_runtime_catalog.mjs /tmp/france-canonical/france_non_tesla_final.json.gz data/non_tesla_france
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/non_tesla_france/manifest.json','utf8'));
          if(m.stationCount!==42720||m.configurationCount!==157881||m.tileCount!==338||m.skippedWithoutCoordinates!==0)throw new Error(JSON.stringify(m));
          NODE

      - name: Record canonical provenance and build 7310
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const manifestPath='data/non_tesla_france/manifest.json';
          const m=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const source=JSON.parse(fs.readFileSync('/tmp/france-canonical/france_non_tesla_final.summary.json','utf8'));
          m.integration={
            appBuild:'7310',mode:'lazy-geographic-runtime',customFranceCleanup:true,teslaDatasetModified:false,
            sourceArtifactRunId:32139644174,sourceArtifactId:9325368400,
            sourceArtifactSha256:'44e9370628c453229ebbde1799a5c8e3599bc1eb782f9a4b167716a5f1d41461',
            sourceDataSha256:'19d600ba24688402ed39d7c10b6c0295ace03751da3a4bb7b03dbf8b097f63b8',
            parkingTimeRateFix:true,tileCacheVersioned:true,
            legacyElectraOnlyDedup:{policy:'unique structured EVSE + <=100m + (<=15m or exact normalized address/name)',collapsedStations:source.legacyElectraOnlyDedup.collapsedLegacyElectraOnlyStations,targetStations:source.legacyElectraOnlyDedup.targetElectroverseStations,beforeStations:source.legacyElectraOnlyDedup.beforeStations,afterStations:source.legacyElectraOnlyDedup.afterStations}
          };
          fs.writeFileSync(manifestPath,JSON.stringify(m,null,2)+'\n');

          let html=fs.readFileSync('index.html','utf8').replaceAll('7309','7310');
          fs.writeFileSync('index.html',html);
          const v=JSON.parse(fs.readFileSync('app-version.json','utf8'));
          v.build='7310';v.updatedAt=new Date().toISOString();
          fs.writeFileSync('app-version.json',JSON.stringify(v,null,2)+'\n');

          const custom=JSON.parse(fs.readFileSync('data/custom_stations.json','utf8'));
          if(custom.stations.length!==10)throw new Error('Custom stations changed');
          const tesla=JSON.parse(fs.readFileSync('data/tesla_stations.json','utf8'));
          if(!Array.isArray(tesla)||tesla.length<100)throw new Error('Tesla dataset unexpected');
          if(!html.includes('assets/france-catalog.js?v=7310'))throw new Error('Build cache key not updated');
          console.log(`Build 7310 ready: ${m.stationCount} France non-Tesla, ${custom.stations.length} custom; Tesla untouched.`);
          NODE

      - name: Commit atomically and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-france-canonical-final-once.yml
          git add data/non_tesla_france assets/france-catalog.js index.html app-version.json
          git commit -m 'feat: align France catalog to canonical corrected artifact'
          git push origin HEAD:main
