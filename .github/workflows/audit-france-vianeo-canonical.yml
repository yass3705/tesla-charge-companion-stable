name: Audit France Vianeo canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_vianeo_offers.py'
      - 'scripts/test_vianeo_materializer.py'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-vianeo-canonical.yml'

permissions:
  contents: read

jobs:
  vianeo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Vianeo materializer
        run: |
          python -m py_compile scripts/materialize_france_vianeo_offers.py scripts/test_vianeo_materializer.py
          python scripts/test_vianeo_materializer.py

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Fetch official Vianeo tariff source
        run: |
          mkdir -p .tmp/vianeo
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/operator_direct/vianeo_official_france.json' \
            --output .tmp/vianeo/vianeo_official_france.json
          python - <<'PY'
          import json
          data=json.load(open('.tmp/vianeo/vianeo_official_france.json',encoding='utf-8'))
          assert data.get('dataset')=='engie-vianeo-official-france'
          assert data.get('country')=='FR'
          c=data.get('classification') or {}
          assert c.get('nationalSubscriptionTariffExists') is True
          assert c.get('stationLevelPriceLookupRequiredForExactSimulation') is True
          m=(data.get('operatorDirect') or {}).get('vianeoMax') or {}
          assert float(m.get('monthlyFeeEur'))==9.99
          assert float(m.get('eurPerKwh'))==0.33
          assert m.get('stationMinuteFeesCanStillApply') is True
          assert m.get('excludesHeavyGoodsDedicatedPoints') is True
          print(json.dumps({'generatedAt':data.get('generatedAt'),'vianeoMax':m},ensure_ascii=False,indent=2))
          PY

      - name: Materialize Vianeo canonical reference offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_vianeo_offers.py \
            --source .tmp/vianeo/vianeo_official_france.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate Vianeo canonical scope
        run: |
          python - <<'PY'
          import gzip,json
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/vianeo_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/vianeo_materialization_report.json',encoding='utf-8'))
          s=report['summary']
          assert s['canonicalVianeoStationCount'] >= 500
          assert s['canonicalVianeoPdcCount'] >= 4000
          assert s['materializedReferenceOfferCount']==len(offers)==s['canonicalVianeoPdcCount']
          assert s['referenceCoveredPdcCount']==s['canonicalVianeoPdcCount']
          assert s['rankableOfferCount']==0
          assert s['physicalInventoryMutationCount']==0
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs
              assert pdcs[pid].get('stationId')==sid
              assert stations[sid].get('tariffNetworkId')=='engie-vianeo'
              assert pdcs[pid].get('tariffNetworkId')=='engie-vianeo'
              assert row.get('tariffNetworkId')=='engie-vianeo'
              assert row.get('subscriptionId')=='vianeo-max'
              assert row.get('rankable') is False
              assert 'station_specific_minute_fee_unresolved' in row.get('blockedReasons',[])
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload Vianeo audit
        uses: actions/upload-artifact@v4
        with:
          name: france-vianeo-canonical-audit
          path: |
            build/france_irve/operator_gap_report.json
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/vianeo_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/vianeo_materialization_report.json
          retention-days: 14
