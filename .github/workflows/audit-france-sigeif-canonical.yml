name: Audit France SIGEIF canonical
on:
  push:
    branches: [refactor/france-irve-canonical]
    paths:
      - data/sigeif_direct_tariffs_v1.json
      - scripts/materialize_france_sigeif_offers.py
      - scripts/test_sigeif_materializer.py
      - data/france_irve_tariff_network_registry_v1.json
      - data/france_tariff_base_coverage_v1.json
      - .github/workflows/audit-france-sigeif-canonical.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sigeif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Validate source
        run: |
          python -m py_compile scripts/materialize_france_sigeif_offers.py scripts/test_sigeif_materializer.py
          python scripts/test_sigeif_materializer.py
      - name: Build registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py --registry data/france_irve_tariff_network_registry_v1.json --additions data/france_irve_tariff_network_additions_v1.json --coverage data/france_tariff_base_coverage_v1.json --out build/france_irve/effective_tariff_network_registry.json
      - name: Download PAN
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 'https://transport.data.gouv.fr/resources/84013/download' -o .tmp/irve/static.csv
          curl --fail --location --retry 3 'https://transport.data.gouv.fr/resources/84098/download' -o .tmp/irve/dynamic.csv
      - name: Rebuild canonical France
        run: |
          python scripts/run_france_irve_canonical.py --static-csv .tmp/irve/static.csv --dynamic-csv .tmp/irve/dynamic.csv --registry data/france_irve_operator_registry_v1.json --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py --canonical-dir build/france_irve --operator-registry data/france_irve_operator_registry_v1.json --network-registry build/france_irve/effective_tariff_network_registry.json --out-dir build/france_irve_identity
      - name: Materialize SIGEIF
        run: python scripts/materialize_france_sigeif_offers.py --source data/sigeif_direct_tariffs_v1.json --canonical-dir build/france_irve_identity --out-dir build/france_irve_offers
      - name: Validate coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('build/france_irve_offers/sigeif_materialization_report.json'));s=r['summary']
          assert 450 <= s['eligibleStationCount'] <= 550,s
          assert 1100 <= s['eligiblePdcCount'] <= 1400,s
          assert s['coveredPdcCount']==s['eligiblePdcCount'],s
          assert s['rankableOfferCount']==s['eligiblePdcCount'],s
          assert s['unresolvedPdcCount']==0,s
          assert s['physicalInventoryMutationCount']==0,s
          assert all(v>0 for v in r['familyPdcCounts'].values()),r['familyPdcCounts']
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: france-sigeif-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/sigeif_materialization_report.json
            build/france_irve_offers/sigeif_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
