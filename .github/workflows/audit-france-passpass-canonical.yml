name: Audit France Pass Pass canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_passpass_offers.py'
      - 'scripts/test_passpass_materializer.py'
      - 'data/passpass_electrique_direct_tariffs_v1.json'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-passpass-canonical.yml'

permissions:
  contents: read

jobs:
  passpass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Pass Pass materializer
        run: |
          python -m py_compile scripts/materialize_france_passpass_offers.py scripts/test_passpass_materializer.py
          python scripts/test_passpass_materializer.py

      - name: Validate Pass Pass tariff source
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/passpass_electrique_direct_tariffs_v1.json',encoding='utf-8'))
          assert d.get('dataset')=='passpass-electrique-direct-tariffs-france'
          assert d.get('networkId')=='passpass' and d.get('country')=='FR'
          s=d.get('scope') or {}
          assert s.get('directNetworkOnly') is True
          assert s.get('physicalInventoryFromIrveOnly') is True
          assert s.get('billingContinuesWhileConnected') is True
          assert s.get('stationTariffClassRequired') is True
          assert s.get('monthlySubscriberCapsRemovedSince')=='2025-04-01'
          offers=d.get('offers') or []
          classes={((o.get('selectors') or {}).get('siteClass')) for o in offers}
          assert classes=={'normal','rapid','ultra','long_stay'}
          subs=d.get('subscriptions') or []
          assert len(subs)==1 and subs[0].get('id')=='passpass-electrique-account'
          assert subs[0].get('rankableWhenSelected') is True and subs[0].get('defaultSelected') is False
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize Pass Pass canonical offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_passpass_offers.py \
            --source data/passpass_electrique_direct_tariffs_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate Pass Pass canonical scope
        run: |
          python - <<'PY'
          import gzip,json
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/passpass_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/passpass_materialization_report.json',encoding='utf-8'))
          s=report['summary']
          assert 600 <= s['canonicalPassPassStationCount'] <= 900
          assert 1600 <= s['canonicalPassPassPdcCount'] <= 2100
          assert s['materializedOfferCount']==len(offers)>0
          assert s['rankableCoveredPdcCount']>1000
          assert s['physicalInventoryMutationCount']==0
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs
              assert stations[sid].get('tariffNetworkId')=='passpass'
              assert pdcs[pid].get('tariffNetworkId')=='passpass'
              assert row.get('tariffNetworkId')=='passpass'
              assert row.get('channel') in {'direct','subscription'}
              if row.get('subscriptionId'):
                  assert row['subscriptionId']=='passpass-electrique-account'
              if (row.get('selectors') or {}).get('siteClass')=='ultra':
                  assert row.get('rankable') is False
                  assert 'station_tariff_class_not_directly_verified' in (row.get('blockedReasons') or [])
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload Pass Pass audit
        uses: actions/upload-artifact@v4
        with:
          name: france-passpass-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/passpass_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/passpass_subscriptions_contract_v1_1.json
            build/france_irve_offers/passpass_materialization_report.json
          retention-days: 14
