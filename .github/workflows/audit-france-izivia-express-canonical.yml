name: Audit France IZIVIA Express canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/izivia_express_direct_v8_source_lock_v1.json'
      - 'data/france_operator_offer_contract_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/materialize_france_izivia_express_offers.py'
      - 'scripts/test_izivia_express_materializer.py'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-izivia-express-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  izivia-express:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate exact-formula materializer
        run: |
          python -m py_compile scripts/materialize_france_izivia_express_offers.py scripts/test_izivia_express_materializer.py
          python scripts/test_izivia_express_materializer.py
          python - <<'PY'
          import json
          contract=json.load(open('data/france_operator_offer_contract_v1.json',encoding='utf-8'))
          assert contract['schemaVersion']=='1.1.3'
          fields=contract['pricingRuleFields']
          required={
            'energyBilling','includedEnergyKwh','occupancyBilling','occupancyBlockMinutes',
            'occupancyBlockFee','occupancyDurationBasis','missingUnplugTimePolicy',
            'totalTransactionCap','timeWindowSelection','roundingEpsilon','formulaFamily'
          }
          assert required <= set(fields),required-set(fields)
          PY

      - name: Download checksum-locked V8 sources
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request
          lock=json.load(open('data/izivia_express_direct_v8_source_lock_v1.json',encoding='utf-8'))
          root=pathlib.Path('.tmp/izivia-express');root.mkdir(parents=True,exist_ok=True)
          base=f"https://raw.githubusercontent.com/{lock['sourceRepository']}/{lock['sourceCommit']}/"
          outputs={'v8Tariffs':'v8.json','officialInventory':'inventory.json'}
          for key,name in outputs.items():
              url=base+lock['files'][key]['path']
              urllib.request.urlretrieve(url,root/name)
              print('downloaded',url)
          PY
          python scripts/test_izivia_express_materializer.py --source-v8 .tmp/izivia-express/v8.json

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84013/download' --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84098/download' --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py --static-csv .tmp/irve/static.csv --dynamic-csv .tmp/irve/dynamic.csv --registry data/france_irve_operator_registry_v1.json --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py --canonical-dir build/france_irve --operator-registry data/france_irve_operator_registry_v1.json --network-registry build/france_irve/effective_tariff_network_registry.json --out-dir build/france_irve_identity

      - name: Materialize IZIVIA Express exact PDC offers
        run: |
          python scripts/materialize_france_izivia_express_offers.py \
            --source-v8 .tmp/izivia-express/v8.json \
            --source-inventory .tmp/izivia-express/inventory.json \
            --source-lock data/izivia_express_direct_v8_source_lock_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate canonical coverage and fail-closed scope
        run: |
          python - <<'PY'
          import gzip,json
          report=json.load(open('build/france_irve_offers/izivia_express_materialization_report.json',encoding='utf-8'))
          summary=report['summary']
          assert 130 <= summary['canonicalEligibleStationCount'] <= 180,summary
          assert 430 <= summary['canonicalEligiblePdcCount'] <= 570,summary
          assert summary['rankableCoveredPdcCount'] == summary['materializedOfferCount'] == summary['rankableOfferCount'],summary
          assert summary['rankableCoveredPdcCount'] >= 400,summary
          assert summary['rankableCoveredPdcCount'] + summary['failClosedPdcCount'] == summary['canonicalEligiblePdcCount'],summary
          assert summary['sourceExactPdcMatchedCount'] >= summary['rankableCoveredPdcCount'],summary
          assert 0 < summary['failClosedPdcCount'] <= 100,summary
          assert summary['physicalInventoryMutationCount']==0,summary
          families=report['formulaFamilyPdcCounts']
          assert set(families)=={'session_cap','day_night_included_energy','simple_postcharge'},families
          assert all(value>0 for value in families.values()),families
          reasons=report['unresolvedReasonPdcCounts']
          assert reasons.get('direct_price_not_published',0)>0,reasons
          with gzip.open('build/france_irve_offers/izivia_express_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as handle:
              offers=json.load(handle)
          assert len(offers)==summary['materializedOfferCount']
          assert len({row['offerId'] for row in offers})==len(offers)
          assert len({row['canonicalPdcId'] for row in offers})==len(offers)
          for row in offers:
              assert row['tariffNetworkId']=='izivia-express'
              assert row['channel']=='direct' and row['subscriptionId'] is None
              assert row['sourceMode']=='station_evse' and row['matchMethod']=='exact_pdc_itinerance'
              assert row['sourceStationId']==row['canonicalStationId']
              assert row['sourceEvseId']==row['canonicalPdcId']
              assert row['rankable'] is True and row['blockedReasons']==[]
              assert row['selectors']['roamingSeparate'] is True
              assert row['selectors']['subscriptionSeparate'] is True
              assert row['pricingRules']
              for rule in row['pricingRules']:
                  assert rule['currency']=='EUR' and rule['parkingPerMinute']==0
                  assert rule['energyBilling'] in ('linear_kwh','started_kwh')
                  assert rule['roundingEpsilon']==1e-9
                  assert rule['formulaFamily'] in families
          capped=[r for row in offers for r in row['pricingRules'] if r['formulaFamily']=='session_cap']
          included=[r for row in offers for r in row['pricingRules'] if r['includedEnergyKwh']>0]
          post=[r for row in offers for r in row['pricingRules'] if r['occupancyBilling']]
          assert capped and all(r['totalTransactionCap']==50.0 for r in capped)
          assert included and all(r['includedEnergyKwh']==20.0 and r['timeWindowSelection']=='connection_start_local_time' for r in included)
          assert post and all(r['occupancyDurationBasis']=='connected_minutes_minus_charging_minutes' for r in post)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload IZIVIA Express audit
        uses: actions/upload-artifact@v4
        with:
          name: france-izivia-express-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/izivia_express_materialization_report.json
            build/france_irve_offers/izivia_express_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
