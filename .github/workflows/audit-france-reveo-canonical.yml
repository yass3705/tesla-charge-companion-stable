name: Audit France Révéo canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_reveo_offers.py'
      - 'scripts/test_reveo_materializer.py'
      - 'data/reveo_direct_tariffs_france_v1.json'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-reveo-canonical.yml'

permissions:
  contents: read

jobs:
  reveo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Révéo materializer
        run: |
          python -m py_compile scripts/materialize_france_reveo_offers.py scripts/test_reveo_materializer.py
          python scripts/test_reveo_materializer.py

      - name: Validate verified Révéo source scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/reveo_direct_tariffs_france_v1.json',encoding='utf-8'))
          assert d.get('dataset')=='reveo-direct-tariffs-france'
          assert d.get('country')=='FR'
          s=d.get('scope') or {}
          assert s.get('operatorDirectOnly') is True
          assert s.get('roamingIncluded') is False
          assert s.get('roamingTariffsPromotedToDirect') is False
          assert s.get('unverifiedTerritoriesAreRankable') is False
          assert s.get('subscriberOffersRequireSelection') is True
          assert s.get('rankableTerritories')==['S34']
          sub=d.get('subscription') or {}
          assert float(sub.get('monthlyFeeEur'))==1.5
          assert float(sub.get('badgePurchaseEur'))==12.0
          assert sub.get('defaultSelected') is False
          t=(d.get('territories') or {}).get('S34') or {}
          assert t.get('partyId')=='FR*S34'
          assert t.get('status')=='rankable_public_and_subscriber'
          assert t.get('effectiveFrom')=='2025-04-01'
          print(json.dumps({'rankableTerritories':s['rankableTerritories'],'subscription':sub,'S34':t},ensure_ascii=False,indent=2))
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize Révéo S34 canonical offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_reveo_offers.py \
            --source data/reveo_direct_tariffs_france_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate Révéo canonical scope
        run: |
          python - <<'PY'
          import gzip,json,re
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/reveo_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/reveo_materialization_report.json',encoding='utf-8'))
          s=report['summary']
          assert s['canonicalReveoStationCount'] >= 800
          assert s['canonicalReveoPdcCount'] >= 2000
          assert s['canonicalS34StationCount'] > 0
          assert s['canonicalS34PdcCount'] > 100
          assert s['rankableCoveredS34PdcCount'] > 0
          assert s['physicalInventoryMutationCount']==0
          assert s['subscriptionMonthlyFeeEur']==1.5
          assert s['badgePurchaseEur']==12.0
          assert s['materializedOfferCount']==len(offers)==s['rankableOfferCount']
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs
              assert stations[sid].get('tariffNetworkId')=='reveo'
              assert pdcs[pid].get('tariffNetworkId')=='reveo'
              assert row.get('tariffNetworkId')=='reveo'
              assert row.get('matchMethod')=='exact_ocpi_party_id_FR*S34'
              raw=str(pdcs[pid].get('idPdcItinerance') or '').upper().replace(' ','')
              assert raw.startswith('FR*S34')
              assert row.get('rankable') is True
              if row.get('channel')=='subscription':
                  assert row.get('subscriptionId')=='reveo-subscription'
              else:
                  assert row.get('channel')=='direct'
                  assert row.get('subscriptionId') is None
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload Révéo audit
        uses: actions/upload-artifact@v4
        with:
          name: france-reveo-canonical-audit
          path: |
            build/france_irve/operator_gap_report.json
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/reveo_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/reveo_materialization_report.json
          retention-days: 14
