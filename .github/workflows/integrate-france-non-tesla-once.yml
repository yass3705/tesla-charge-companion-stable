name: Intégrer le catalogue France hors Tesla — one shot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/integrate-france-non-tesla-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-france-non-tesla-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-eea0-81f4-83d3-5f5e92e51471/raw?se=2026-08-18T12%3A40%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=2a80a5d5-6dea-52fb-a8db-c713298f0d09&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T06%3A04%3A45Z&ske=2026-08-19T06%3A04%3A45Z&sks=b&skv=2026-02-06&sig=W/BK9DcuzdsVuZHJdextooudTeyAE6BPTLEWkFXvqa8%3D'
      EXPECTED_ZIP_SHA256: 'f8cef538e3ccf9a43b88bef54388fcee79e7398bc48b9607d7f499d268c078de'
      EXPECTED_DATA_SHA256: 'c23285db0e62b2c8dffb287fc7a087d6f34f77ebbc9f14e6efaf79ae08c94b65'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Télécharger et valider l’artefact national final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/france-source
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/france-final.zip
          echo "$EXPECTED_ZIP_SHA256  /tmp/france-final.zip" | sha256sum -c -
          unzip -q /tmp/france-final.zip -d /tmp/france-source
          test -f /tmp/france-source/france_non_tesla_final.json.gz
          echo "$EXPECTED_DATA_SHA256  /tmp/france-source/france_non_tesla_final.json.gz" | sha256sum -c -

      - name: Construire le catalogue runtime géographique
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_france_runtime_catalog.mjs \
            /tmp/france-source/france_non_tesla_final.json.gz \
            data/non_tesla_france
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/non_tesla_france/manifest.json','utf8'));
          if(m.stationCount!==43416)throw new Error(`Station count ${m.stationCount}`);
          if(m.tileCount<300)throw new Error(`Tile count ${m.tileCount}`);
          if(!m.configurationCount||m.configurationCount<90000)throw new Error(`Configuration count ${m.configurationCount}`);
          if(!fs.existsSync('data/non_tesla_france/all.json.gz'))throw new Error('all.json.gz absent');
          console.log(`Catalogue validé: ${m.stationCount} stations · ${m.configurationCount} offres/puissances · ${m.tileCount} tuiles`);
          NODE

      - name: Activer le catalogue dans Charge Companion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          for old in ('7305','7306'):
              html=html.replace(f'content="{old}"', 'content="7307"')
              html=html.replace(f'assets/style.css?v={old}', 'assets/style.css?v=7307')
              html=html.replace(f'assets/app.js?v={old}', 'assets/app.js?v=7307')
              html=html.replace(f'assets/dedupe.js?v={old}', 'assets/dedupe.js?v=7307')
          tag='<script src="assets/france-catalog.js?v=7307" defer></script>'
          if tag not in html:
              marker='<script src="assets/dedupe.js?v=7307" defer></script>'
              if marker not in html:
                  raise SystemExit('Balise dedupe introuvable dans index.html')
              html=html.replace(marker, marker+'\n'+tag, 1)
          p.write_text(html,encoding='utf-8')

          version_path=Path('app-version.json')
          version=json.loads(version_path.read_text(encoding='utf-8'))
          version['build']='7307'
          version['version']='7.3 Stable'
          version['updatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          version_path.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest_path=Path('data/non_tesla_france/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['integration']={
              'appBuild':'7307',
              'mode':'lazy-geographic-runtime',
              'customFranceCleanup':True,
              'teslaDatasetModified':False,
              'sourceArtifactRunId':32134067174,
          }
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Vérifications de non-régression
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/france-catalog.js
          node --check scripts/build_france_runtime_catalog.mjs
          grep -q 'assets/france-catalog.js?v=7307' index.html
          node - <<'NODE'
          const fs=require('fs');
          const custom=JSON.parse(fs.readFileSync('data/custom_stations.json','utf8'));
          if(custom.stations.length!==10)throw new Error(`custom_stations: ${custom.stations.length}, attendu 10`);
          const tesla=JSON.parse(fs.readFileSync('data/tesla_stations.json','utf8'));
          if(!Array.isArray(tesla)||tesla.length<100)throw new Error('Base Tesla inattendue');
          const m=JSON.parse(fs.readFileSync('data/non_tesla_france/manifest.json','utf8'));
          if(m.stationCount!==43416)throw new Error('Catalogue France incomplet');
          console.log(`OK: Tesla ${tesla.length} · custom ${custom.stations.length} · France hors Tesla ${m.stationCount}`);
          NODE

      - name: Publier atomiquement et supprimer le workflow one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-france-non-tesla-once.yml
          git add data/non_tesla_france assets/france-catalog.js scripts/build_france_runtime_catalog.mjs index.html app-version.json
          git commit -m 'feat: integrate France non-Tesla national catalog'
          git push origin HEAD:main
