name: Audit France Alize Liberte scope

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/alize_liberte_scope_review_20260901.json'
      - 'scripts/audit_france_alize_liberte_scope.py'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'scripts/enrich_france_irve_network_identity.py'
      - 'scripts/test_france_irve_network_identity.py'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-alize-liberte-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alize-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Alize scope review and identity rules
        run: |
          python -m py_compile scripts/audit_france_alize_liberte_scope.py scripts/test_france_irve_network_identity.py
          python scripts/test_france_irve_network_identity.py
          python - <<'PY'
          import json
          d=json.load(open('data/alize_liberte_scope_review_20260901.json',encoding='utf-8'))
          assert d['dataset']=='alize-liberte-scope-review-france'
          assert d['networkId']=='alize-liberte' and d['country']=='FR'
          assert d['classification']=='umbrella_mobility_offer_not_single_national_tariff'
          p=d['policy']
          assert p['rankGenericAlizeLibertePdc'] is False
          assert p['inheritLocalPartnerTariffNationally'] is False
          assert p['badgePurchaseEur']==12.0 and p['monthlyFeeEur']==0.0
          assert p['failClosed'] is True
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Inventory Alize Liberte scope
        run: |
          mkdir -p build/france_irve_scope
          python scripts/audit_france_alize_liberte_scope.py \
            --canonical-dir build/france_irve_identity \
            --review data/alize_liberte_scope_review_20260901.json \
            --out build/france_irve_scope/alize_liberte_scope_report.json

      - name: Validate fail-closed Alize scope
        run: |
          python - <<'PY'
          import json
          r=json.load(open('build/france_irve_scope/alize_liberte_scope_report.json',encoding='utf-8'))
          s=r['summary']
          assert 250 <= s['canonicalAlizeLiberteStationCount'] <= 500
          assert 1000 <= s['canonicalAlizeLibertePdcCount'] <= 1800
          assert s['rankableOfferCount']==0
          assert s['physicalInventoryMutationCount']==0
          assert s['requiresLocalTariffMapping'] is True
          assert len(r['departmentInventory']) >= 2
          assert sum(x['pdcCount'] for x in r['departmentInventory'])==s['canonicalAlizeLibertePdcCount']
          assert r['physicalOperatorPdcCounts']=={'bouygues-energies-services': s['canonicalAlizeLibertePdcCount']}, r['physicalOperatorPdcCounts']
          assert 'le-plein-tarnais' not in r['physicalOperatorPdcCounts']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          print(json.dumps(r['departmentInventory'][:20],ensure_ascii=False,indent=2))
          print(json.dumps(r['physicalOperatorPdcCounts'],ensure_ascii=False,indent=2))
          PY

      - name: Upload Alize scope audit
        uses: actions/upload-artifact@v4
        with:
          name: france-alize-liberte-scope-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_scope/alize_liberte_scope_report.json
          retention-days: 14
