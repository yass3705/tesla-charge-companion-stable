name: V9 France offer overlays

on:
  workflow_dispatch:
  schedule:
    - cron: '11 5 2 * *'
  push:
    branches: ['refactor/unified-data-engine-v9']
    paths:
      - 'scripts/compile_france_v9_offers.py'
      - 'scripts/compile_belib_v9_offers.py'
      - 'scripts/compile_e55c_v9_offers.py'
      - 'scripts/compile_etotem_v9_offers.py'
      - 'scripts/compile_qovoltis_v9_offers.py'
      - 'scripts/compile_bump_v9_offers.py'
      - 'assets/v9/adapters/direct-offers.js'
      - '.github/workflows/v9-france-offers.yml'

permissions:
  contents: write

concurrency:
  group: v9-france-offers
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-data-engine-v9
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: refactor/france-irve-canonical
          path: legacy-france-canonical
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: main
          path: data-lab
          fetch-depth: 1

      - name: Compile conservative direct and eMSP layers
        run: python scripts/compile_france_v9_offers.py --input legacy-france-canonical/data/tariff_overlay_v1.json
      - name: Compile exact Belib official tariff layer
        run: python scripts/compile_belib_v9_offers.py --input data-lab/data/operator_direct/belib_official_paris.json
      - name: Compile exact E55C EVSE tariff layer
        run: python scripts/compile_e55c_v9_offers.py --station-verification data-lab/data/station_verifications/electric55_lons_le_saunier_rue_lecourbe_alize_2026_08_22.json --operator-source data-lab/data/operator_direct/electric55_official_france.json
      - name: Compile exact e-Totem station and EVSE tariff layer
        run: python scripts/compile_etotem_v9_offers.py --nantes data-lab/data/station_verifications/nantes_etotem_sainte_luce_planchonnais_ac_dc_app_2026_08_22.json --larochelle data-lab/data/station_verifications/la_rochelle_place_jb_marcet_etotem_g10_app_2026_08_22.json --montargis data-lab/data/station_verifications/etotem_montargis_commissariat_app_2026_08_22.json
      - name: Compile exact SYDER-QOVOLTIS territorial tariff layer
        run: python scripts/compile_qovoltis_v9_offers.py --input data-lab/data/operator_direct/syder_qovoltis_official_auvergne_rhone_alpes.json
      - name: Compile exact Bump PDC tariff layer
        run: python scripts/compile_bump_v9_offers.py --tariffs data-lab/data/national/bump_direct_tariffs_tcc_france.json.gz

      - name: Validate offer safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/v9/france-direct-offers.json').read_text())
          e=json.loads(Path('data/v9/france-emsp-offers.json').read_text())
          b=json.loads(Path('data/v9/france-belib-offers.json').read_text())
          x=json.loads(Path('data/v9/france-e55c-offers.json').read_text())
          t=json.loads(Path('data/v9/france-etotem-offers.json').read_text())
          q=json.loads(Path('data/v9/france-qovoltis-offers.json').read_text())
          u=json.loads(Path('data/v9/france-bump-offers.json').read_text())
          r=json.loads(Path('data/v9/france-offer-compile-report.json').read_text())

          assert all(z['country']=='FR' for z in (d,e,b,x,t,q,u))
          assert d['policy']['subscriptionsOptIn'] is True
          assert d['policy']['directCpoAndRoamingSeparate'] is True
          assert len(d['directOffers'])>=10 and len(e['subscriptionOffers'])>=3
          for row in d['directOffers']+d['subscriptionOffers']+e['subscriptionOffers']:
            assert row.get('operatorAliases') and isinstance(row.get('pricing'),dict),row

          assert len(b['directOffers'])==4 and len(b['subscriptionOffers'])==8
          assert b['policy']['subscriptionsOptIn'] is True
          assert b['policy']['networkBrandOnly'] is True
          assert b['policy']['connectedTimeBlocksPreservedExactly'] is True
          assert {z['selectionId'] for z in b['subscriptionOffers']}=={'belib-nonresident','belib-resident'}

          assert x['policy']['exactEvseRequired'] is True
          assert x['policy']['networkWideGeneralization'] is False
          assert x['policy']['wholesaleRatesExcluded'] is True
          assert len(x['directOffers'])==1 and x['directOffers'][0]['evseIds']==['FR*55C*EFR39000*P7PPFG*1']

          assert t['policy']['exactIdentityRequired'] is True
          assert t['policy']['networkWideGeneralization'] is False
          assert len(t['directOffers'])==3
          assert all(z.get('evseIds') or z.get('stationIds') for z in t['directOffers'])

          assert q['policy']['identityMode']=='physical_network_and_territory'
          assert q['policy']['territory']=='Rhône hors Métropole de Lyon'
          assert q['policy']['subscriptionsOptIn'] is True
          assert q['policy']['lowerPowerNightPostChargeExemptionPreserved'] is True
          assert len(q['directOffers'])==2 and len(q['subscriptionOffers'])==2
          low=[z for z in q['directOffers'] if z['maxPowerKw']==50][0]
          assert low['pricing']['postChargeFee']['exemptLocalWindows']==[{'start':'22:00','end':'07:00'}]

          assert u['schemaVersion']==4
          assert u['policy']['exactPdcRequired'] is True
          assert u['policy']['geographicFallbackAllowed'] is False
          assert u['policy']['tariffDataCannotCreatePhysicalStations'] is True
          assert u['policy']['sourceRankableRequired'] is True
          assert u['policy']['unsupportedTimeChangingTariffsFailClosed'] is True
          assert u['policy']['conditionalFeeConditionsSupported']==['energy_above_kwh']
          assert u['policy']['sessionDurationSurchargeSupported'] is True
          assert u['policy']['minimumTotalAppliedAfterAllSessionComponents'] is True
          assert u['summary']['exactBumpAliases']==1886
          assert len(u['directOffers'])==u['summary']['offers']
          assert all(z['verifiedScope']=='exact_evse' and len(z['evseIds'])==1 for z in u['directOffers'])
          exact_offer_ids={z['evseIds'][0] for z in u['directOffers']}
          assert len(exact_offer_ids)==len(u['directOffers'])<=u['summary']['exactBumpAliases']

          temporal=[z for z in u['directOffers'] if z.get('metadata',{}).get('timeChanging') is True]
          assert len(temporal)==u['summary']['temporalOffers']
          supported={
            'minimum_energy_post_charge_occupancy',
            'minimum_energy_conditional_flat_fee',
            'minimum_energy_session_duration_surcharge',
          }
          assert all(z['metadata'].get('semanticFamily') in supported for z in temporal)
          occupancy=[z for z in temporal if z['metadata']['semanticFamily']=='minimum_energy_post_charge_occupancy']
          conditional=[z for z in temporal if z['metadata']['semanticFamily']=='minimum_energy_conditional_flat_fee']
          duration=[z for z in temporal if z['metadata']['semanticFamily']=='minimum_energy_session_duration_surcharge']
          assert len(occupancy)==u['summary']['postChargeOccupancyOffers'] and occupancy
          assert len(conditional)==u['summary']['conditionalEnergyOffers'] and conditional
          assert len(duration)==u['summary']['sessionDurationSurchargeOffers'] and duration
          for z in conditional:
            fees=z['pricing'].get('conditionalSessionFees') or []
            assert len(fees)==1
            conditions=fees[0].get('conditions') or []
            assert conditions and all(c.get('kind')=='energy_above_kwh' for c in conditions)
          for z in duration:
            rule=z['pricing']['rules'][0]
            assert rule.get('connectedTimeFreeMinutes') is not None
            assert rule.get('connectedTimePerMinuteAfterFreeEur') is not None
          assert u['summary']['timeChangingSeen']==u['summary']['temporalOffers']+u['summary']['timeChangingDeferred']
          assert sum(1 for z in u['deferred'] if z.get('reason')=='unsupported_time_changing_rule_family')==u['summary']['timeChangingDeferred']

          deferred={z.get('id') for z in r.get('deferred',[])}
          for required in ('electra-essential','electra-smart','belib-nonresident','belib-resident'):
            assert required in deferred
          print(json.dumps({'generic':{k:r[k] for k in ('directOfferCount','directSubscriptionCount','emspSubscriptionCount','deferredCount')},'bump':u['summary']},indent=2))
          PY

      - name: Publish V9 offer overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf legacy-france-canonical data-lab
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v9/france-direct-offers.json data/v9/france-emsp-offers.json data/v9/france-belib-offers.json data/v9/france-e55c-offers.json data/v9/france-etotem-offers.json data/v9/france-qovoltis-offers.json data/v9/france-bump-offers.json data/v9/france-offer-compile-report.json
          if git diff --cached --quiet; then
            echo 'No offer changes'
            exit 0
          fi
          git commit -m "data(v9): refresh France offer overlays [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3; do
            git pull --rebase origin refactor/unified-data-engine-v9
            if git push origin HEAD:refactor/unified-data-engine-v9; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
