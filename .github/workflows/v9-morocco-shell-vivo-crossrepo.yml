name: V9 Morocco Shell Vivo cross-repo diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['feat/morocco-v9-resync-20260830b']
    paths:
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'tests/v9-morocco-shell-vivo-crossrepo.test.cjs'
      - '.github/workflows/v9-morocco-shell-vivo-crossrepo.yml'
  pull_request:
    paths:
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'tests/v9-morocco-shell-vivo-crossrepo.test.cjs'
      - '.github/workflows/v9-morocco-shell-vivo-crossrepo.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check assets/v9/adapters/morocco-nonproduction.js
          node --check tests/v9-morocco-shell-vivo-crossrepo.test.cjs
      - name: Validate public Shell Vivo evidence remains diagnostic-only in V9
        run: node tests/v9-morocco-shell-vivo-crossrepo.test.cjs
