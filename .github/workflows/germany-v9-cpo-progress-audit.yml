name: Germany V9 CPO progress audit

on:
  pull_request:
    paths:
      - 'data/v9/germany-operator-aliases*.json'
      - 'data/v9/germany-direct-offers*.json'
      - 'data/v9/germany-station-pricing*.json'
      - 'data/v9/germany-cpo-deferred-pricing.json'
      - 'scripts/audit_germany_cpo_progress_v9.py'
      - '.github/workflows/germany-v9-cpo-progress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Germany CPO treated vs total
        run: python scripts/audit_germany_cpo_progress_v9.py
