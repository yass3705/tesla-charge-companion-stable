name: Mise à jour des devises

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *" # after Data Lab's canonical FX collection

permissions:
  contents: write
  actions: write

concurrency:
  group: update-fx-main
  cancel-in-progress: false

jobs:
  update-fx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: main
          path: datalab
          sparse-checkout-cone-mode: false
          sparse-checkout: data/fx/exchange_rates.json
          persist-credentials: false

      - name: Vérifier le miroir et actualiser les taux validés
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_sync_fx_from_datalab.py
          python scripts/sync_fx_from_datalab.py \
            --source datalab/data/fx/exchange_rates.json \
            --data-dir data \
            --data-lab-sha "$(git -C datalab rev-parse HEAD)"

      - name: Vérifier le fichier généré
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/exchange_rates.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          required = {'base', 'date', 'providerDate', 'checkedAt', 'source', 'rates'}
          missing = required - data.keys()
          if missing:
              raise SystemExit(f"Champs manquants : {sorted(missing)}")
          for code in ('EUR', 'CHF', 'GBP', 'MAD'):
              value = data['rates'].get(code)
              if not isinstance(value, (int, float)) or value <= 0:
                  raise SystemExit(f"Taux invalide pour {code}: {value!r}")
          print(f"Validation OK — date source {data['date']} — vérifié {data['checkedAt']}")
          PY

      - name: Enregistrer les changements
        id: persist
        run: |
          set -euo pipefail
          git add data/exchange_rates.json data/metadata.json data/fx-datalab-provenance.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "tesla-charge-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Miroir des devises validées Data Lab"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publier le site historique après changement FX
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
