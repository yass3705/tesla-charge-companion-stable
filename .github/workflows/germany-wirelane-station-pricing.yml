name: Germany V9 Wirelane station pricing

on:
  pull_request:
    paths:
      - 'scripts/build_germany_wirelane_station_pricing_v9.py'
      - '.github/workflows/germany-wirelane-station-pricing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect representative Wirelane EVSE tariffs
        run: python scripts/build_germany_wirelane_station_pricing_v9.py --limit 25 --out build/wirelane.json
      - name: Validate collector output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/wirelane.json'))
          assert d['entryCount'] > 0
          assert all(x['operator']=='Wirelane' and x['pricePerKwh']>0 for x in d['entries'])
          print({'entryCount':d['entryCount'],'prices':sorted({x['pricePerKwh'] for x in d['entries']})})
          PY
