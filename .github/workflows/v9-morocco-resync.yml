name: V9 Morocco resync validation

on:
  workflow_dispatch:
  push:
    branches: ['feat/morocco-v9-consolidation-resync-20260830']
    paths:
      - 'assets/v9/adapters/morocco-public.js'
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'tests/v9-morocco-resync-smoke.test.cjs'
      - '.github/workflows/v9-morocco-resync.yml'
  pull_request:
    paths:
      - 'assets/v9/adapters/morocco-public.js'
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'tests/v9-morocco-resync-smoke.test.cjs'
      - '.github/workflows/v9-morocco-resync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check assets/v9/adapters/morocco-public.js
          node --check assets/v9/adapters/morocco-nonproduction.js
          node --check tests/v9-morocco-resync-smoke.test.cjs
      - name: Validate sanitized public Morocco datasets and source semantics
        run: node tests/v9-morocco-resync-smoke.test.cjs
