name: Rebuild France catalog after conservative dedup — one shot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rebuild-france-catalog-dedup-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-france-catalog-dedup-once
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1c64-81f4-ab6d-64fbee75af11/raw?se=2026-08-18T12%3A58%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=b612e70b-250a-506c-9afe-76741e0a8006&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T09%3A08%3A41Z&ske=2026-08-19T09%3A08%3A41Z&sks=b&skv=2026-02-06&sig=7huCyucB4YpLQgSp9rZgePIEXJKQfZVDzg2n%2B0lndR8%3D'
      EXPECTED_ZIP_SHA256: 'f8cef538e3ccf9a43b88bef54388fcee79e7398bc48b9607d7f499d268c078de'
      EXPECTED_DATA_SHA256: 'c23285db0e62b2c8dffb287fc7a087d6f34f77ebbc9f14e6efaf79ae08c94b65'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and revalidate canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/france-source
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/france-final.zip
          echo "$EXPECTED_ZIP_SHA256  /tmp/france-final.zip" | sha256sum -c -
          unzip -q /tmp/france-final.zip -d /tmp/france-source
          echo "$EXPECTED_DATA_SHA256  /tmp/france-source/france_non_tesla_final.json.gz" | sha256sum -c -

      - name: Collapse only strongly corroborated legacy Electra duplicates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collapse_france_legacy_electra_duplicates.mjs \
            /tmp/france-source/france_non_tesla_final.json.gz \
            /tmp/france-source/france_non_tesla_corrected.json.gz \
            /tmp/france-source/legacy-dedup-summary.json
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const summary=JSON.parse(fs.readFileSync('/tmp/france-source/legacy-dedup-summary.json','utf8'));
          if(summary.beforeStations!==43416)throw new Error(`Unexpected source count ${summary.beforeStations}`);
          if(summary.collapsedLegacyElectraOnlyStations!==696)throw new Error(`Unexpected collapsed count ${summary.collapsedLegacyElectraOnlyStations}`);
          if(summary.afterStations!==42720)throw new Error(`Unexpected corrected count ${summary.afterStations}`);
          const data=JSON.parse(zlib.gunzipSync(fs.readFileSync('/tmp/france-source/france_non_tesla_corrected.json.gz')));
          const token='FR*LDL*E00002027';
          const matches=data.stations.filter(s=>[...(s.evseIdentifiers?.electroverse||[]),...(s.evseIdentifiers?.electra||[])].includes(token));
          if(matches.length!==1)throw new Error(`Lidl Saint-Cyr EVSE still appears on ${matches.length} physical stations`);
          if(!matches[0].sourceIds?.electroverse||!(matches[0].sourceIds?.electra||[]).length)throw new Error('Lidl Saint-Cyr sources were not consolidated');
          console.log(`Dedup validated: ${summary.beforeStations} -> ${summary.afterStations}; Lidl Saint-Cyr = one physical station.`);
          NODE

      - name: Generalize runtime count guards and rebuild catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_france_runtime_catalog.mjs')
          s=p.read_text(encoding='utf-8')
          old="if(!Array.isArray(data.stations)||data.stations.length!==43416)throw new Error(`Unexpected station count ${data.stations?.length}`);"
          new="if(!Array.isArray(data.stations)||data.stations.length<40000)throw new Error(`Unexpected station count ${data.stations?.length}`);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Runtime builder station-count guard not found')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/france-catalog.js')
          s=p.read_text(encoding='utf-8')
          old="if(Number(m?.stationCount)!==43416)throw new Error(`Catalogue France incomplet (${m?.stationCount||0} stations)`);"
          new="if(Number(m?.stationCount)<40000)throw new Error(`Catalogue France incomplet (${m?.stationCount||0} stations)`);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('France loader station-count guard not found')
          p.write_text(s,encoding='utf-8')
          PY
          node --check scripts/build_france_runtime_catalog.mjs
          node --check assets/france-catalog.js
          node scripts/build_france_runtime_catalog.mjs \
            /tmp/france-source/france_non_tesla_corrected.json.gz \
            data/non_tesla_france

      - name: Validate runtime catalog and publish build 7309
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          correction=json.loads(Path('/tmp/france-source/legacy-dedup-summary.json').read_text(encoding='utf-8'))
          mp=Path('data/non_tesla_france/manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          if m.get('stationCount') != 42720: raise SystemExit(f"Runtime station count {m.get('stationCount')}")
          if m.get('tileCount') != 338: raise SystemExit(f"Runtime tile count {m.get('tileCount')}")
          if m.get('skippedWithoutCoordinates') != 0: raise SystemExit('Stations without coordinates detected')
          if int(m.get('configurationCount',0)) < 150000: raise SystemExit(f"Too few configurations: {m.get('configurationCount')}")
          m['integration']={
              'appBuild':'7309',
              'mode':'lazy-geographic-runtime',
              'customFranceCleanup':True,
              'teslaDatasetModified':False,
              'sourceArtifactRunId':32134067174,
              'parkingTimeRateFix':True,
              'legacyElectraOnlyDedup':{
                  'policy':'unique structured EVSE + <=100m + (<=15m or exact normalized address/name)',
                  'collapsedStations':correction['collapsedLegacyElectraOnlyStations'],
                  'targetStations':correction['targetElectroverseStations'],
                  'beforeStations':correction['beforeStations'],
                  'afterStations':correction['afterStations'],
              }
          }
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8').replace('7308','7309')
          p.write_text(html,encoding='utf-8')
          vp=Path('app-version.json')
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['build']='7309';v['updatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          grep -q 'assets/france-catalog.js?v=7309' index.html
          node - <<'NODE'
          const fs=require('fs');
          const custom=JSON.parse(fs.readFileSync('data/custom_stations.json','utf8'));
          if(custom.stations.length!==10)throw new Error(`custom_stations changed: ${custom.stations.length}`);
          const tesla=JSON.parse(fs.readFileSync('data/tesla_stations.json','utf8'));
          if(!Array.isArray(tesla)||tesla.length<100)throw new Error('Tesla dataset unexpected');
          const m=JSON.parse(fs.readFileSync('data/non_tesla_france/manifest.json','utf8'));
          console.log(`Final runtime: Tesla ${tesla.length} · custom ${custom.stations.length} · France non-Tesla ${m.stationCount} · configs ${m.configurationCount}`);
          NODE

      - name: Commit atomically and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rebuild-france-catalog-dedup-once.yml
          git add data/non_tesla_france assets/france-catalog.js scripts/build_france_runtime_catalog.mjs scripts/collapse_france_legacy_electra_duplicates.mjs index.html app-version.json
          git commit -m 'fix: consolidate legacy non-Tesla France duplicates'
          git push origin HEAD:main
