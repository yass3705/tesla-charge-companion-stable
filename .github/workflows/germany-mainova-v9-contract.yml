name: Germany V9 Mainova Shell discount contract

on:
  pull_request:
    paths:
      - 'data/v9/germany-mainova-shell-customer-discount.json'
      - 'data/v9/germany-operator-aliases.json'
      - 'scripts/test_germany_mainova_shell_discount_v9.py'
      - '.github/workflows/germany-mainova-v9-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Mainova Shell customer discount policy
        run: python scripts/test_germany_mainova_shell_discount_v9.py
