name: Audit Spain REVE tariff/status candidates

on:
  workflow_dispatch:
  push:
    branches: ["spain-reve-preintegration"]
    paths:
      - ".github/workflows/audit-spain-reve-tariff-status.yml"
      - "scripts/reve_es_tariff_status_audit.py"
      - "data/spain_reve/reve_locations_raw.json.gz"
      - "data/spain_reve/operator_aliases_es.json"

permissions:
  contents: write

concurrency:
  group: audit-spain-reve-tariff-status
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: spain-reve-preintegration

      - name: Build offline candidates
        run: python scripts/reve_es_tariff_status_audit.py

      - name: Commit audit report
        shell: bash
        run: |
          git add data/spain_reve/tariff_status_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(es): record REVE tariff/status candidates"
          git push

      - name: Enforce candidate gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/spain_reve/tariff_status_candidates.json').read_text())
          if not r.get('allRequiredOperatorsMatched'):
              missing=[x['canonical'] for x in r.get('requiredOperators',[]) if not x.get('matched')]
              raise SystemExit('Required CPO candidates missing: '+', '.join(missing))
          PY
