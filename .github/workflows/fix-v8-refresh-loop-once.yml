name: Fix V8 refresh loop — one shot

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-v8-refresh-loop-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8 branch
        uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Patch V8 build and update cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          # update.js: the stale CURRENT_BUILD=8002 caused an endless refresh
          p=Path('assets/update.js')
          s=p.read_text(encoding='utf-8')
          if "const CURRENT_BUILD='8002';" not in s and "const CURRENT_BUILD='8003';" not in s:
              raise SystemExit('Unexpected update.js CURRENT_BUILD')
          s=s.replace("const CURRENT_BUILD='8002';","const CURRENT_BUILD='8004';",1)
          s=s.replace("const CURRENT_BUILD='8003';","const CURRENT_BUILD='8004';",1)
          p.write_text(s,encoding='utf-8')

          # service worker: rotate cache and align shell URLs
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE = 'tcc-v8002-august';","const CACHE = 'tcc-v8004-august';",1)
          s=s.replace("const CACHE = 'tcc-v8003-august';","const CACHE = 'tcc-v8004-august';",1)
          for old in ['7305','8002','8003']:
              s=s.replace(f'?v={old}', '?v=8004')
          p.write_text(s,encoding='utf-8')

          # index: make every cache-busting asset consistent with the RC build
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('content="8003"','content="8004"')
          s=s.replace('content="8002"','content="8004"')
          for asset in ['style.css','update.js','app.js','dedupe.js','france-catalog.js','v8-offer-selection.js']:
              import re
              s=re.sub(rf'({re.escape(asset)}\?v=)(?:1|7305|8002|8003)',rf'\g<1>8004',s)
          p.write_text(s,encoding='utf-8')

          # published version must match update.js exactly
          p=Path('app-version.json')
          v=json.loads(p.read_text(encoding='utf-8'))
          v['build']='8004'
          v['version']='8.0 RC2 · Août 2026'
          v['updatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          node --check assets/update.js
          node --check service-worker.js
          grep -q "const CURRENT_BUILD='8004'" assets/update.js
          grep -q "tcc-v8004-august" service-worker.js
          grep -q 'meta name="tcc-build" content="8004"' index.html
          grep -q 'assets/update.js?v=8004' index.html
          grep -q 'assets/v8-offer-selection.js?v=8004' index.html
          test "$(node -p "require('./app-version.json').build")" = "8004"

      - name: Commit V8 build 8004
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/update.js service-worker.js index.html app-version.json
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'fix(v8): stop update refresh loop (build 8004)'
          git push origin HEAD:release/2026-08
