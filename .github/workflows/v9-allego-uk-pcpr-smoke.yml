name: TCC V9 Allego UK live source and tariff smoke
on:
  push:
    branches: [main]
    paths:
      - 'v9-production-runtime/assets/v9/adapters/uk-pcpr.js'
      - 'v9-production-runtime/assets/v9/browser-loaders.js'
      - 'v9-production-runtime/assets/v9/session-engine.js'
      - 'v9-production-runtime/assets/v9/runtime-engine.js'
      - 'v9-production-runtime/assets/v9/pricing-engine.js'
      - 'v9-production-runtime/data/v9/source-registry.json'
      - 'v9-production-shell/**'
      - 'tests/v9-allego-uk-pcpr-integration.test.cjs'
      - '.github/workflows/v9-allego-uk-pcpr-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check browser shell syntax and existing exact-EVSE/congestion regressions
        run: |
          node --check v9-production-shell/bridge.js
          node --check v9-production-runtime/assets/v9/session-engine.js
          node --check v9-production-runtime/assets/v9/runtime-engine.js
          node tests/v9-production-evse-offer-isolation.test.cjs
          node tests/v9-production-congestion-evse.test.cjs
      - name: Verify actual audited Allego UK feed, 240 connector prices, and V9 pricing
        run: node tests/v9-allego-uk-pcpr-integration.test.cjs
