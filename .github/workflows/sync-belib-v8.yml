name: Synchroniser Belib dans TCC V8

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-belib-v8
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer TCC
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Télécharger la base Belib vérifiée
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            --output /tmp/belib_stations_paris.json \
            https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/national/belib_stations_paris.json

      - name: Construire l’overlay compact V8
        run: node scripts/build_belib_v8_overlay.mjs /tmp/belib_stations_paris.json data/belib_station_tariffs_v1.json.gz

      - name: Valider le périmètre, les tarifs et le runtime
        run: |
          node scripts/test_belib_v8_overlay.mjs data/belib_station_tariffs_v1.json.gz
          node scripts/test_belib_v8_runtime.mjs
          node --check assets/france-catalog-v8.js
          node --check assets/v8-belib-pricing.js

      - name: Publier uniquement en cas de changement
        shell: bash
        run: |
          if git diff --quiet -- data/belib_station_tariffs_v1.json.gz; then
            echo "Aucun changement Belib à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/belib_station_tariffs_v1.json.gz
          git commit -m "data(belib): refresh V8 operated station overlay"
          git push origin HEAD:main
