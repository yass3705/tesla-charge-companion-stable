name: Republier la preview V8

on:
  push:
    branches:
      - release/2026-08
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la publication GitHub Pages depuis main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
