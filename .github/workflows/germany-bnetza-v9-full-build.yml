      - 'data/v9/germany-direct-offers.json'
      - 'data/v9/germany-direct-offers-aral-extension.json'
      - 'data/v9/germany-direct-offers-enbw-extension.json'
      - 'data/v9/germany-direct-offers-swu-extension.json'
      - 'data/v9/germany-direct-offers-westfalen-extension.json'
      - 'data/v9/germany-direct-offers-eam-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-luebeck-extension.json'
      - 'data/v9/germany-direct-offers-swlb-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-bochum-extension.json'
      - 'data/v9/germany-direct-offers-mark-e-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-wuerzburg-extension.json'
      - 'data/v9/germany-direct-offers-q1-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-goettingen-extension.json'
      - 'data/v9/germany-direct-offers-ovag-extension.json'
      - 'data/v9/germany-direct-offers-wemag-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-neuss-extension.json'
      - 'data/v9/germany-direct-offers-infra-fuerth-extension.json'
      - 'data/v9/germany-direct-offers-evo-extension.json'
      - 'data/v9/germany-direct-offers-ewv-extension.json'
      - 'data/v9/germany-direct-offers-ggew-extension.json'
      - 'data/v9/germany-direct-offers-ecowerk-extension.json'
      - 'data/v9/germany-direct-offers-autostrom-plus-extension.json'
      - 'data/v9/germany-direct-offers-stadtwerke-heidelberg-extension.json'
      - 'data/v9/germany-totalenergies-station-pricing.json'
      - '.github/workflows/germany-bnetza-v9-full-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and build official BNetzA catalogue
        run: |
          python scripts/build_germany_bnetza_v9_v4.py \
            --out build/germany-static \
            --crosswalk build/germany-crosswalk.json \
            --aliases data/v9/germany-operator-aliases.json
      - name: Validate national facility build
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          root=pathlib.Path('build/germany-static')
          m=json.loads((root/'manifest.json').read_text())
          assert m['country']=='DE'
          assert m['sourceRows'] > 50000, m
          assert m['stationCount'] > 50000, m
          assert m['stationCount'] >= m['sourceRows'] * 0.95, m
          assert m['evseCount'] >= m['stationCount'], m
          assert m['skippedRows'] <= m['sourceRows'] * 0.05, m
          rows=json.loads(gzip.decompress((root/'all.json.gz').read_bytes()))
          assert len(rows)==m['stationCount']
          assert all(46 <= r[3] <= 56 and 4 <= r[4] <= 16 for r in rows)
          ids=[str(r[0]) for r in rows]
          assert len(ids)==len(set(ids)), 'duplicate facility IDs detected'
          print(json.dumps({k:m[k] for k in ('sourceRows','stationCount','evseCount','skippedRows','syntheticIdCount','tileCount','allBytes')},indent=2))
          PY
      - name: Group facilities into user-facing sites
        run: |
          python scripts/group_germany_bnetza_v9_sites.py \
            --input-root build/germany-static \
            --input-crosswalk build/germany-crosswalk.json \
            --out build/germany-sites \
            --crosswalk build/germany-site-crosswalk.json
      - name: Validate grouped Germany site contract
        run: |
          python - <<'PY'
          import gzip,json,pathlib,re,unicodedata
          raw_root=pathlib.Path('build/germany-static')
          root=pathlib.Path('build/germany-sites')
          m=json.loads((root/'manifest.json').read_text())
          rows=json.loads(gzip.decompress((root/'all.json.gz').read_bytes()))
          raw_rows=json.loads(gzip.decompress((raw_root/'all.json.gz').read_bytes()))
          raw_by_id={str(r[0]):r for r in raw_rows}
          cw=json.loads(pathlib.Path('build/germany-site-crosswalk.json').read_text())
          norm=lambda v: re.sub(r'[^a-z0-9]+','_', ''.join(c for c in unicodedata.normalize('NFKD',str(v or '')) if not unicodedata.combining(c)).lower()).strip('_')
          assert m['country']=='DE'
          assert m['facilityCount'] > m['siteCount'] > 50000, m
          assert m['siteCount'] < m['facilityCount'] * 0.90, m
          assert m['evseCount'] >= m['siteCount'], m
          assert m['multiFacilitySiteCount'] > 5000, m
          assert 10 <= m['maxFacilitiesPerSite'] <= 300, 'unexpected mega-site: manual grouping review required'
          assert len(rows)==m['siteCount']==len(cw['entries'])
          ids=[str(r[0]) for r in rows]
          assert len(ids)==len(set(ids)), 'duplicate site IDs detected'
          assert sum(e['facilityCount'] for e in cw['entries'])==m['facilityCount']
          assert all(46 <= r[3] <= 56 and 4 <= r[4] <= 16 for r in rows)
          assert m.get('teslaExcludedFromRuntimeBaseline') is True, m
          assert m.get('excludedTeslaFacilityCount',0) > 0, m
          assert m['sourceFacilityCount'] == m['facilityCount'] + m['excludedTeslaFacilityCount'], m
          assert cw.get('teslaExcludedFromRuntimeBaseline') is True, cw
          assert not any(norm(r[5])=='tesla' for r in rows), 'Tesla site leaked into grouped runtime rows'
          assert not any(norm(e.get('operator'))=='tesla' for e in cw['entries']), 'Tesla site leaked into grouped crosswalk'
          assert not any(any(norm(raw)=='tesla' or norm(raw).startswith('tesla_') for raw in e.get('rawOperators',[])) for e in cw['entries']), 'Tesla raw operator leaked into grouped crosswalk'
          mega=[]
          for e in sorted(cw['entries'],key=lambda x:x['facilityCount'],reverse=True):
            if e['facilityCount'] < 50: break
            src=[raw_by_id[str(fid)] for fid in e['bnetzaIds']]
            assert len(src)==e['facilityCount'], f"missing raw facilities for {e['siteId']}"
            dims={(r[2],float(r[3]),float(r[4]),r[5]) for r in src}
            assert len(dims)==1, f"incoherent mega-site grouping for {e['siteId']}: {dims}"
            mega.append({'siteId':e['siteId'],'facilityCount':e['facilityCount'],'distinctNames':len({r[1] for r in src}),'operator':src[0][5],'address':src[0][2]})
          assert mega and mega[0]['facilityCount']==m['maxFacilitiesPerSite']
          print(json.dumps({'grouped':{k:m[k] for k in ('sourceFacilityCount','excludedTeslaFacilityCount','facilityCount','siteCount','evseCount','multiFacilitySiteCount','maxFacilitiesPerSite','tileCount','allBytes')},'megaSiteAudit':mega[:10]},indent=2,ensure_ascii=False))
          PY
      - name: Audit operator canonicalization coverage
        run: python scripts/audit_germany_operator_normalization_v9.py --min-coverage 0.51
      - name: Build effective Germany direct offers
        run: python scripts/build_germany_direct_offers_v9.py --out build/germany-direct-offers.json
      - name: Validate SWU direct offers
        run: python scripts/test_germany_swu_direct_offers_v9.py
      - name: Validate Westfalen direct offers
        run: python scripts/test_germany_westfalen_direct_offers_v9.py
      - name: Validate EAM direct offers
        run: python scripts/test_germany_eam_direct_offers_v9.py
      - name: Validate Stadtwerke Lübeck direct offers
        run: python scripts/test_germany_stadtwerke_luebeck_direct_offers_v9.py
      - name: Validate SWLB direct offers
        run: python scripts/test_germany_swlb_direct_offers_v9.py
      - name: Validate Stadtwerke Bochum direct offers
        run: python scripts/test_germany_stadtwerke_bochum_direct_offers_v9.py
      - name: Validate Mark-E direct offers
        run: python scripts/test_germany_mark_e_direct_offers_v9.py
      - name: Validate Stadtwerke Würzburg direct offers
        run: python scripts/test_germany_stadtwerke_wuerzburg_direct_offers_v9.py
      - name: Validate Q1 direct offers
        run: python scripts/test_germany_q1_direct_offers_v9.py
      - name: Validate Stadtwerke Göttingen direct offers
        run: python scripts/test_germany_stadtwerke_goettingen_direct_offers_v9.py
      - name: Validate OVAG direct offers
        run: python scripts/test_germany_ovag_direct_offers_v9.py
      - name: Validate WEMAG direct offers
        run: python scripts/test_germany_wemag_direct_offers_v9.py
      - name: Validate Stadtwerke Neuss direct offers
        run: python scripts/test_germany_stadtwerke_neuss_direct_offers_v9.py
      - name: Validate infra fürth direct offers
        run: python scripts/test_germany_infra_fuerth_direct_offers_v9.py
      - name: Validate evo Oberhausen direct offers
        run: python scripts/test_germany_evo_direct_offers_v9.py
      - name: Validate EWV direct offers
        run: python scripts/test_germany_ewv_direct_offers_v9.py
      - name: Validate GGEW direct offers
        run: python scripts/test_germany_ggew_direct_offers_v9.py
      - name: Validate ecowerk direct offers
        run: python scripts/test_germany_ecowerk_direct_offers_v9.py
      - name: Validate Autostrom plus direct offers
        run: python scripts/test_germany_autostrom_plus_direct_offers_v9.py
      - name: Validate Stadtwerke Heidelberg direct offers and parkhouse mapping
        run: python scripts/test_germany_stadtwerke_heidelberg_direct_offers_v9.py --sites build/germany-sites/all.json.gz
      - name: Audit real site-to-direct-offer linkage
        run: python scripts/audit_germany_direct_offer_site_linkage_v9.py --sites build/germany-sites/all.json.gz --offers build/germany-direct-offers.json
      - name: Validate TotalEnergies station-specific pricing
        run: python scripts/test_germany_totalenergies_station_pricing_v9.py
      - name: Probe TotalEnergies public Find a Charger resources
        run: python scripts/probe_totalenergies_charge_europe_public_endpoints.py
      - name: Validate public endpoint probe policy
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/totalenergies-public-endpoint-probe.json'))
          assert p['policy']['publicResourcesOnly'] is True
          assert p['policy']['candidateEndpointsNotInvoked'] is True
          assert p['policy']['noCredentialsOrSecrets'] is True
          assert p['policy']['noMobileAppReverseEngineering'] is True
          assert p['policy']['noOriginBlockBypassAttempted'] is True
          assert p['automationAssessment'] in ('server_probe_blocked','public_candidates_found','no_public_candidates_found')
          if p['automationAssessment']=='server_probe_blocked':
            assert p['blockedByOrigin'] in (401,403,429)
            assert p['candidateCount']==0
          print(json.dumps({'httpStatus':p['publicPageHttpStatus'],'assessment':p['automationAssessment'],'blockedByOrigin':p['blockedByOrigin'],'scriptCount':p['scriptCount'],'candidateCount':p['candidateCount'],'candidates':p['candidates'][:30]},indent=2))
          PY
      - name: Upload Germany V9 pre-integration dataset
        uses: actions/upload-artifact@v4
        with:
          name: germany-v9-bnetza-preintegration
          path: |
            build/germany-static/
            build/germany-crosswalk.json
            build/germany-sites/
            build/germany-site-crosswalk.json
            build/germany-direct-offers.json
            build/totalenergies-public-endpoint-probe.json
            data/v9/germany-totalenergies-station-pricing.json
            data/v9/germany-direct-offers-swu-extension.json
            data/v9/germany-direct-offers-westfalen-extension.json
            data/v9/germany-direct-offers-eam-extension.json
            data/v9/germany-direct-offers-stadtwerke-luebeck-extension.json
            data/v9/germany-direct-offers-swlb-extension.json
            data/v9/germany-direct-offers-stadtwerke-bochum-extension.json
            data/v9/germany-direct-offers-mark-e-extension.json
            data/v9/germany-direct-offers-stadtwerke-wuerzburg-extension.json
            data/v9/germany-direct-offers-q1-extension.json
            data/v9/germany-direct-offers-stadtwerke-goettingen-extension.json
            data/v9/germany-direct-offers-ovag-extension.json
            data/v9/germany-direct-offers-wemag-extension.json
            data/v9/germany-direct-offers-stadtwerke-neuss-extension.json
            data/v9/germany-direct-offers-infra-fuerth-extension.json
            data/v9/germany-direct-offers-evo-extension.json
            data/v9/germany-direct-offers-ewv-extension.json
            data/v9/germany-direct-offers-ggew-extension.json
            data/v9/germany-direct-offers-ecowerk-extension.json
            data/v9/germany-direct-offers-autostrom-plus-extension.json
            data/v9/germany-direct-offers-stadtwerke-heidelberg-extension.json
          retention-days: 7
