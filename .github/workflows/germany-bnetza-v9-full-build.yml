      - 'scripts/audit_germany_operator_normalization_v9.py'
      - 'scripts/audit_germany_direct_offer_site_linkage_v9.py'
      - 'scripts/test_germany_totalenergies_station_pricing_v9.py'
      - 'scripts/test_germany_swu_direct_offers_v9.py'
      - 'scripts/test_germany_westfalen_direct_offers_v9.py'
      - 'scripts/test_germany_eam_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_luebeck_direct_offers_v9.py'
      - 'scripts/test_germany_swlb_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_bochum_direct_offers_v9.py'
      - 'scripts/test_germany_mark_e_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_wuerzburg_direct_offers_v9.py'
      - 'scripts/test_germany_q1_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_goettingen_direct_offers_v9.py'
      - 'scripts/test_germany_ovag_direct_offers_v9.py'
      - 'scripts/test_germany_wemag_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_neuss_direct_offers_v9.py'
      - 'scripts/test_germany_infra_fuerth_direct_offers_v9.py'
      - 'scripts/test_germany_evo_direct_offers_v9.py'
      - 'scripts/test_germany_ewv_direct_offers_v9.py'
      - 'scripts/test_germany_ggew_direct_offers_v9.py'
      - 'scripts/test_germany_ecowerk_direct_offers_v9.py'
      - 'scripts/test_germany_autostrom_plus_direct_offers_v9.py'
      - 'scripts/test_germany_stadtwerke_heidelberg_direct_offers_v9.py'
      - 'scripts/probe_totalenergies_charge_europe_public_endpoints.py'
