name: Germany V9 full BNetzA build

on:
  pull_request:
    paths:
      - 'scripts/build_germany_bnetza_v9.py'
      - 'scripts/build_germany_bnetza_v9_v2.py'
      - 'scripts/build_germany_bnetza_v9_v3.py'
      - 'scripts/build_germany_bnetza_v9_v4.py'
      - 'scripts/group_germany_bnetza_v9_sites.py'
      - 'data/v9/germany-operator-aliases.json'
      - '.github/workflows/germany-bnetza-v9-full-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and build official BNetzA catalogue
        run: |
          python scripts/build_germany_bnetza_v9_v4.py \
            --out build/germany-static \
            --crosswalk build/germany-crosswalk.json \
            --aliases data/v9/germany-operator-aliases.json
      - name: Validate national facility build
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          root=pathlib.Path('build/germany-static')
          m=json.loads((root/'manifest.json').read_text())
          assert m['country']=='DE'
          assert m['sourceRows'] > 50000, m
          assert m['stationCount'] > 50000, m
          assert m['stationCount'] >= m['sourceRows'] * 0.95, m
          assert m['evseCount'] >= m['stationCount'], m
          assert m['skippedRows'] <= m['sourceRows'] * 0.05, m
          rows=json.loads(gzip.decompress((root/'all.json.gz').read_bytes()))
          assert len(rows)==m['stationCount']
          assert all(46 <= r[3] <= 56 and 4 <= r[4] <= 16 for r in rows)
          ids=[str(r[0]) for r in rows]
          assert len(ids)==len(set(ids)), 'duplicate facility IDs detected'
          print(json.dumps({k:m[k] for k in ('sourceRows','stationCount','evseCount','skippedRows','syntheticIdCount','tileCount','allBytes')},indent=2))
          PY
      - name: Group facilities into user-facing sites
        run: |
          python scripts/group_germany_bnetza_v9_sites.py \
            --input-root build/germany-static \
            --input-crosswalk build/germany-crosswalk.json \
            --out build/germany-sites \
            --crosswalk build/germany-site-crosswalk.json
      - name: Validate grouped Germany site contract
        run: |
          python - <<'PY'
          import gzip,json,pathlib,re,unicodedata
          root=pathlib.Path('build/germany-sites')
          m=json.loads((root/'manifest.json').read_text())
          rows=json.loads(gzip.decompress((root/'all.json.gz').read_bytes()))
          cw=json.loads(pathlib.Path('build/germany-site-crosswalk.json').read_text())
          norm=lambda v: re.sub(r'[^a-z0-9]+','_', ''.join(c for c in unicodedata.normalize('NFKD',str(v or '')) if not unicodedata.combining(c)).lower()).strip('_')
          assert m['country']=='DE'
          assert m['facilityCount'] > m['siteCount'] > 50000, m
          assert m['siteCount'] < m['facilityCount'] * 0.90, m
          assert m['evseCount'] >= m['siteCount'], m
          assert m['multiFacilitySiteCount'] > 5000, m
          assert m['maxFacilitiesPerSite'] >= 10, m
          assert len(rows)==m['siteCount']==len(cw['entries'])
          ids=[str(r[0]) for r in rows]
          assert len(ids)==len(set(ids)), 'duplicate site IDs detected'
          assert sum(e['facilityCount'] for e in cw['entries'])==m['facilityCount']
          assert all(46 <= r[3] <= 56 and 4 <= r[4] <= 16 for r in rows)
          # Tesla stays in the raw traceability layer but must never enter the non-Tesla runtime baseline.
          assert m.get('teslaExcludedFromRuntimeBaseline') is True, m
          assert m.get('excludedTeslaFacilityCount',0) > 0, m
          assert m['sourceFacilityCount'] == m['facilityCount'] + m['excludedTeslaFacilityCount'], m
          assert cw.get('teslaExcludedFromRuntimeBaseline') is True, cw
          assert not any(norm(r[5])=='tesla' for r in rows), 'Tesla site leaked into grouped runtime rows'
          assert not any(norm(e.get('operator'))=='tesla' for e in cw['entries']), 'Tesla site leaked into grouped crosswalk'
          assert not any(any(norm(raw)=='tesla' or norm(raw).startswith('tesla_') for raw in e.get('rawOperators',[])) for e in cw['entries']), 'Tesla raw operator leaked into grouped crosswalk'
          print(json.dumps({k:m[k] for k in ('sourceFacilityCount','excludedTeslaFacilityCount','facilityCount','siteCount','evseCount','multiFacilitySiteCount','maxFacilitiesPerSite','tileCount','allBytes')},indent=2))
          PY
      - name: Upload Germany V9 pre-integration dataset
        uses: actions/upload-artifact@v4
        with:
          name: germany-v9-bnetza-preintegration
          path: |
            build/germany-static/
            build/germany-crosswalk.json
            build/germany-sites/
            build/germany-site-crosswalk.json
          retention-days: 7
