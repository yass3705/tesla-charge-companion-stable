name: Harden IZIVIA runtime timer once
on:
  push:
    branches:
      - "feat/izivia-express-direct-v8"
    paths:
      - ".github/workflows/fix-izivia-runtime-timer-once.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timer initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/v8-izivia-express-direct-overlay.js')
          s=p.read_text()
          old="let tries=0;const timer=setInterval(()=>{tries++;if(install()||tries>160)clearInterval(timer);},100);"
          new="let tries=0,timer=null;timer=setInterval(()=>{tries++;if(install()||tries>160){if(timer!=null)clearInterval(timer);}},100);"
          if old not in s: raise SystemExit('timer target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v8-izivia-express-direct-overlay.js
          git commit -m 'Harden IZIVIA overlay timer initialization'
          git push
