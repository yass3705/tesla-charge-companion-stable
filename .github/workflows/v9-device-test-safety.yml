name: V9 controlled device test safety

on:
  pull_request:
    paths:
      - 'assets/v9/device-test-engine.js'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-generate-device-test-token.cjs'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - 'scripts/v9-validate-device-test-config.cjs'
      - 'tests/v9-device-test-lifecycle.test.cjs'
      - 'tests/v9-device-test-config-validator.test.cjs'
      - '.github/workflows/v9-device-test-safety.yml'
  push:
    branches: [main, refactor/unified-data-engine-v9]
    paths:
      - 'assets/v9/device-test-engine.js'
      - 'data/v9/device-test-policy.json'
      - 'data/v9/self-enrollment-config.json'
      - 'data/v9/access-readiness.json'
      - 'data/v9/rollout-config.json'
      - 'scripts/v9-generate-device-test-token.cjs'
      - 'scripts/v9-first-device-test-runbook.cjs'
      - 'scripts/v9-validate-device-test-config.cjs'
      - 'tests/v9-device-test-lifecycle.test.cjs'
      - 'tests/v9-device-test-config-validator.test.cjs'
      - '.github/workflows/v9-device-test-safety.yml'
  workflow_dispatch:

jobs:
  device-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/v9/device-test-engine.js
          node --check scripts/v9-generate-device-test-token.cjs
          node --check scripts/v9-first-device-test-runbook.cjs
          node --check scripts/v9-validate-device-test-config.cjs
          node --check tests/v9-device-test-lifecycle.test.cjs
      - name: Lifecycle contract
        run: node tests/v9-device-test-lifecycle.test.cjs
      - name: Repository access state invariant
        run: node scripts/v9-first-device-test-runbook.cjs
      - name: Fail-closed or controlled-window configuration
        run: node scripts/v9-validate-device-test-config.cjs
      - name: Configuration validator contract
        run: node tests/v9-device-test-config-validator.test.cjs
