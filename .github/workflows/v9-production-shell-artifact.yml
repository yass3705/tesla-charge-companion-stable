name: V9 production shell artifact

on:
  push:
    branches: ['refactor/unified-data-engine-v9']
    paths:
      - 'v9-production-shell/**'
      - 'ops/v9/production-shell-readiness.json'
      - 'tests/v9-production-routing-smoke.test.cjs'
      - 'tests/v9-production-engine-shell.test.cjs'
      - '.github/workflows/v9-production-shell-artifact.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v9-production-shell/**'
      - 'ops/v9/production-shell-readiness.json'
      - 'tests/v9-production-routing-smoke.test.cjs'
      - 'tests/v9-production-engine-shell.test.cjs'
      - '.github/workflows/v9-production-shell-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-production-shell-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: shellsrc
          fetch-depth: 0

      - name: Checkout observed V9 candidate
        uses: actions/checkout@v4
        with:
          ref: 8d2c20b7c76004389edd8f4a3b80d6b314900ba0
          path: candidate
          fetch-depth: 1

      - name: Checkout production control snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1

      - name: Assemble isolated stable-UI V9-engine artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '8d2c20b7c76004389edd8f4a3b80d6b314900ba0'
          grep -q '<meta name="tcc-build" content="7310">' site/index.html
          root_before="$(sha256sum site/index.html | awk '{print $1}')"

          rm -rf site/v9-production-shell site/v9-production-runtime
          mkdir -p site/v9-production-shell site/v9-production-runtime/assets/v9 site/v9-production-runtime/data/v9 site/v9-production-runtime/data/non_tesla_netherlands
          rsync -a --delete shellsrc/v9-production-shell/ site/v9-production-shell/
          rsync -a --delete candidate/assets/v9/ site/v9-production-runtime/assets/v9/
          rsync -a --delete candidate/data/v9/ site/v9-production-runtime/data/v9/

          cp candidate/data/tesla_stations.json site/v9-production-runtime/data/tesla_stations.json
          cp candidate/data/atlante_direct_stations_france.json.gz site/v9-production-runtime/data/atlante_direct_stations_france.json.gz
          cp candidate/data/powerdot_direct_france.json.gz site/v9-production-runtime/data/powerdot_direct_france.json.gz
          cp candidate/data/netherlands_direct_tariffs_v1.json site/v9-production-runtime/data/netherlands_direct_tariffs_v1.json
          rsync -a --delete candidate/data/non_tesla_netherlands/ site/v9-production-runtime/data/non_tesla_netherlands/

          root_after="$(sha256sum site/index.html | awk '{print $1}')"
          test "$root_before" = "$root_after"

      - name: Validate shell contract and pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check shellsrc/v9-production-shell/bridge.js
          (cd shellsrc && node tests/v9-production-engine-shell.test.cjs)
          node --check site/v9-production-runtime/assets/v9/runtime-engine.js
          node --check site/v9-production-runtime/assets/v9/browser-loaders.js
          grep -q '8d2c20b7c76004389edd8f4a3b80d6b314900ba0' site/v9-production-shell/shell-config.json
          grep -q 'sha256:455b371c14342a83d55fdfde0e3f2a63e7e3f967c2c84fb3fc31b6fe7bffd697' site/v9-production-shell/shell-config.json
          grep -q '"runtimeBase": "v9-production-runtime"' site/v9-production-shell/shell-config.json
          grep -q '"mode": "shadow"' site/v9-production-shell/shell-config.json
          grep -q "location.replace(CONTROL_FALLBACK)" site/v9-production-shell/index.html
          ! grep -q 'v9-app/app.js' site/v9-production-shell/index.html

      - name: Smoke deterministic 1 percent routing and fail-closed gates
        shell: bash
        env:
          V9_ROLLOUT_ENGINE: candidate/assets/v9/rollout-engine.js
        run: |
          set -euo pipefail
          node shellsrc/tests/v9-production-routing-smoke.test.cjs

      - name: Validate active local source dependencies for FR NL IT
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const runtime='site/v9-production-runtime';
          const registry=JSON.parse(fs.readFileSync(path.join(runtime,'data/v9/source-registry.json'),'utf8'));
          const scope=new Set(['FR','NL','IT']);
          const missing=[];
          for(const source of registry.sources||[]){
            if(source.active!==true)continue;
            const countries=source.countries||[];
            if(!countries.includes('*')&&!countries.some(c=>scope.has(c)))continue;
            if(source.adapter==='runtime-user-stations'||source.url||source.urls)continue;
            for(const key of ['path','manifest']){
              if(source[key]&&!fs.existsSync(path.join(runtime,source[key])))missing.push(`${source.id}:${source[key]}`);
            }
            if(source.root&&!fs.existsSync(path.join(runtime,source.root)))missing.push(`${source.id}:${source.root}`);
          }
          if(missing.length)throw new Error(`Missing production-shell dependencies: ${missing.join(', ')}`);
          console.log('PASS: all active local FR/NL/IT source dependencies are isolated inside the pinned runtime namespace.');
          NODE

      - name: Prove production root remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          cmp -s site/index.html <(git -C site show HEAD:index.html)
          test -s site/v9-production-shell/index.html
          test -s site/v9-production-shell/bridge.js
          test -s site/v9-production-runtime/assets/v9/runtime-engine.js
          test -s site/v9-production-runtime/data/v9/source-registry.json
          test ! -e site/assets/v9
          echo 'PASS: isolated shell/runtime artifact is complete; production root and production data namespace remain untouched.'

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: v9-production-shell-shadow-${{ github.sha }}
          path: |
            site/index.html
            site/v9-production-shell
            site/v9-production-runtime
          retention-days: 7

      - name: Smoke live Pages rollout state
        shell: bash
        env:
          BASE_URL: https://yass3705.github.io/tesla-charge-companion-stable
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$1" -o "$2"
          }

          fetch "$BASE_URL/" "$tmp/root.html"
          fetch "$BASE_URL/assets/update.js?v=7310" "$tmp/update.js"
          fetch "$BASE_URL/assets/v9-production-bootstrap.js?v=1" "$tmp/bootstrap.js"
          fetch "$BASE_URL/service-worker.js?v=7310" "$tmp/service-worker.js"
          fetch "$BASE_URL/v9-production-control.json" "$tmp/control.json"
          fetch "$BASE_URL/v9-production-shell/" "$tmp/shell.html"
          fetch "$BASE_URL/v9-production-shell/shell-config.json" "$tmp/shell-config.json"
          fetch "$BASE_URL/v9-production-shell/bridge.js" "$tmp/bridge.js"
          fetch "$BASE_URL/v9-production-runtime/assets/v9/rollout-engine.js" "$tmp/rollout-engine.js"
          fetch "$BASE_URL/v9-production-runtime/assets/v9/runtime-engine.js" "$tmp/runtime-engine.js"
          fetch "$BASE_URL/v9-production-runtime/assets/v9/browser-loaders.js" "$tmp/browser-loaders.js"
          fetch "$BASE_URL/v9-production-runtime/data/v9/source-registry.json" "$tmp/source-registry.json"

          grep -q '<meta name="tcc-build" content="7310">' "$tmp/root.html"
          grep -q 'assets/update.js?v=7310' "$tmp/root.html"
          grep -q "const CURRENT_BUILD=String(meta?.content||'').trim();" "$tmp/update.js"
          grep -q 'loadProductionCanaryBootstrap();' "$tmp/update.js"
          grep -q "workerUrl.searchParams.get('v')" "$tmp/service-worker.js"
          grep -q 'location.replace(CONTROL_FALLBACK)' "$tmp/shell.html"
          grep -q '8d2c20b7c76004389edd8f4a3b80d6b314900ba0' "$tmp/shell-config.json"
          grep -q 'sha256:455b371c14342a83d55fdfde0e3f2a63e7e3f967c2c84fb3fc31b6fe7bffd697' "$tmp/shell-config.json"
          grep -q '"runtimeBase": "v9-production-runtime"' "$tmp/shell-config.json"

          node --check "$tmp/update.js"
          node --check "$tmp/bootstrap.js"
          node --check "$tmp/service-worker.js"
          node --check "$tmp/bridge.js"
          node --check "$tmp/rollout-engine.js"
          node --check "$tmp/runtime-engine.js"
          node --check "$tmp/browser-loaders.js"

          node - "$tmp/control.json" "$tmp/shell-config.json" "$tmp/rollout-engine.js" <<'NODE'
          const fs=require('fs');
          const [controlPath,shellPath,enginePath]=process.argv.slice(2);
          const control=JSON.parse(fs.readFileSync(controlPath,'utf8'));
          const shell=JSON.parse(fs.readFileSync(shellPath,'utf8'));
          const Rollout=require(require('path').resolve(enginePath));
          const sha='8d2c20b7c76004389edd8f4a3b80d6b314900ba0';
          const fp='sha256:455b371c14342a83d55fdfde0e3f2a63e7e3f967c2c84fb3fc31b6fe7bffd697';
          if(control.active!==true||control.stage!=='canary'||control.canaryPercent!==1||control.killSwitch!==false)throw new Error('live control is not exact active 1% canary');
          if(control.readiness?.ready!==true||control.readiness?.verdict!=='READY')throw new Error('live readiness is not READY');
          if(control.observedCandidateSha!==sha||control.runtimeFingerprint!==fp)throw new Error('live control pin mismatch');
          if(shell.mode!=='candidate'||shell.observedCandidateSha!==sha||shell.runtimeFingerprint!==fp)throw new Error('live shell is not pinned candidate mode');
          if(shell.runtimeBase!=='v9-production-runtime'||shell.fallback!=='legacy-compare')throw new Error('live shell fallback/isolation mismatch');
          let v9=0;
          for(let i=0;i<10000;i++){
            const identity=`live-smoke-${i}`;
            const a=Rollout.decide({config:control,identity,readiness:control.readiness});
            const b=Rollout.decide({config:control,identity,readiness:control.readiness});
            if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('non-deterministic live cohort');
            if(a.engine==='v9')v9++;
          }
          const percent=v9/100;
          if(percent<0.8||percent>1.2)throw new Error(`live 1% distribution outside tolerance: ${percent}%`);
          console.log(JSON.stringify({ok:true,live:true,canaryPercent:control.canaryPercent,sample:10000,v9,percent,shellMode:shell.mode},null,2));
          NODE

          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!Array.isArray(x.sources)||!x.sources.length) process.exit(1); console.log('live registry sources',x.sources.length)" "$tmp/source-registry.json"
          echo 'PASS: live Pages serves the guarded active 1% V9 canary behind the stable V7.3 UI.'
