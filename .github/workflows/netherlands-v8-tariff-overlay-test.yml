name: Netherlands V8 tariff overlay QA

on:
  push:
    branches:
      - feat/netherlands-v8-tariffs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check assets/v8-netherlands-tariffs.js
          node --check assets/netherlands-refresh.js
          python -m json.tool data/netherlands_direct_tariffs_v1.json >/dev/null
      - name: Runtime and pricing QA
        run: node scripts/test_netherlands_v8_tariffs.cjs
