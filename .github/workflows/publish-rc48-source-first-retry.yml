name: Publish V8 RC4.8 source-first — retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc48-source-first-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/2026-08
          path: release
          fetch-depth: 0

      - name: Patch release source-first pricing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('release/assets/august-release.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('  function tariffLabel(st,time){')
          end=s.find('  function congestionInfo(',start)
          if start < 0 or end < 0:
              raise SystemExit(f'tariffLabel boundaries missing: {start=} {end=}')
          replacement="""  function tariffLabel(st,time){
    // Source-first: use the exact pricing object carried by this simulated configuration.
    let rules=legacyPricingToRules(st.pricing),rule=ruleForMinute(rules,mins(time));
    if(!rule)return'Tarif non disponible';
    let c=(rule.currency||'EUR').toUpperCase(),parts=[];
    const fmt=(v,d=3)=>Number(v||0).toFixed(d).replace(/0+$/,'').replace(/\\.$/,'');
    if(Number(rule.pricePerKwh||0)>0)parts.push(`${fmt(rule.pricePerKwh)} ${c}/kWh`);
    if(Number(rule.chargePerMinute||0)>0)parts.push(`${fmt(rule.chargePerMinute)} ${c}/min`);
    if(Number(rule.connectionFee||0)>0)parts.push(`${fmt(rule.connectionFee,2)} ${c} fixe`);
    if(Number(rule.idlePerMinute||0)>0)parts.push(`${fmt(rule.idlePerMinute)} ${c}/min occupation`);
    if(Number(rule.afterMinutesRate||0)>0&&Number(rule.afterMinutesThreshold||0)>0)parts.push(`${fmt(rule.afterMinutesRate)} ${c}/min après ${Math.round(rule.afterMinutesThreshold)} min`);
    if(rule.billing==='powerMinute'&&!parts.length)parts.push(`tarif/min selon puissance (${c})`);
    if(rule.scope==='timeWindow'&&(rule.start||rule.end))parts.push(`créneau ${rule.start||'00:00'}–${rule.end||'24:00'}`);
    return parts.length?parts.join(' + '):'Tarif variable';
  }
"""
          s=s[:start]+replacement+s[end:]

          old="""      let breakdown=r.pricingDetails&&(r.pricingDetails.connection||r.pricingDetails.idleCost||r.pricingDetails.durationSurcharge||r.pricingDetails.congestionCost)?`<div class=\"small cost-breakdown\">Fixe/parking : ${(r.pricingDetails.connection||0).toFixed(2)} € · Après charge : ${(r.pricingDetails.idleCost||0).toFixed(2)} € · Après durée : ${(r.pricingDetails.durationSurcharge||0).toFixed(2)} € · Congestion ≥${r.congestion?.threshold??80}% : ${(r.pricingDetails.congestionCost||0).toFixed(2)} €</div>`:'';"""
          new="""      let breakdown=r.pricingDetails&&(r.pricingDetails.connection||r.pricingDetails.timeChargeCost||r.pricingDetails.idleCost||r.pricingDetails.durationSurcharge||r.pricingDetails.congestionCost)?`<div class=\"small cost-breakdown\"><b>Détail tarifaire</b> · Durée pendant charge : ${(r.pricingDetails.timeChargeCost||0).toFixed(2)} € · Fixe : ${(r.pricingDetails.connection||0).toFixed(2)} € · Occupation/après charge : ${(r.pricingDetails.idleCost||0).toFixed(2)} € · Après durée : ${(r.pricingDetails.durationSurcharge||0).toFixed(2)} € · Congestion ≥${r.congestion?.threshold??80}% : ${(r.pricingDetails.congestionCost||0).toFixed(2)} €</div>`:'';"""
          if old not in s and 'Durée pendant charge' not in s:
              raise SystemExit('pricing breakdown marker missing')
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Keep the combined kWh+minute correction, but remove all DOM rematching.
          p=Path('release/assets/v8-combined-tariff-fix.js')
          p.write_text("""// Tesla Charge Companion V8 — correction calcul kWh + durée, sans rematching DOM.\n(function(){\n  'use strict';\n  function install(){\n    const original=window.priceWithRules;\n    if(typeof original!=='function'||original.__tccCombinedTariffFix)return false;\n    const wrapped=function(pp,startMin,chargeMinutes,billedEnergy,unplugTime,startTime,powerSegments=[]){\n      const out=original.call(this,pp,startMin,chargeMinutes,billedEnergy,unplugTime,startTime,powerSegments);\n      if(!out||out.error||!Number.isFinite(out.total))return out;\n      let extra=0;\n      try{\n        const rules=pp?.rules||[];\n        for(let i=0;i<Math.ceil(chargeMinutes);i++){\n          const fraction=Math.min(1,chargeMinutes-i);\n          const minute=typeof window.minuteOfSession==='function'?window.minuteOfSession(startMin,i):(startMin+i)%1440;\n          const rule=typeof window.ruleForMinute==='function'?window.ruleForMinute(rules,minute):null;\n          if(!rule||rule.billing!=='kwh')continue;\n          const rate=Number(rule.chargePerMinute||0);\n          if(!(rate>0))continue;\n          const raw=fraction*rate;\n          extra+=typeof window.fxToEur==='function'?window.fxToEur(raw,rule.currency||'EUR'):raw;\n        }\n      }catch(err){console.warn('[TCC V8] minute fee:',err);return out;}\n      if(extra>0){out.total+=extra;out.chargeCost=Number(out.chargeCost||0)+extra;out.timeChargeCost=Number(out.timeChargeCost||0)+extra;}\n      return out;\n    };\n    wrapped.__tccCombinedTariffFix=true;\n    wrapped.__tccOriginal=original;\n    window.priceWithRules=wrapped;try{priceWithRules=wrapped}catch(e){}\n    return true;\n  }\n  let n=0;const timer=setInterval(()=>{n++;if(install()||n>180)clearInterval(timer);},100);\n  console.info('[TCC V8] Calcul kWh + durée activé sans rematching DOM.');\n})();\n""",encoding='utf-8')
          PY

          node --check release/assets/august-release.js
          node --check release/assets/v8-combined-tariff-fix.js
          grep -q 'Source-first' release/assets/august-release.js
          grep -q 'Durée pendant charge' release/assets/august-release.js
          if grep -q 'findVariant' release/assets/v8-combined-tariff-fix.js; then exit 1; fi

      - name: Commit release changes
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/august-release.js assets/v8-combined-tariff-fix.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(v8): source-first tariff display without DOM rematch'
            git push origin HEAD:release/2026-08
          fi

      - name: Switch Pages publisher to RC4.8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('main/.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('RC4.7','RC4.8').replace('rc47-20260818','rc48-20260818').replace('v=rc47','v=rc48')
          s=s.replace(",'v8-tariff-display-fix'",'')
          lines=[]
          for line in s.splitlines():
              if 'v8-tariff-display-fix.js' in line: continue
              lines.append(line)
          s='\n'.join(lines)+'\n'
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'V8 Preview · RC4.8' main/.github/workflows/pages.yml
          grep -q 'v8-combined-tariff-fix.js?v=rc48-20260818' main/.github/workflows/pages.yml
          if grep -q 'v8-tariff-display-fix.js' main/.github/workflows/pages.yml; then exit 1; fi

      - name: Commit Pages RC4.8 and clean one-shots
        shell: bash
        working-directory: main
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-rc48-once.yml .github/workflows/v8-source-first-pass-once.yml .github/workflows/v8-source-tariffs-direct-once.yml .github/workflows/fix-v8-combined-kwh-minute-once.yml .github/workflows/publish-rc48-source-first-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'feat(pages): publish V8 RC4.8 source-first pricing'
          git push origin HEAD:main
