name: V8 Révéo Direct

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/2026-08
    paths:
      - "assets/v8-reveo-direct.js"
      - "assets/v8-rc48bn-runtime-hotfix.js"
      - "data/reveo_direct_tariffs_france_v1.json"
      - "scripts/test_reveo_direct_v8.mjs"
      - ".github/workflows/v8-reveo-direct.yml"
  push:
    branches:
      - feat/reveo-direct-v8-20260826
      - release/2026-08
    paths:
      - "assets/v8-reveo-direct.js"
      - "assets/v8-rc48bn-runtime-hotfix.js"
      - "data/reveo_direct_tariffs_france_v1.json"
      - "scripts/test_reveo_direct_v8.mjs"
      - ".github/workflows/v8-reveo-direct.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and matrix checks
        run: |
          node --check assets/v8-reveo-direct.js
          node --check assets/v8-rc48bn-runtime-hotfix.js
          node -e "const d=JSON.parse(require('fs').readFileSync('data/reveo_direct_tariffs_france_v1.json','utf8')); const expected=['S34','D09','D11','S12','D30','D46','S48','D65','D81']; if(JSON.stringify(d.scope.rankableTerritories)!==JSON.stringify(expected)) process.exit(1); if(JSON.stringify(d.scope.rankableSubscriberTerritories)!=='[\"S34\"]') process.exit(1); if(d.scope.roamingTariffsPromotedToDirect!==false) process.exit(1)"
      - name: Révéo direct regression tests
        run: node scripts/test_reveo_direct_v8.mjs
      - name: Existing subscription ranking regression
        run: node scripts/test_v8_subscription_ranking.mjs
      - name: Release wiring
        run: |
          grep -q "v8-reveo-direct.js?v=reveo-direct-v2-20260901" assets/v8-rc48bn-runtime-hotfix.js
          grep -q "loadReveoDirect" assets/v8-rc48bn-runtime-hotfix.js
          grep -q "territoires publics vérifiés calculables" assets/v8-reveo-direct.js
