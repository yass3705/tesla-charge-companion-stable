name: V8 Révéo Direct

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/v8-reveo-direct.js"
      - "assets/v8-rc48bn-runtime-hotfix.js"
      - "data/reveo_direct_tariffs_france_v1.json"
      - "scripts/test_reveo_direct_v8.mjs"
      - ".github/workflows/v8-reveo-direct.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check assets/v8-reveo-direct.js
          node --check assets/v8-rc48bn-runtime-hotfix.js
          node -e "JSON.parse(require('fs').readFileSync('data/reveo_direct_tariffs_france_v1.json','utf8'))"
      - name: Révéo direct regression tests
        run: node scripts/test_reveo_direct_v8.mjs
      - name: Existing subscription ranking regression
        run: node scripts/test_v8_subscription_ranking.mjs
