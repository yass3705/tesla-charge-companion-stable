name: Audit France GPSEO canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/gpseo_direct_tariffs_v1.json'
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'scripts/materialize_france_gpseo_offers.py'
      - 'scripts/test_gpseo_materializer.py'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-gpseo-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpseo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate GPSEO source and materializer
        run: |
          python -m py_compile scripts/materialize_france_gpseo_offers.py scripts/test_gpseo_materializer.py
          python scripts/test_gpseo_materializer.py
          python - <<'PY'
          import json
          d=json.load(open('data/gpseo_direct_tariffs_v1.json',encoding='utf-8'))
          assert d['networkId']=='gpseo' and d['country']=='FR'
          assert d['scope']['canonicalUmbrellaTariffNetworkId']=='alize-liberte'
          assert d['scope']['requiresExactPanContractingAuthority'] is True
          assert d['contactlessBankCardReference']['rankable'] is False
          assert d['contactlessBankCardReference']['pricePerKwh']==0.50
          PY
      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json
      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84013/download' --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 'https://transport.data.gouv.fr/resources/84098/download' --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv
      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py --static-csv .tmp/irve/static.csv --dynamic-csv .tmp/irve/dynamic.csv --registry data/france_irve_operator_registry_v1.json --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py --canonical-dir build/france_irve --operator-registry data/france_irve_operator_registry_v1.json --network-registry build/france_irve/effective_tariff_network_registry.json --out-dir build/france_irve_identity
      - name: Materialize GPSEO direct scope
        run: |
          python scripts/materialize_france_gpseo_offers.py --source data/gpseo_direct_tariffs_v1.json --canonical-dir build/france_irve_identity --static-csv .tmp/irve/static.csv --out-dir build/france_irve_offers
      - name: Validate GPSEO canonical coverage
        run: |
          python - <<'PY'
          import gzip,json
          r=json.load(open('build/france_irve_offers/gpseo_materialization_report.json',encoding='utf-8'));s=r['summary']
          assert 300 <= s['eligiblePdcCount'] <= 350,s
          assert 140 <= s['eligibleStationCount'] <= 180,s
          assert s['rankableCoveredPdcCount'] >= 300,s
          assert s['rankableCoveredPdcCount']/s['eligiblePdcCount'] >= 0.95,s
          assert s['unresolvedPdcCount'] <= 20,s
          assert s['physicalInventoryMutationCount']==0
          with gzip.open('build/france_irve_offers/gpseo_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as f: offers=json.load(f)
          rank=[o for o in offers if o['rankable']];refs=[o for o in offers if not o['rankable']]
          assert len(rank)==s['rankableOfferCount']==s['rankableCoveredPdcCount']
          assert len(refs)==s['referenceOfferCount']==s['rankableCoveredPdcCount']
          assert all(o['tariffNetworkId']=='gpseo' for o in offers)
          assert all(o['physicalOperatorId']=='bouygues-energies-services' for o in offers)
          assert all(o['selectors']['umbrellaTariffNetworkId']=='alize-liberte' for o in offers)
          assert all(o['subscriptionId'] is None for o in rank)
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Upload GPSEO audit
        uses: actions/upload-artifact@v4
        with:
          name: france-gpseo-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/gpseo_materialization_report.json
            build/france_irve_offers/gpseo_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
