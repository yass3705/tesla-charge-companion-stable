name: V9 sync Italy with Ewiva

on:
  workflow_dispatch:
  push:
    branches: [feature/v9-ewiva-italy]
    paths:
      - scripts/v9_enrich_italy_ewiva_offers.py
      - tests/v9-ewiva-italy-runtime.test.cjs
      - tests/v9-italy-runtime-smoke.test.cjs
      - data/v9/source-registry.json
      - .github/workflows/v9-sync-italy-ewiva.yml

permissions:
  contents: write
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_REPO: yass3705/tesla-charge-companion-data-lab
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download canonical Italy V9 Enel + Ewiva candidate
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$DATA_REPO" --workflow italy-v9-enel-overlay.yml --branch research/italy-consolidation-v9-a2a --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p /tmp/italy
          gh run download "$RUN_ID" --repo "$DATA_REPO" -n italy-v9-enel-overlay-candidate -D /tmp/italy
          INPUT="$(find /tmp/italy -type f -name italy_v9_candidate.json.gz | head -n1)"
          test -n "$INPUT" && test -s "$INPUT"
          cp "$INPUT" /tmp/italy_v9_candidate.json.gz
          echo "Using canonical Italy run $RUN_ID"
      - name: Build baseline Italy catalogue and offers
        run: python scripts/v9_build_italy_catalog.py --input /tmp/italy_v9_candidate.json.gz
      - name: Enrich Enel X Way offers
        run: python scripts/v9_enrich_italy_enel_offers.py --input /tmp/italy_v9_candidate.json.gz
      - name: Enrich Ewiva commercial offers
        run: python scripts/v9_enrich_italy_ewiva_offers.py --input /tmp/italy_v9_candidate.json.gz
      - name: Validate publication semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/v9/italy-offers.json').read_text()); r=json.loads(Path('data/v9/italy-build-report.json').read_text())
          assert r['directOffers']==48409
          assert r['ewivaEnelEmspOffers']>1700
          assert r['ewivaPlugAndGoSuperOffers']==r['ewivaEnelEmspOffers']
          assert r['ewivaPlugAndGoExplorerOffers']==r['ewivaEnelEmspOffers']
          assert r['emspOffers']==2281+r['ewivaEnelEmspOffers']
          assert r['subscriptionOffers']==48330+2*r['ewivaEnelEmspOffers']
          e=[x for x in o['emspOffers'] if x.get('metadata',{}).get('network')=='Ewiva' and x.get('provider')=='Enel On Your Way']
          s=[x for x in o['subscriptionOffers'] if x.get('metadata',{}).get('network')=='Ewiva' and x.get('selectionId')=='enel_plug_and_go_super']
          x=[x for x in o['subscriptionOffers'] if x.get('metadata',{}).get('network')=='Ewiva' and x.get('selectionId')=='enel_plug_and_go_explorer']
          assert len(e)==len(s)==len(x)==r['ewivaEnelEmspOffers']
          assert all(v.get('metadata',{}).get('rankableAsCpoDirect') is False for v in e)
          assert not any(v.get('provider')=='Ewiva' for v in o['directOffers'])
          print(json.dumps(r,indent=2))
          PY
      - name: Test Enel session-start pricing
        run: node tests/v9-enel-session-start-pricing.test.cjs
      - name: Test Italy runtime
        run: node tests/v9-italy-runtime-smoke.test.cjs
      - name: Test Ewiva runtime
        run: node tests/v9-ewiva-italy-runtime.test.cjs
      - name: Publish generated Italy V9 data on Ewiva branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v9/italy-static data/v9/italy-offers.json data/v9/italy-build-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(v9): publish Italy catalogue with Ewiva Enel offers'
          git push origin "HEAD:${GITHUB_REF_NAME}"
