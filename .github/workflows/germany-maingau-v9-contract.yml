name: Germany V9 MAINGAU direct-offer contract

on:
  pull_request:
    paths:
      - 'data/v9/germany-direct-offers-maingau-extension.json'
      - 'data/v9/germany-cross-border-subscriptions.json'
      - 'scripts/build_germany_direct_offers_v9.py'
      - 'scripts/test_germany_direct_offers_v9.py'
      - 'scripts/test_germany_maingau_direct_offers_v9.py'
      - 'scripts/audit_germany_direct_offer_site_linkage_v9.py'
      - '.github/workflows/germany-maingau-v9-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build consolidated Germany direct offers
        run: python scripts/build_germany_direct_offers_v9.py
      - name: Validate consolidated direct-offer schema
        run: python scripts/test_germany_direct_offers_v9.py build/germany-direct-offers.json
      - name: Validate MAINGAU tariff semantics
        run: python scripts/test_germany_maingau_direct_offers_v9.py
      - name: Validate cross-border defer policy
        run: python scripts/test_germany_cross_border_subscriptions_v9.py
