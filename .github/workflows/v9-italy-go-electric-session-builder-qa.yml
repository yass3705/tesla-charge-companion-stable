name: V9 Italy Go Electric overlay publication readiness QA

on:
  workflow_dispatch:
  push:
    branches:
      - qa/v9-italy-go-electric-session-builder-publication-readiness
    paths:
      - scripts/v9_overlay_go_electric_italy.py
      - .github/workflows/v9-italy-go-electric-session-builder-qa.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v9-italy-go-electric-overlay-publication-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated session-ready Italy candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/italy-input
          gh run download 33495379759 \
            --repo yass3705/tesla-charge-companion-data-lab \
            --name go-electric-italy-v9-session-activation-qa \
            --dir /tmp/italy-input
          test -n "$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          test -s data/v9/italy-offers.json

      - name: Build validated Go Electric candidate with merged production builder
        run: |
          set -euo pipefail
          INPUT="$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          mkdir -p /tmp/italy-overlay/static
          python scripts/v9_build_italy_catalog.py \
            --input "$INPUT" \
            --out-root /tmp/italy-overlay/static \
            --offers /tmp/italy-overlay/candidate-offers.json \
            --report /tmp/italy-overlay/candidate-build-report.json

      - name: Build fail-closed overlay on currently served runtime
        run: |
          set -euo pipefail
          INPUT="$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          python scripts/v9_overlay_go_electric_italy.py \
            --baseline data/v9/italy-offers.json \
            --candidate-offers /tmp/italy-overlay/candidate-offers.json \
            --candidate-source "$INPUT" \
            --out /tmp/italy-overlay/italy-offers-overlay.json \
            --report /tmp/italy-overlay/italy-overlay-readiness.json

      - name: Re-test all 127 Go Electric session offers in final overlay
        run: |
          node <<'NODE'
          const fs = require('fs');
          const engine = require('./assets/v9/pricing-engine.js');
          const p = JSON.parse(fs.readFileSync('/tmp/italy-overlay/italy-offers-overlay.json','utf8'));
          const offers = p.directOffers.filter(o => o.provider === 'Go Electric Stations SRLS' && o.pricing?.type === 'rules');
          const failures = [];
          for (const offer of offers) {
            const rules = offer.pricing?.rules || [];
            if (rules.length !== 1) {
              failures.push({id:offer.id,reason:'rule_count'});
              continue;
            }
            const rule = rules[0];
            const session = {energyKwh:10,durationMinutes:30,chargingMinutes:30,startAt:'2026-09-01T10:00:00+02:00',timeZone:'Europe/Rome'};
            const got = engine.evaluateOffer(offer, session);
            const expected = Math.round((10*Number(rule.pricePerKwh)+Number(rule.sessionFeeEur)+Number.EPSILON)*1e6)/1e6;
            if (got.complete !== true || Math.abs(Number(got.totalEur)-expected)>1e-6 || Math.abs(Number(got.components?.sessionFee)-Number(rule.sessionFeeEur))>1e-6) {
              failures.push({id:offer.id,got,expected});
            }
          }
          const r={publicationAllowed:false,tested:offers.length,passed:offers.length-failures.length,failed:failures.length,gates:{all127Complete:offers.length===127&&failures.length===0,sessionFeeIncluded:failures.length===0,publicationDisabled:p.publicationAllowed===false}};
          fs.writeFileSync('/tmp/italy-overlay/italy-overlay-engine-qa.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify(r,null,2));
          if (!Object.values(r.gates).every(Boolean)) process.exit(1);
          NODE

      - name: Verify overlay preserves served runtime outside exact Go Electric changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline=json.loads(Path('data/v9/italy-offers.json').read_text())
          overlay=json.loads(Path('/tmp/italy-overlay/italy-offers-overlay.json').read_text())
          report=json.loads(Path('/tmp/italy-overlay/italy-overlay-readiness.json').read_text())
          GE='Go Electric Stations SRLS'

          bd=[x for x in baseline.get('directOffers',[]) if x.get('provider') != GE]
          od=[x for x in overlay.get('directOffers',[]) if x.get('provider') != GE]
          assert bd == od
          assert baseline.get('subscriptionOffers',[]) == overlay.get('subscriptionOffers',[])
          assert len(overlay.get('directOffers',[])) == 49352
          assert len(overlay.get('subscriptionOffers',[])) == 50008
          assert len(overlay.get('emspOffers',[])) == 1678
          assert all(report['gates'].values()), report
          assert overlay.get('publicationAllowed') is False
          print(json.dumps({'publicationAllowed':False,'direct':49352,'subscriptions':50008,'emsp':1678,'goElectricDirect':943,'legacyEmspRemoved':2281,'allGates':True},indent=2))
          PY

      - name: Upload overlay readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-italy-go-electric-overlay-publication-readiness
          path: |
            /tmp/italy-overlay/candidate-build-report.json
            /tmp/italy-overlay/italy-overlay-readiness.json
            /tmp/italy-overlay/italy-overlay-engine-qa.json
          retention-days: 14
