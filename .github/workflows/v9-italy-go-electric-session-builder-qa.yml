name: V9 Italy Go Electric publication readiness QA

on:
  workflow_dispatch:
  push:
    branches:
      - qa/v9-italy-go-electric-session-builder-publication-readiness
    paths:
      - .github/workflows/v9-italy-go-electric-session-builder-qa.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v9-italy-go-electric-publication-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-candidate-to-served-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated session-ready Italy candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/italy-input
          gh run download 33495379759 \
            --repo yass3705/tesla-charge-companion-data-lab \
            --name go-electric-italy-v9-session-activation-qa \
            --dir /tmp/italy-input
          test -n "$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          test -s data/v9/italy-offers.json

      - name: Build candidate with merged production builder
        run: |
          set -euo pipefail
          INPUT="$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          mkdir -p /tmp/italy-candidate/static
          python scripts/v9_build_italy_catalog.py \
            --input "$INPUT" \
            --out-root /tmp/italy-candidate/static \
            --offers /tmp/italy-candidate/italy-offers.json \
            --report /tmp/italy-candidate/italy-build-report.json

      - name: Compare candidate with currently served Italy runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          GE = 'Go Electric Stations SRLS'
          baseline = json.loads(Path('data/v9/italy-offers.json').read_text())
          candidate = json.loads(Path('/tmp/italy-candidate/italy-offers.json').read_text())
          build = json.loads(Path('/tmp/italy-candidate/italy-build-report.json').read_text())

          def by_id(rows):
              return {str(x.get('id')): x for x in rows}
          def non_ge(rows):
              return [x for x in rows if x.get('provider') != GE]
          def changed(a, b, ids):
              return [i for i in ids if a[i] != b[i]]

          bd = by_id(baseline.get('directOffers') or [])
          cd = by_id(candidate.get('directOffers') or [])
          bnd = by_id(non_ge(baseline.get('directOffers') or []))
          cnd = by_id(non_ge(candidate.get('directOffers') or []))
          bs = by_id(baseline.get('subscriptionOffers') or [])
          cs = by_id(candidate.get('subscriptionOffers') or [])
          be = by_id(baseline.get('emspOffers') or [])
          ce = by_id(candidate.get('emspOffers') or [])

          baseline_ge = [x for x in baseline.get('directOffers') or [] if x.get('provider') == GE]
          candidate_ge = [x for x in candidate.get('directOffers') or [] if x.get('provider') == GE]
          candidate_ge_energy = [x for x in candidate_ge if (x.get('pricing') or {}).get('type') == 'kwh']
          candidate_ge_session = [x for x in candidate_ge if (x.get('pricing') or {}).get('type') == 'rules']

          non_ge_added = sorted(set(cnd) - set(bnd))
          non_ge_removed = sorted(set(bnd) - set(cnd))
          non_ge_changed = changed(bnd, cnd, sorted(set(bnd) & set(cnd)))
          sub_added = sorted(set(cs) - set(bs))
          sub_removed = sorted(set(bs) - set(cs))
          sub_changed = changed(bs, cs, sorted(set(bs) & set(cs)))

          legacy_emsp = list(be.values())
          legacy_emsp_only_ge_nextcharge = all(
              str(x.get('provider') or '').lower() == 'nextcharge'
              or 'go electric stations' in str((x.get('metadata') or {}).get('billedBy') or '').lower()
              for x in legacy_emsp
          )

          report = {
              'schemaVersion': 1,
              'publicationAllowed': False,
              'baseline': {
                  'direct': len(bd),
                  'goElectricDirect': len(baseline_ge),
                  'subscriptions': len(bs),
                  'emsp': len(be),
              },
              'candidate': {
                  'direct': len(cd),
                  'goElectricDirect': len(candidate_ge),
                  'goElectricEnergyOnly': len(candidate_ge_energy),
                  'goElectricEnergyPlusSession': len(candidate_ge_session),
                  'subscriptions': len(cs),
                  'emsp': len(ce),
                  'stations': build.get('stations'),
                  'coveragePct': (build.get('sourceCounts') or {}).get('rankableDirectCoveragePct'),
              },
              'delta': {
                  'nonGoElectricDirectAdded': non_ge_added[:50],
                  'nonGoElectricDirectRemoved': non_ge_removed[:50],
                  'nonGoElectricDirectChanged': non_ge_changed[:50],
                  'subscriptionAdded': sub_added[:50],
                  'subscriptionRemoved': sub_removed[:50],
                  'subscriptionChanged': sub_changed[:50],
                  'baselineLegacyEmspCount': len(legacy_emsp),
              },
              'gates': {
                  'candidateDirect26569': len(cd) == 26569,
                  'candidateGoElectric943': len(candidate_ge) == 943,
                  'candidateEnergyOnly816': len(candidate_ge_energy) == 816,
                  'candidateEnergyPlusSession127': len(candidate_ge_session) == 127,
                  'candidateSubscriptions2764': len(cs) == 2764,
                  'candidateEmspZero': len(ce) == 0,
                  'candidateStations29696': build.get('stations') == 29696,
                  'candidateCoverage3541': (build.get('sourceCounts') or {}).get('rankableDirectCoveragePct') == 35.41,
                  'nonGoElectricDirectUnchanged': not non_ge_added and not non_ge_removed and not non_ge_changed,
                  'subscriptionsUnchanged': not sub_added and not sub_removed and not sub_changed,
                  'legacyEmspRemovalOnlyGoElectricNextCharge': legacy_emsp_only_ge_nextcharge,
                  'publicationDisabled': True,
              },
          }
          Path('/tmp/italy-candidate/italy-publication-readiness.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not all(report['gates'].values()):
              raise SystemExit('publication readiness gates failed')
          PY

      - name: Re-test candidate session prices in V9 engine
        run: |
          node <<'NODE'
          const fs = require('fs');
          const engine = require('./assets/v9/pricing-engine.js');
          const p = JSON.parse(fs.readFileSync('/tmp/italy-candidate/italy-offers.json','utf8'));
          const offers = p.directOffers.filter(o => o.provider === 'Go Electric Stations SRLS' && o.pricing?.type === 'rules');
          let failed = 0;
          for (const offer of offers) {
            const rule = offer.pricing.rules[0];
            const got = engine.evaluateOffer(offer,{energyKwh:10,durationMinutes:30,chargingMinutes:30,startAt:'2026-09-01T10:00:00+02:00',timeZone:'Europe/Rome'});
            const expected = Math.round((10*Number(rule.pricePerKwh)+Number(rule.sessionFeeEur)+Number.EPSILON)*1e6)/1e6;
            if (got.complete !== true || Math.abs(Number(got.totalEur)-expected)>1e-6) failed++;
          }
          const r={publicationAllowed:false,tested:offers.length,passed:offers.length-failed,failed};
          fs.writeFileSync('/tmp/italy-candidate/italy-publication-engine-qa.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify(r,null,2));
          if (offers.length!==127 || failed) process.exit(1);
          NODE

      - name: Upload publication-readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-italy-go-electric-publication-readiness
          path: |
            /tmp/italy-candidate/italy-build-report.json
            /tmp/italy-candidate/italy-publication-readiness.json
            /tmp/italy-candidate/italy-publication-engine-qa.json
          retention-days: 14
