name: V9 Italy Go Electric session builder QA
# QA rerun after fixing the wrapper fallback recursion; validation gates unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - qa/v9-italy-go-electric-session-builder
    paths:
      - scripts/v9_build_italy_catalog_runtime_pricing_qa.py
      - .github/workflows/v9-italy-go-electric-session-builder-qa.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v9-italy-go-electric-session-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated Italy session-ready candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/italy-input
          gh run download 33495379759 \
            --repo yass3705/tesla-charge-companion-data-lab \
            --name go-electric-italy-v9-session-activation-qa \
            --dir /tmp/italy-input
          find /tmp/italy-input -type f -print
          test -n "$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"

      - name: Compile Italy V9 with fail-closed runtime pricing
        run: |
          set -euo pipefail
          INPUT="$(find /tmp/italy-input -name 'italy_v9_candidate_go_electric_session_ready_qa.json.gz' -print -quit)"
          mkdir -p /tmp/italy-build/static
          python scripts/v9_build_italy_catalog_runtime_pricing_qa.py \
            --input "$INPUT" \
            --out-root /tmp/italy-build/static \
            --offers /tmp/italy-build/italy-offers.json \
            --report /tmp/italy-build/italy-build-report.json

      - name: Validate compiled offer accounting and fail-closed behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/italy-build/italy-build-report.json').read_text())
          offers = json.loads(Path('/tmp/italy-build/italy-offers.json').read_text())
          assert report['directOffers'] == 26569, report
          assert report['subscriptionOffers'] == 2764, report
          assert report['emspOffers'] == 0, report
          assert report['sourceCounts']['rankableDirectEvseCount'] == 26569
          assert report['sourceCounts']['rankableDirectCoveragePct'] == 35.41

          ge = [o for o in offers['directOffers'] if o.get('provider') == 'Go Electric Stations SRLS']
          ge_kwh = [o for o in ge if (o.get('pricing') or {}).get('type') == 'kwh']
          ge_rules = [o for o in ge if (o.get('pricing') or {}).get('type') == 'rules']
          assert len(ge) == 943
          assert len(ge_kwh) == 816
          assert len(ge_rules) == 127

          session_ids = []
          for offer in ge_rules:
              pricing = offer['pricing']
              rules = pricing.get('rules') or []
              assert len(rules) == 1
              rule = rules[0]
              assert set(rule) >= {'scope', 'start', 'end', 'currency', 'pricePerKwh', 'sessionFeeEur'}
              assert 'connectedTimePerMinuteEur' not in rule
              assert 'postChargeFee' not in pricing
              session_ids.extend(offer.get('evseIds') or [])
          assert len(session_ids) == 127 and len(set(session_ids)) == 127

          qa = {
              'schemaVersion': 1,
              'publicationAllowed': False,
              'builderMergeAllowed': False,
              'directOffers': report['directOffers'],
              'subscriptionOffers': report['subscriptionOffers'],
              'emspOffers': report['emspOffers'],
              'goElectric': {
                  'total': len(ge),
                  'energyOnly': len(ge_kwh),
                  'energyPlusSession': len(ge_rules),
              },
              'gates': {
                  'directAccounting26569': report['directOffers'] == 26569,
                  'goElectric943': len(ge) == 943,
                  'energyOnly816': len(ge_kwh) == 816,
                  'energyPlusSession127': len(ge_rules) == 127,
                  'subscriptionsPreserved2764': report['subscriptionOffers'] == 2764,
                  'legacyEmspStillZero': report['emspOffers'] == 0,
                  'publicationDisabled': True,
              },
          }
          Path('/tmp/italy-build/go-electric-session-builder-qa.json').write_text(json.dumps(qa, indent=2) + '\n')
          print(json.dumps(qa, indent=2))
          PY

      - name: Test the 127 compiled session offers with the V9 pricing engine
        run: |
          node <<'NODE'
          const fs = require('fs');
          const engine = require('./assets/v9/pricing-engine.js');
          const payload = JSON.parse(fs.readFileSync('/tmp/italy-build/italy-offers.json','utf8'));
          const offers = payload.directOffers.filter(o => o.provider === 'Go Electric Stations SRLS' && o.pricing?.type === 'rules');
          if (offers.length !== 127) throw new Error(`expected 127 session offers, got ${offers.length}`);
          const failures = [];
          for (const offer of offers) {
            const rule = offer.pricing.rules[0];
            const session = {energyKwh: 10, durationMinutes: 30, chargingMinutes: 30, startAt: '2026-09-01T10:00:00+02:00', timeZone: 'Europe/Rome'};
            const got = engine.evaluateOffer(offer, session);
            const expected = Math.round((10 * Number(rule.pricePerKwh) + Number(rule.sessionFeeEur) + Number.EPSILON) * 1e6) / 1e6;
            if (got.complete !== true || Math.abs(Number(got.totalEur) - expected) > 1e-6 || Math.abs(Number(got.components?.sessionFee) - Number(rule.sessionFeeEur)) > 1e-6) {
              failures.push({id: offer.id, got, expected});
            }
          }
          const report = {publicationAllowed:false,tested:offers.length,passed:offers.length-failures.length,failed:failures.length,gates:{all127Complete:offers.length===127&&failures.length===0,sessionFeeIncluded:failures.length===0,publicationDisabled:true}};
          fs.writeFileSync('/tmp/italy-build/go-electric-session-builder-engine-qa.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if (!Object.values(report.gates).every(Boolean)) process.exit(1);
          NODE

      - name: Upload builder QA reports
        uses: actions/upload-artifact@v4
        with:
          name: v9-italy-go-electric-session-builder-qa
          path: |
            /tmp/italy-build/italy-build-report.json
            /tmp/italy-build/go-electric-session-builder-qa.json
            /tmp/italy-build/go-electric-session-builder-engine-qa.json
          retention-days: 14
