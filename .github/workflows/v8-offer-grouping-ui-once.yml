name: V8 — activer regroupement offres et synchronisation avancée

on:
  push:
    branches: ["release/2026-08"]
    paths:
      - ".github/workflows/v8-offer-grouping-ui-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026-08
          fetch-depth: 0

      - name: Patch V8 RC2 UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('content="7305"','content="8003"',1)
          html=html.replace('<title>Tesla Charge Companion 7.3 Stable</title>','<title>Tesla Charge Companion V8 RC2</title>',1)
          html=html.replace('assets/style.css?v=7305','assets/style.css?v=8003')
          html=html.replace('assets/app.js?v=7305','assets/app.js?v=8003')
          html=html.replace('assets/dedupe.js?v=7305','assets/dedupe.js?v=8003')
          html=html.replace(
            '<p>Version 7.3 Stable · synchronisation multi-appareils <span id="globalSyncBadge" class="sync-badge idle">● Synchronisation</span></p>',
            '<p>V8 RC2 · validation août 2026</p>',1)
          html=html.replace('<button data-tab="fx">Devises</button>','<button data-tab="fx">Paramètres</button>',1)
          html=html.replace('\n<button data-tab="sync">Synchronisation</button>','',1)
          html=html.replace(
            'Un même site reste sur une seule fiche. Chaque configuration possède sa puissance, son nombre de points et sa propre tarification, puis apparaît séparément dans les résultats.',
            'Un même site reste sur une seule fiche. Les offres d’une même puissance sont simulées ensemble : Charge Companion n’affiche qu’un seul résultat et retient automatiquement le meilleur tarif disponible.',1)
          html=html.replace('Tesla Charge Companion <b>V7.3 Stable</b>','Tesla Charge Companion <b>V8 RC2</b>',1)

          settings_card='''\n<div class="card">\n<h3>Sauvegarde personnelle</h3>\n<div class="small">La synchronisation GitHub n’est plus nécessaire pour les catalogues Tesla, Electroverse ou Electra. Elle reste disponible uniquement pour sauvegarder et retrouver entre tes appareils les bornes que tu ajoutes manuellement.</div>\n<button class="secondary" style="width:100%;margin-top:10px" onclick="openAdvancedSync()">Ouvrir la sauvegarde / synchronisation personnelle</button>\n</div>\n'''
          marker='</section>\n\n<section id="sync" class="panel">'
          if settings_card not in html:
            if marker not in html: raise SystemExit('Section sync introuvable')
            html=html.replace(marker,settings_card+'</section>\n\n<section id="sync" class="panel">',1)

          html=html.replace(
            '<h3>Synchronisation GitHub</h3>\n<div class="small">Synchronise les bornes tierces du fichier <code>data/custom_stations.json</code> entre tes appareils. Le jeton GitHub reste uniquement dans le stockage local de chaque navigateur et doit être configuré séparément sur chaque appareil.</div>',
            '<div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Sauvegarde / synchronisation personnelle</h3><button class="secondary" onclick="openSettingsPanel()">Retour aux paramètres</button></div>\n<div class="small" style="margin-top:10px">Fonction avancée réservée aux bornes ajoutées manuellement. Les catalogues Tesla, Electroverse et Electra ne sont jamais envoyés dans <code>custom_stations.json</code>. Le jeton GitHub reste uniquement dans le stockage local de ce navigateur.</div>',1)

          scripts='<script src="assets/dedupe.js?v=8003" defer></script>'
          replacement=scripts+'\n<script src="assets/france-catalog.js?v=8003" defer></script>\n<script src="assets/v8-offer-selection.js?v=8003" defer></script>'
          if 'assets/v8-offer-selection.js?v=8003' not in html:
            if scripts not in html: raise SystemExit('Balise dedupe V8 introuvable')
            html=html.replace(scripts,replacement,1)
          p.write_text(html,encoding='utf-8')

          vp=Path('app-version.json')
          version=json.loads(vp.read_text(encoding='utf-8'))
          version['build']='8003'
          version['version']='8.0 RC2 · Août 2026'
          version['updatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          vp.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          test -f assets/v8-offer-selection.js
          node --check assets/v8-offer-selection.js
          grep -q 'assets/france-catalog.js?v=8003' index.html
          grep -q 'assets/v8-offer-selection.js?v=8003' index.html
          grep -q '>Paramètres</button>' index.html
          ! grep -q 'data-tab="sync"' index.html

      - name: Commit V8 RC2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v8-offer-grouping-ui-once.yml
          git add index.html app-version.json assets/v8-offer-selection.js
          git commit -m 'feat(v8): select best offer per station and simplify sync'
          git push origin HEAD:release/2026-08
