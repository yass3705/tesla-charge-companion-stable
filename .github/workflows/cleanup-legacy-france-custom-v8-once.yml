name: Cleanup legacy France custom stations — one shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-france-custom-v8-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy French custom stations with tombstones
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('data/custom_stations.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          legacy={
            'alize-galard',
            'station-1786227827538',
            'izivia-levant',
            'lidl-saint-cyr',
            'one-nation',
            'station-1784992892709',
          }
          stations=data.get('stations') or []
          present={str(s.get('id')) for s in stations if str(s.get('id')) in legacy}
          if present != legacy:
              raise SystemExit(f'Expected all 6 legacy IDs before cleanup; found {sorted(present)}')

          data['stations']=[s for s in stations if str(s.get('id')) not in legacy]
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          deleted=dict(data.get('deletedIds') or {})
          for station_id in legacy:
              deleted[station_id]=now
          data['deletedIds']=deleted
          data['updatedAt']=now
          data['lastDevice']='GitHub Actions - permanent France cleanup'

          if len(stations)-len(data['stations']) != 6:
              raise SystemExit('Safety check failed: cleanup did not remove exactly 6 stations')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"Removed 6 legacy French stations; {len(data['stations'])} custom stations remain")
          PY
          python3 -m json.tool data/custom_stations.json >/dev/null
          git diff --check

      - name: Commit cleaned custom station database
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/custom_stations.json
          git commit -m 'fix(sync): tombstone legacy French custom stations'
          git push origin HEAD:main
