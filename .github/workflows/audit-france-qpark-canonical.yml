name: Audit France Q-Park canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_qpark_offers.py'
      - 'scripts/test_qpark_materializer.py'
      - 'data/qpark_izivia_tariffs_v1.json'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-qpark-canonical.yml'

permissions:
  contents: read

jobs:
  qpark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Q-Park materializer
        run: |
          python -m py_compile scripts/materialize_france_qpark_offers.py scripts/test_qpark_materializer.py
          python scripts/test_qpark_materializer.py

      - name: Validate Q-Park published tariff source
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/qpark_izivia_tariffs_v1.json',encoding='utf-8'))
          assert d.get('dataset')=='qpark-izivia-tariffs-france'
          assert d.get('networkId')=='qpark' and d.get('country')=='FR'
          s=d.get('scope') or {}
          assert s.get('qparkIsCommercialHost') is True
          assert s.get('chargingProvider')=='IZIVIA'
          assert s.get('requirePhysicalOperatorId')=='izivia'
          assert s.get('excludeOtherTechnicalCpos') is True
          assert s.get('parkingExcludedFromChargingTariff') is True
          assert s.get('otherMspTariffsRemainSeparate') is True
          assert s.get('payNowTariffUnresolved') is True
          sub={r['id']:r for r in d.get('subscriptions') or []}['izivia-pass-access']
          assert float(sub.get('feeEur'))==15 and float(sub.get('monthlyFeeEur'))==0
          assert sub.get('defaultSelected') is False and sub.get('rankableWhenSelected') is True
          offers={r['id']:r for r in d.get('offers') or []}
          a=offers['qpark-izivia-pass-access']; r=(a.get('pricingRules') or [])[0]
          assert a.get('channel')=='subscription' and a.get('rankable') is True
          assert float(r.get('pricePerKwh'))==0.55 and float(r.get('connectionFee'))==1.20
          assert float(r.get('parkingPerMinute'))==0
          p=offers['qpark-izivia-paynow-unresolved']
          assert p.get('channel')=='reference' and p.get('rankable') is False and not p.get('pricingRules')
          print(json.dumps({'verifiedAt':d.get('verifiedAt'),'access':a,'paynow':p},ensure_ascii=False,indent=2))
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize Q-Park canonical offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_qpark_offers.py \
            --source data/qpark_izivia_tariffs_v1.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate Q-Park canonical safety
        run: |
          python - <<'PY'
          import gzip,json
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/qpark_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/qpark_materialization_report.json',encoding='utf-8'))
          s=report['summary']
          assert 200 <= s['canonicalQparkStationCount'] <= 400
          assert 1500 <= s['canonicalQparkPdcCount'] <= 2500
          assert s['eligibleIziviaPdcCount'] > 0
          assert s['rankableCoveredPdcCount']==s['eligibleIziviaPdcCount']
          assert s['referenceCoveredPdcCount']==s['eligibleIziviaPdcCount']
          assert s['unresolvedEligiblePdcCount']==0
          assert s['rankableOfferCount']==s['eligibleIziviaPdcCount']
          assert s['referenceOfferCount']==s['eligibleIziviaPdcCount']
          assert s['materializedOfferCount']==2*s['eligibleIziviaPdcCount']==len(offers)
          assert s['physicalInventoryMutationCount']==0
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs and pdcs[pid].get('stationId')==sid
              assert stations[sid].get('tariffNetworkId')=='qpark'
              assert pdcs[pid].get('tariffNetworkId')=='qpark'
              physical=str(pdcs[pid].get('physicalOperatorId') or stations[sid].get('physicalOperatorId') or '').lower()
              assert physical=='izivia'
              assert row.get('tariffNetworkId')=='qpark'
              assert row.get('matchMethod')=='qpark_network_plus_physical_operator_izivia'
              if row.get('rankable'):
                  assert row.get('channel')=='subscription'
                  assert row.get('subscriptionId')=='izivia-pass-access'
                  rule=(row.get('pricingRules') or [])[0]
                  assert float(rule.get('pricePerKwh'))==0.55
                  assert float(rule.get('connectionFee'))==1.20
                  assert float(rule.get('parkingPerMinute'))==0
              else:
                  assert row.get('channel')=='reference'
                  assert row.get('sourceMode')=='reference_only'
                  assert not row.get('pricingRules')
          electra={pid for pid,r in pdcs.items() if r.get('tariffNetworkId')=='electra' or str(r.get('physicalOperatorId') or '').lower()=='electra'}
          assert not any(r['canonicalPdcId'] in electra for r in offers)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          print(json.dumps(report.get('blockedOtherCpoExamples') or [],ensure_ascii=False,indent=2))
          PY

      - name: Upload Q-Park audit
        uses: actions/upload-artifact@v4
        with:
          name: france-qpark-canonical-audit
          path: |
            build/france_irve/operator_gap_report.json
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/qpark_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/qpark_subscriptions_contract_v1_1.json
            build/france_irve_offers/qpark_materialization_report.json
          retention-days: 14
