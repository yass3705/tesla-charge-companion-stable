name: Audit France C-Park Rennes canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/cpark_rennes_direct_tariffs_v1.json'
      - 'scripts/materialize_france_cpark_rennes_offers.py'
      - 'scripts/test_cpark_rennes_materializer.py'
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-cpark-rennes-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpark-rennes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate C-Park source and materializer
        run: |
          python -m py_compile scripts/materialize_france_cpark_rennes_offers.py scripts/test_cpark_rennes_materializer.py
          python scripts/test_cpark_rennes_materializer.py
          python - <<'PY'
          import json
          d=json.load(open('data/cpark_rennes_direct_tariffs_v1.json',encoding='utf-8'))
          assert d['verifiedAt']=='2026-09-01'
          r=d['tariffFamily']['pricingRules'][0]
          assert r['connectionFee']==1.0 and r['pricePerKwh']==0.40 and r['parkingPerMinute']==0
          assert d['access']['alizeLiberteBadgePurchaseEur']==12.0
          assert d['access']['alizeLiberteMonthlyFeeEur']==0.0
          assert d['thirdPartyOperatorReference']['rankable'] is False
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize C-Park Rennes direct scope
        run: |
          python scripts/materialize_france_cpark_rennes_offers.py \
            --source data/cpark_rennes_direct_tariffs_v1.json \
            --canonical-dir build/france_irve_identity \
            --static-csv .tmp/irve/static.csv \
            --out-dir build/france_irve_offers

      - name: Validate C-Park Rennes canonical coverage
        run: |
          python - <<'PY'
          import gzip,json,re,unicodedata
          r=json.load(open('build/france_irve_offers/cpark_rennes_materialization_report.json',encoding='utf-8'));s=r['summary']
          assert s['eligibleStationCount']==8,s
          assert 220 <= s['eligiblePdcCount'] <= 250,s
          assert s['rankableCoveredPdcCount']==s['eligiblePdcCount'],s
          assert s['rankableOfferCount']==s['eligiblePdcCount'],s
          assert s['referenceOfferCount']==s['eligiblePdcCount'],s
          assert s['unresolvedPdcCount']==0 and s['physicalInventoryMutationCount']==0,s
          assert len(r['contractingAuthorities'])==1 and 'CITEDIA' in r['contractingAuthorities'][0].upper(),r['contractingAuthorities']
          def norm(x):
              x=unicodedata.normalize('NFD',str(x or ''));x=''.join(c for c in x if unicodedata.category(c)!='Mn')
              return re.sub(r'[^a-z0-9]+',' ',x.lower()).strip()
          names=' | '.join(norm(x.get('name')) for x in r['stations'])
          for token in ['arsenal','chezy dinan','de gaulle','gare sud','hoche','hotel dieu','kleber','lices']:
              assert token in names,(token,names)
          with gzip.open('build/france_irve_offers/cpark_rennes_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as f:offers=json.load(f)
          rank=[x for x in offers if x['rankable']];refs=[x for x in offers if not x['rankable']]
          assert all(x['tariffNetworkId']=='cpark-rennes' for x in offers)
          assert all(x['physicalOperatorId']=='bouygues-energies-services' for x in offers)
          assert all(x['subscriptionId']=='alize-liberte' for x in rank)
          assert all(x['selectors']['umbrellaTariffNetworkId']=='alize-liberte' for x in offers)
          assert all(x['pricingRules'][0]['connectionFee']==1.0 and x['pricingRules'][0]['pricePerKwh']==0.40 for x in offers)
          assert all(x['pricingRules'][0]['parkingPerMinute']==0 for x in offers)
          assert all(x['blockedReasons']==['third_party_operator_service_fee_may_apply'] for x in refs)
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY

      - name: Upload C-Park Rennes audit
        uses: actions/upload-artifact@v4
        with:
          name: france-cpark-rennes-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/cpark_rennes_materialization_report.json
            build/france_irve_offers/cpark_rennes_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
