name: Validate Spain REVE full pass

on:
  workflow_dispatch:
  push:
    branches: ["spain-reve-preintegration"]
    paths:
      - ".github/workflows/validate-spain-reve-full-pass.yml"
      - "data/spain_reve/state.json"
      - "data/spain_reve/metadata.json"
      - "data/spain_reve/reve_locations_raw.json.gz"

permissions:
  contents: write

concurrency:
  group: validate-spain-reve-full-pass
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate completed national snapshot
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path('data/spain_reve')
          state = json.loads((d/'state.json').read_text())
          meta = json.loads((d/'metadata.json').read_text())
          with gzip.open(d/'reve_locations_raw.json.gz', 'rt', encoding='utf-8') as f:
              snap = json.load(f)

          raw = snap.get('locations', {})
          if isinstance(raw, dict):
              items = list(raw.items())
              locations = list(raw.values())
              location_keys = [str(k) for k,_ in items]
          else:
              locations = list(raw or [])
              location_keys = [str(x.get('id') or x.get('location_id') or '') for x in locations if isinstance(x, dict)]

          def ids_for_location(loc):
              out=[]
              if not isinstance(loc, dict): return out
              for evse in (loc.get('evses') or []):
                  if isinstance(evse, dict):
                      v = evse.get('evse_id') or evse.get('id')
                      if v: out.append(str(v))
              return out

          evse_ids=[]
          coord_missing=0
          invalid_coords=0
          malformed_locations=0
          for loc in locations:
              if not isinstance(loc, dict):
                  malformed_locations += 1
                  continue
              evse_ids.extend(ids_for_location(loc))
              c = loc.get('coordinates')
              if not isinstance(c, dict) or c.get('latitude') is None or c.get('longitude') is None:
                  coord_missing += 1
              else:
                  try:
                      lat=float(c['latitude']); lon=float(c['longitude'])
                      if not (-90 <= lat <= 90 and -180 <= lon <= 180): invalid_coords += 1
                  except Exception:
                      invalid_coords += 1

          dup_location_keys = sum(v-1 for v in Counter(k for k in location_keys if k).values() if v > 1)
          dup_evse_ids = sum(v-1 for v in Counter(evse_ids).values() if v > 1)
          stored=len(locations)
          registry=int(meta.get('registryTotalCount') or state.get('totalCount') or 0)
          pages=int(state.get('pagesFetchedThisCycle') or 0)
          total_pages=int(state.get('totalPages') or meta.get('totalPages') or 0)
          complete=bool(meta.get('complete')) and bool(state.get('cycleCompletedAt')) and pages == total_pages == 146
          gap=registry-stored
          coverage=round(stored/registry*100, 2) if registry else None

          gates={
              'nationalPassComplete': complete,
              'pageCoverage146of146': pages == 146 and total_pages == 146,
              'snapshotReadable': malformed_locations == 0,
              'locationKeyDuplicatesZero': dup_location_keys == 0,
              'coordinatesStructurallyValid': invalid_coords == 0,
              'registryCountReconciled': gap == 0,
          }
          report={
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'country':'ES','source':'REVE','integrationStatus':'PRE_INTEGRATION_ONLY',
              'pagesCompleted': pages,'totalPages': total_pages,
              'locationsStored': stored,'registryTotalCount': registry,
              'registryGap': gap,'registryCoveragePct': coverage,
              'evseIdsObserved': len(evse_ids),
              'duplicateLocationKeys': dup_location_keys,
              'duplicateEvseIds': dup_evse_ids,
              'locationsMissingCoordinates': coord_missing,
              'invalidCoordinates': invalid_coords,
              'malformedLocations': malformed_locations,
              'gates': gates,
              'publishReady': all(gates.values()),
              'note': 'Validation is offline against the collected snapshot; it performs zero REVE API requests.'
          }
          (d/'full_pass_validation.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, indent=2))
          # Fail closed for publication readiness, but still commit the report first in the next step.
          PY

      - name: Commit validation report
        shell: bash
        run: |
          git add data/spain_reve/full_pass_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(es): record REVE full-pass validation"
          git push

      - name: Enforce publication gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/spain_reve/full_pass_validation.json').read_text())
          if not r.get('publishReady'):
              bad=[k for k,v in r.get('gates',{}).items() if not v]
              raise SystemExit('REVE full-pass publication gates not satisfied: '+', '.join(bad))
          PY
