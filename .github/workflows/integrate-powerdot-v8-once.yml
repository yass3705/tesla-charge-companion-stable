name: Finaliser Powerdot Direct V8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-powerdot-v8-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use published root dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/france-catalog-v8.js')
          s=p.read_text(encoding='utf-8')
          old="const POWERDOT_URL='data/powerdot_direct_france.json.gz';"
          new="const POWERDOT_URL='../data/powerdot_direct_france.json.gz';"
          if old not in s and new not in s: raise SystemExit('POWERDOT_URL introuvable')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_runtime.mjs
          grep -q "POWERDOT_URL='../data/powerdot_direct_france.json.gz'" assets/france-catalog-v8.js
      - name: Publish runtime path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/france-catalog-v8.js
          git commit -m "fix(v8): load Powerdot dataset from site root"
          git push origin HEAD:main
