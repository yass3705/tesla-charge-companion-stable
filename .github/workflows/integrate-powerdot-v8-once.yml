name: Integrer Powerdot Direct V8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-powerdot-v8-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Powerdot dataset
        run: curl --fail --location --retry 4 --retry-delay 5 --output data/powerdot_direct_france.json.gz https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/national/powerdot_direct_france.json.gz

      - name: Patch V8
        run: python scripts/integrate_powerdot_v8_once.py

      - name: Validate Powerdot and regressions
        run: |
          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_runtime.mjs
          node scripts/test_ionity_v8_runtime.mjs
          node scripts/test_atlante_v8_runtime.mjs
          grep -q "POWERDOT_URL='data/powerdot_direct_france.json.gz'" assets/france-catalog-v8.js
          grep -q 'powerdot_direct_france.json.gz' .github/workflows/pages.yml
          grep -q 'france-catalog.js?v=rc48-powerdot-20260826' .github/workflows/pages.yml

      - name: Publish integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-powerdot-v8-once.yml scripts/integrate_powerdot_v8_once.py
          git add -A
          git commit -m "feat(v8): integrate Powerdot direct CPO tariffs"
          git push origin HEAD:main
