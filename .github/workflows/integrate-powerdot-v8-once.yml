name: Integrer Powerdot Direct V8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-powerdot-v8-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download Powerdot dataset
        run: curl --fail --location --retry 4 --retry-delay 5 --output data/powerdot_direct_france.json.gz https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/national/powerdot_direct_france.json.gz
      - name: Diagnose connector delta
        run: |
          python -c 'import gzip,json; d=json.load(gzip.open("data/powerdot_direct_france.json.gz","rt")); bad=[{"charger":e.get("chargerName"),"location":(e.get("location") or {}).get("name"),"connector":c.get("connectorNumber"),"physicalReference":c.get("physicalReference"),"type":c.get("type"),"maxPowerKw":c.get("maxPowerKw"),"voltage":c.get("voltage"),"amperage":c.get("amperage"),"tariff":c.get("tariff")} for e in d.get("chargers",[]) for c in (e.get("charger") or {}).get("connectors",[]) if not (float(c.get("maxPowerKw") or 0)>0)]; print(json.dumps({"missingPowerCount":len(bad),"items":bad},ensure_ascii=False,indent=2))'
      - name: Patch V8
        run: python scripts/integrate_powerdot_v8_once.py
      - name: Align source metadata guards
        run: |
          python -c 'from pathlib import Path; p=Path("assets/france-catalog-v8.js"); s=p.read_text(); s=s.replace("      if(data?.dataset!==\u0027powerdot-direct-cpo-france\u0027)throw new Error(\u0027Dataset Powerdot inattendu\u0027);\n      if(data?.source?.pricingContext!==\u0027direct CPO / adhoc / emspCode empty\u0027)throw new Error(\u0027Contexte tarifaire Powerdot invalide\u0027);", "      if(data?.source?.sourceType!==\u0027direct_cpo_public_adhoc_api\u0027||data?.source?.roaming!==false||text(data?.source?.emspCode)!==\u0027\u0027||text(data?.source?.operator)!==\u0027Power Dot France\u0027)throw new Error(\u0027Contexte tarifaire Powerdot invalide\u0027);"); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("scripts/test_powerdot_v8_runtime.mjs"); s=p.read_text(); s=s.replace("assert(powerdot.dataset===\u0027powerdot-direct-cpo-france\u0027,\u0027Dataset Powerdot inattendu\u0027);\nassert(powerdot.source?.pricingContext===\u0027direct CPO / adhoc / emspCode empty\u0027,\u0027Contexte CPO Powerdot invalide\u0027);", "assert(powerdot.source?.sourceType===\u0027direct_cpo_public_adhoc_api\u0027,\u0027Source Powerdot inattendue\u0027);\nassert(powerdot.source?.roaming===false&&String(powerdot.source?.emspCode??\u0027\u0027)===\u0027\u0027&&powerdot.source?.operator===\u0027Power Dot France\u0027,\u0027Contexte CPO Powerdot invalide\u0027);"); p.write_text(s)'
      - name: Validate Powerdot and regressions
        run: |
          node --check assets/france-catalog-v8.js
          node scripts/test_powerdot_v8_runtime.mjs
          node scripts/test_ionity_v8_runtime.mjs
          node scripts/test_atlante_v8_runtime.mjs
          grep -q "POWERDOT_URL='data/powerdot_direct_france.json.gz'" assets/france-catalog-v8.js
          grep -q 'powerdot_direct_france.json.gz' .github/workflows/pages.yml
          grep -q 'france-catalog.js?v=rc48-powerdot-20260826' .github/workflows/pages.yml
      - name: Publish integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-powerdot-v8-once.yml scripts/integrate_powerdot_v8_once.py
          git add -A
          git commit -m "feat(v8): integrate Powerdot direct CPO tariffs"
          git push origin HEAD:main
