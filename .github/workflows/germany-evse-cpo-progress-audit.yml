name: Germany EVSE CPO progress audit

on:
  pull_request:
    paths:
      - 'data/v9/germany-*.json'
      - 'scripts/audit_germany_evse_cpo_progress_v9.py'
      - '.github/workflows/germany-evse-cpo-progress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit EVSE-prefix CPO progress
        run: python scripts/audit_germany_evse_cpo_progress_v9.py
