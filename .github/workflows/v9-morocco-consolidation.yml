name: V9 Morocco unified consolidation

on:
  workflow_dispatch:
  push:
    branches: ['feat/morocco-v9-consolidation']
    paths:
      - 'assets/v9/adapters/morocco-public.js'
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'assets/v9/browser-loaders.js'
      - 'assets/v9/pricing-engine.js'
      - 'assets/v9/session-engine.js'
      - 'data/v9/source-registry.json'
      - 'v9-preview/app.js'
      - 'v9-preview/index.html'
      - 'tests/v9-morocco-consolidation.test.cjs'
      - '.github/workflows/v9-morocco-consolidation.yml'
  pull_request:
    paths:
      - 'assets/v9/adapters/morocco-public.js'
      - 'assets/v9/adapters/morocco-nonproduction.js'
      - 'assets/v9/browser-loaders.js'
      - 'assets/v9/pricing-engine.js'
      - 'assets/v9/session-engine.js'
      - 'data/v9/source-registry.json'
      - 'v9-preview/app.js'
      - 'v9-preview/index.html'
      - 'tests/v9-morocco-consolidation.test.cjs'
      - '.github/workflows/v9-morocco-consolidation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Morocco and preview syntax
        run: |
          node --check assets/v9/adapters/morocco-public.js
          node --check assets/v9/adapters/morocco-nonproduction.js
          node --check assets/v9/browser-loaders.js
          node --check assets/v9/pricing-engine.js
          node --check assets/v9/session-engine.js
          node --check v9-preview/app.js
          node --check tests/v9-morocco-consolidation.test.cjs
      - name: Validate registry safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/v9/source-registry.json','utf8'));
          const ma=r.sources.filter(s=>s.countries?.includes('MA'));
          if(ma.length!==4)throw new Error(`expected four physical Morocco sources, got ${ma.length}`);
          if(ma.some(s=>/evone|evplug|shell|vivo/i.test(s.id)))throw new Error('eMSP/diagnostic source leaked into physical registry');
          if(!ma.every(s=>s.adapter==='morocco-public-v1'))throw new Error('unexpected Morocco physical adapter');
          if(!r.sources.some(s=>s.id==='france-bump-offers'))throw new Error('latest V9 registry source lost during Morocco consolidation');
          NODE
      - name: Validate live sanitized public datasets, pricing and cross-source merge
        run: node tests/v9-morocco-consolidation.test.cjs
