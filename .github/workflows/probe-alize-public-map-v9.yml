name: France V9 Alize public map probe

on:
  workflow_dispatch:
  push:
    branches:
      - fix/france-qovoltis-ionity-runtime-v9-resync-20260901
    paths:
      - '.github/workflows/probe-alize-public-map-v9.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Alize public map
        shell: bash
        run: |
          set -euo pipefail
          echo 'probe-version=2'
          mkdir -p /tmp/alize
          curl -fLsS --retry 3 https://alize-map.azurewebsites.net/ -o /tmp/alize/index.html
          echo '=== INDEX ASSETS ==='
          grep -Eo 'src="[^"]+\.js[^\"]*|href="[^"]+\.css[^\"]*' /tmp/alize/index.html || true
          python - <<'PY'
          import re, pathlib, urllib.parse, subprocess
          html=pathlib.Path('/tmp/alize/index.html').read_text(errors='ignore')
          base='https://alize-map.azurewebsites.net/'
          assets=[]
          for m in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css)(?:\?[^"\']*)?)["\']',html,re.I):
              u=urllib.parse.urljoin(base,m)
              if u not in assets: assets.append(u)
          print('assets',len(assets))
          for i,u in enumerate(assets):
              p=f'/tmp/alize/asset-{i}.txt'
              subprocess.run(['curl','-fLsS','--retry','2',u,'-o',p],check=False)
              print(i,u)
          PY
          echo '=== URL/API CANDIDATES ==='
          grep -Ehoi 'https?://[^"'"'"' )]+' /tmp/alize/*.txt | sort -u | head -200 || true
          echo '=== API/AJAX/CHARGE/TARIFF HINTS ==='
          grep -Ehin 'api|ajax|borne|station|chargepoint|tarif|price|connector|evse|marker|json|geojson' /tmp/alize/*.txt | head -400 || true
