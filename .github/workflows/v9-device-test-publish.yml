name: Publish isolated V9 device test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-device-test-publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout validated V9 source
        uses: actions/checkout@v4
        with:
          ref: 0ec6057259664e69c8c330fbe94715ed8f5a04dc
          path: v9src

      - name: Build isolated V9 test subtree
        shell: bash
        run: |
          set -euo pipefail
          root_hash_before="$(sha256sum site/index.html | awk '{print $1}')"
          rm -rf site/v9-test
          mkdir -p site/v9-test/{v9-app,v9-gate,assets/v9,data/v9,data/non_tesla_netherlands}
          rsync -a --delete v9src/v9-app/ site/v9-test/v9-app/
          rsync -a --delete v9src/v9-gate/ site/v9-test/v9-gate/
          cp v9src/v9-gate/test-gate.js site/v9-test/v9-gate/gate.js
          rsync -a --delete v9src/assets/v9/ site/v9-test/assets/v9/
          rsync -a --delete v9src/data/v9/ site/v9-test/data/v9/
          cp v9src/data/tesla_stations.json site/v9-test/data/tesla_stations.json
          cp v9src/data/ionity_direct_stations_france.json.gz site/v9-test/data/ionity_direct_stations_france.json.gz
          cp v9src/data/atlante_direct_stations_france.json.gz site/v9-test/data/atlante_direct_stations_france.json.gz
          cp v9src/data/powerdot_direct_france.json.gz site/v9-test/data/powerdot_direct_france.json.gz
          cp v9src/data/netherlands_direct_tariffs_v1.json site/v9-test/data/netherlands_direct_tariffs_v1.json
          rsync -a --delete v9src/data/non_tesla_netherlands/ site/v9-test/data/non_tesla_netherlands/
          root_hash_after="$(sha256sum site/index.html | awk '{print $1}')"
          test "$root_hash_before" = "$root_hash_after"
          test -s site/v9-test/v9-gate/index.html
          test -s site/v9-test/v9-app/index.html
          test -s site/v9-test/v9-app/scenario-runner.js
          test -s site/v9-test/assets/v9/runtime-engine.js
          test -s site/v9-test/assets/v9/device-scenario-engine.js
          test -s site/v9-test/data/v9/source-registry.json
          test -s site/v9-test/data/v9/first-device-scenarios.json
          node --check site/v9-test/v9-gate/gate.js
          node --check site/v9-test/v9-app/app.js
          node --check site/v9-test/v9-app/scenario-runner.js
          echo 'Root V8 index unchanged; isolated /v9-test package ready.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
