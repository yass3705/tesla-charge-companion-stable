name: Audit France Lidl canonical

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'scripts/materialize_france_lidl_offers.py'
      - 'scripts/test_lidl_materializer.py'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - '.github/workflows/audit-france-lidl-canonical.yml'

permissions:
  contents: read

jobs:
  lidl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Lidl materializer
        run: |
          python -m py_compile scripts/materialize_france_lidl_offers.py scripts/test_lidl_materializer.py
          python scripts/test_lidl_materializer.py

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Fetch official Lidl Plus national tariff
        run: |
          mkdir -p .tmp/lidl
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/main/data/operator_direct/lidl_plus_france.json' \
            --output .tmp/lidl/lidl_plus_france.json
          python - <<'PY'
          import json
          data=json.load(open('.tmp/lidl/lidl_plus_france.json',encoding='utf-8'))
          assert data.get('dataset')=='operator-direct-lidl-plus-france'
          assert data.get('country')=='FR'
          assert data.get('provider')=='Lidl Plus'
          scope=data.get('networkScope') or {}
          assert scope.get('kind')=='all_lidl_charging_sites_france'
          assert scope.get('confirmedByOfficialSource') is True
          assert scope.get('stationLevelPriceLookupRequired') is False
          evidence=data.get('sourceEvidence') or {}
          assert evidence.get('officialPage') is True
          assert evidence.get('sameTariffEverywhereFrance') is True
          print(json.dumps({'generatedAt':data.get('generatedAt'),'pricing':data.get('pricing')},ensure_ascii=False,indent=2))
          PY

      - name: Materialize Lidl canonical offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_lidl_offers.py \
            --source .tmp/lidl/lidl_plus_france.json \
            --canonical-dir build/france_irve_identity \
            --out-dir build/france_irve_offers

      - name: Validate Lidl canonical scope
        run: |
          python - <<'PY'
          import gzip,json
          stations={r['stationId']:r for r in json.load(gzip.open('build/france_irve_identity/stations.json.gz','rt',encoding='utf-8'))}
          pdcs={r['pdcId']:r for r in json.load(gzip.open('build/france_irve_identity/charge_points.json.gz','rt',encoding='utf-8'))}
          offers=json.load(gzip.open('build/france_irve_offers/lidl_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8'))
          report=json.load(open('build/france_irve_offers/lidl_materialization_report.json',encoding='utf-8'))
          summary=report['summary']
          assert summary['canonicalLidlStationCount'] >= 800
          assert summary['canonicalLidlPdcCount'] >= 5000
          assert summary['materializedOfferCount']==len(offers)>0
          assert summary['rankableOfferCount']==len(offers)
          assert summary['rankableCoveredPdcCount']==summary['canonicalLidlPdcCount']
          assert summary['unresolvedPdcCount']==0
          assert summary['physicalInventoryMutationCount']==0
          assert len({r['offerId'] for r in offers})==len(offers)
          for row in offers:
              sid=row['canonicalStationId']; pid=row['canonicalPdcId']
              assert sid in stations and pid in pdcs
              assert pdcs[pid].get('stationId')==sid
              assert stations[sid].get('tariffNetworkId')=='lidl'
              assert pdcs[pid].get('tariffNetworkId')=='lidl'
              assert row.get('tariffNetworkId')=='lidl'
              assert row.get('provider')=='Lidl Plus'
              assert row.get('channel')=='direct' and row.get('subscriptionId') is None
              assert row.get('matchMethod')=='network_scope'
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload Lidl audit
        uses: actions/upload-artifact@v4
        with:
          name: france-lidl-canonical-audit
          path: |
            build/france_irve/operator_gap_report.json
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/lidl_pdc_offers_contract_v1_1.json.gz
            build/france_irve_offers/lidl_materialization_report.json
          retention-days: 14
