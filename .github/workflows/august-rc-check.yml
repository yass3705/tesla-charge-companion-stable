name: August RC checks

on:
  pull_request:
    branches: [main, release/2026-08]
  push:
    branches:
      - release/2026-08
      - 'codex/v8-*'

permissions:
  contents: read
  actions: write

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/dedupe.js
          node --check assets/update.js
          node --check assets/august-release.js
          node --check assets/august-ui-fixes.js
          node --check assets/august-rc2-fixes.js
          node --check assets/v8-offer-selection.js
          node --check assets/v8-e55c-pricing.js
          node --check assets/v8-overlay-area-bridge.js
          node --check assets/v8-canonical-station-overlay.js
          node --check assets/v8-direct-resolver-ui.js
          node --check assets/v8-direct-resolver-followup.js
          node --check assets/v8-subscription-selection.js
          node --check assets/v8-subscription-stability-fix.js
          node --check assets/v8-compare-subscriptions.js
          node --check assets/v8-rc48bn-runtime-hotfix.js
          node --check assets/v8-direct-offer-pipeline.js
          node --check assets/v8-labornebleue-operator-fallback.js
          node --check assets/v8-source-integrity.js
          node --check assets/v8-waat-direct.js
          node --check assets/v8-freshmile-direct-overlay.js
          node --check assets/v8-bump-direct.js
          node --check assets/v8-runtime-integrity-guard.js
          node --check scripts/test_v8_tariff_registry.mjs
          node --check scripts/test_v8_direct_offer_pipeline.mjs
          node --check scripts/test_freshmile_v8_runtime.mjs
          node --check scripts/test_bump_direct_v8.mjs
          node --check scripts/test_v8_runtime_integrity_guard.mjs
          node --check scripts/audit_bump_runtime_matching.mjs
          node --check service-worker.js

      - name: Validate JSON files
        run: |
          python -m json.tool app-version.json >/dev/null
          python -m json.tool data/metadata.json >/dev/null
          python -m json.tool data/station_templates.json >/dev/null
          python -m json.tool data/tesla_stations.json >/dev/null
          python -m json.tool data/custom_stations.json >/dev/null
          python -m json.tool data/exchange_rates.json >/dev/null
          python -m json.tool data/tariff_overlay_v1.json >/dev/null
          python -m json.tool data/v8_canonical_station_overlay_v1.json >/dev/null
          python -m json.tool data/v8_tariff_sources.json >/dev/null
          python -m json.tool data/waat_direct_tariffs_tcc_france.json >/dev/null

      - name: Smoke-test E55C PARKING_TIME semantics
        run: node scripts/test_e55c_pricing.mjs

      - name: Smoke-test subscription ranking semantics
        run: node scripts/test_v8_subscription_ranking.mjs

      - name: Smoke-test compact subscription UI refactor
        run: node scripts/test_compare_subscriptions_refactor.mjs

      - name: Smoke-test La Borne Bleue explicit operator fallback
        run: node scripts/test_labornebleue_explicit_operator_fallback.mjs

      - name: Validate unified tariff registry and fixtures
        run: node scripts/test_v8_tariff_registry.mjs

      - name: Validate pre-expansion direct offer pipeline
        run: node scripts/test_v8_direct_offer_pipeline.mjs

      - name: Fetch pinned Freshmile strict snapshot
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/yass3705/tesla-charge-companion-data-lab/d64a60862b75c0839b5f771410a2afa07ddee3b3/data/national/freshmile_direct_tcc_v8.json.gz \
            -o data/freshmile_direct_tcc_v8.json.gz
          python - <<'PY'
          from pathlib import Path
          blob=Path('data/freshmile_direct_tcc_v8.json.gz').read_bytes()
          assert blob[:2]==b'\x1f\x8b' and len(blob)>1000
          print({'freshmileSnapshotBytes':len(blob)})
          PY

      - name: Validate non-destructive Freshmile overlay
        run: node scripts/test_freshmile_v8_runtime.mjs

      - name: Smoke-test Bump direct matching and fee rules
        run: node scripts/test_bump_direct_v8.mjs

      - name: Fetch pinned France catalog for Bump matching audit
        run: |
          set -euo pipefail
          mkdir -p data/non_tesla_france
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/yass3705/tesla-charge-companion-stable/7652472eae0ea60db1bad2767d1f6fd0dbbee73f/data/non_tesla_france/all.json.gz \
            -o data/non_tesla_france/all.json.gz
          python - <<'PY'
          from pathlib import Path
          blob=Path('data/non_tesla_france/all.json.gz').read_bytes()
          assert blob[:2]==b'\x1f\x8b' and len(blob)>1000
          print({'franceCatalogBytes':len(blob)})
          PY

      - name: Audit Bump known Paris matching fixtures
        run: node scripts/audit_bump_runtime_matching.mjs

      - name: Validate preview-local data isolation
        run: node scripts/test_v8_runtime_integrity_guard.mjs

      - name: Smoke-test WAAT direct station/configuration tariffs
        run: node scripts/test_waat_direct_v8.mjs

      - name: Verify August build references
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$(node -p "require('./app-version.json').build")"
          test -n "$BUILD"
          grep -q "CURRENT_BUILD='$BUILD'" assets/update.js
          grep -q "tcc-v${BUILD}-august" service-worker.js
          grep -q "content=\"${BUILD}\"" index.html
          grep -q "assets/update.js?v=${BUILD}" index.html
          grep -q "assets/v8-offer-selection.js?v=${BUILD}" index.html
          ! grep -q "assets/v8-e55c-pricing.js" index.html
          grep -q "assets/v8-waat-direct.js" index.html
          grep -q "assets/v8-rc48bn-runtime-hotfix.js" index.html
          test "$(grep -c 'assets/v8-waat-direct.js' index.html)" -eq 1
          test -s data/waat_direct_tariffs_tcc_france.json
          grep -q "assets/v8-direct-offer-pipeline.js?v=v8-direct-offer-pipeline-5" assets/v8-rc48bn-runtime-hotfix.js
          grep -q "august-ui-fixes.js" assets/update.js
          grep -q "august-rc2-fixes.js" assets/update.js
          grep -q "v8-compare-subscriptions.js?v=rc48bt-20260825" assets/update.js
          grep -q "v8-direct-resolver-ui.js" assets/v8-overlay-area-bridge.js
          grep -q "v8-direct-resolver-followup.js" assets/v8-overlay-area-bridge.js
          grep -q "v8-subscription-stability-fix.js" assets/v8-overlay-area-bridge.js
          grep -q "v8-labornebleue-operator-fallback.js" assets/v8-overlay-area-bridge.js
          grep -q "rc48av-fee-breakdown-fix" assets/v8-direct-resolver-followup.js
          grep -q "teslaCongestionFeePerMinute" data/tesla_stations.json
          echo "V8 build ${BUILD} references are consistent."

      - name: Redeploy V8 preview through main Pages workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/2026-08'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
