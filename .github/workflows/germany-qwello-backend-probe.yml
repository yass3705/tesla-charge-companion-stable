name: Germany Qwello public tariff backend probe

on:
  pull_request:
    paths:
      - 'scripts/probe_qwello_tariff_backend_v9.py'
      - '.github/workflows/germany-qwello-backend-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_qwello_tariff_backend_v9.py
