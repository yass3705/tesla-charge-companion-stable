name: Audit France Grenoble canonical

on:
  push:
    branches:
      - refactor/france-irve-canonical
    paths:
      - 'data/france_irve_tariff_network_additions_v1.json'
      - 'data/grenoble_alpes_metropole_tariff_review_20260901.json'
      - 'scripts/build_effective_france_tariff_network_registry.py'
      - 'scripts/materialize_france_grenoble_offers.py'
      - 'scripts/test_grenoble_materializer.py'
      - 'data/france_irve_operator_registry_v1.json'
      - 'data/france_irve_tariff_network_registry_v1.json'
      - 'data/france_tariff_base_coverage_v1.json'
      - 'scripts/run_france_irve_canonical.py'
      - 'scripts/run_enrich_france_irve_network_identity.py'
      - '.github/workflows/audit-france-grenoble-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grenoble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Grenoble source and materializer
        run: |
          python -m py_compile scripts/materialize_france_grenoble_offers.py scripts/test_grenoble_materializer.py
          python scripts/test_grenoble_materializer.py
          python - <<'PY'
          import json
          a=json.load(open('data/france_irve_tariff_network_additions_v1.json',encoding='utf-8'))
          rows={x['id']:x for x in a['networks']}
          assert 'grenoble-alpes-metropole' in rows
          r=rows['grenoble-alpes-metropole']
          assert r['coverageStatus']=='partial_ready'
          assert 'Grenoble-Alpes Métropole' in r['aliases']
          PY

      - name: Build effective tariff-network registry
        run: |
          mkdir -p build/france_irve
          python scripts/build_effective_france_tariff_network_registry.py \
            --registry data/france_irve_tariff_network_registry_v1.json \
            --additions data/france_irve_tariff_network_additions_v1.json \
            --coverage data/france_tariff_base_coverage_v1.json \
            --out build/france_irve/effective_tariff_network_registry.json
          python - <<'PY'
          import json
          d=json.load(open('build/france_irve/effective_tariff_network_registry.json',encoding='utf-8'))
          rows={x['id']:x for x in d['networks']}
          assert rows['grenoble-alpes-metropole']['coverageStatus']=='partial_ready'
          assert d['identityAdditionCount']>=1
          PY

      - name: Download current PAN IRVE snapshots
        run: |
          mkdir -p .tmp/irve
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84013/download' \
            --output .tmp/irve/static.csv
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://transport.data.gouv.fr/resources/84098/download' \
            --output .tmp/irve/dynamic.csv
          test -s .tmp/irve/static.csv
          test -s .tmp/irve/dynamic.csv

      - name: Rebuild canonical France identities
        run: |
          python scripts/run_france_irve_canonical.py \
            --static-csv .tmp/irve/static.csv \
            --dynamic-csv .tmp/irve/dynamic.csv \
            --registry data/france_irve_operator_registry_v1.json \
            --out-dir build/france_irve
          python scripts/run_enrich_france_irve_network_identity.py \
            --canonical-dir build/france_irve \
            --operator-registry data/france_irve_operator_registry_v1.json \
            --network-registry build/france_irve/effective_tariff_network_registry.json \
            --out-dir build/france_irve_identity

      - name: Materialize safe Grenoble offers
        run: |
          mkdir -p build/france_irve_offers
          python scripts/materialize_france_grenoble_offers.py \
            --review data/grenoble_alpes_metropole_tariff_review_20260901.json \
            --canonical-dir build/france_irve_identity \
            --static-csv .tmp/irve/static.csv \
            --out-dir build/france_irve_offers

      - name: Validate Grenoble canonical coverage
        run: |
          python - <<'PY'
          import gzip,json
          r=json.load(open('build/france_irve_offers/grenoble_materialization_report.json',encoding='utf-8'))
          s=r['summary']
          assert 80 <= s['explicitGrenobleNetworkStationCount'] <= 130, s
          assert 200 <= s['explicitGrenobleNetworkPdcCount'] <= 300, s
          assert 10 <= s['pgamStationCount'] <= 20, s
          assert 240 <= s['pgamPdcCount'] <= 260, s
          assert 220 <= s['pgamRankableSubscriberPdcCount'] <= 240, s
          assert s['pgamRankableSubscriberPdcCount'] < s['pgamPdcCount']
          assert s['rankableOfferCount']==s['pgamRankableSubscriberPdcCount']
          assert s['physicalInventoryMutationCount']==0
          with gzip.open('build/france_irve_offers/grenoble_pdc_offers_contract_v1_1.json.gz','rt',encoding='utf-8') as f: offers=json.load(f)
          ranked=[o for o in offers if o['rankable']]
          assert ranked
          assert all(o['subscriptionId']=='grenoble-oura' for o in ranked)
          assert all(o['channel']=='subscription' for o in ranked)
          assert all(o['tariffNetworkId']=='grenoble-alpes-metropole' for o in offers)
          assert all(o['physicalOperatorId']=='bouygues-energies-services' for o in ranked)
          assert all(o['pricingRules'][0]['pricePerKwh']==0.29 for o in ranked)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload Grenoble audit
        uses: actions/upload-artifact@v4
        with:
          name: france-grenoble-canonical-audit
          path: |
            build/france_irve_identity/network_gap_report.json
            build/france_irve_offers/grenoble_materialization_report.json
            build/france_irve_offers/grenoble_pdc_offers_contract_v1_1.json.gz
          retention-days: 14
