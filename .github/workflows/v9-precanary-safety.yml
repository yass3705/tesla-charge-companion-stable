name: V9 pre-canary safety

on:
  pull_request:
    paths:
      - 'assets/v9/canary-identity.js'
      - 'assets/v9/canary-telemetry.js'
      - 'assets/v9/rollout-engine.js'
      - 'data/v9/rollout-config.json'
      - 'data/v9/canary-policy.json'
      - 'data/v9/access-readiness.json'
      - 'ops/v9/canary-activation.json'
      - 'v9-app/**'
      - 'tests/v9-precanary.test.cjs'
      - '.github/workflows/v9-precanary-safety.yml'
  push:
    branches: [main, 'refactor/unified-data-engine-v9']
    paths:
      - 'assets/v9/canary-identity.js'
      - 'assets/v9/canary-telemetry.js'
      - 'assets/v9/rollout-engine.js'
      - 'data/v9/rollout-config.json'
      - 'data/v9/canary-policy.json'
      - 'data/v9/access-readiness.json'
      - 'ops/v9/canary-activation.json'
      - 'v9-app/**'
      - 'tests/v9-precanary.test.cjs'
      - '.github/workflows/v9-precanary-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/v9/canary-identity.js
          node --check assets/v9/canary-telemetry.js
          node --check v9-app/app.js
          node --check tests/v9-precanary.test.cjs
      - name: Pre-canary contract
        run: node tests/v9-precanary.test.cjs
      - name: Safe preview or initial-canary config
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/v9/rollout-config.json','utf8'));
          const p=JSON.parse(fs.readFileSync('data/v9/canary-policy.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/v9/access-readiness.json','utf8'));
          const a=fs.existsSync('ops/v9/canary-activation.json')?JSON.parse(fs.readFileSync('ops/v9/canary-activation.json','utf8')):null;
          const preview=c.stage==='preview'&&Number(c.canaryPercent)===0&&p.active===false;
          const canary=c.stage==='canary'&&Number(c.canaryPercent)===1&&Number(p.initialPercent)===1&&p.active===true&&r.ready===true&&r.verdict==='READY'&&c.killSwitch===false&&c.v8Path==='v8-app/'&&a?.status==='APPROVED_FOR_DEPLOYMENT'&&Number(a?.percent)===1&&a?.fullWindowValidation?.conclusion==='success';
          if(!preview&&!canary)throw new Error('configuration is neither safe 0% preview nor approved 1% canary');
          if(c.productionPath!=='v9-app/'||c.canaryPath!=='v9-app/')throw new Error('production candidate must point to isolated v9-app');
          if(c.productionPath===c.previewPath)throw new Error('preview and production candidate must be distinct');
          if(!fs.existsSync('v9-app/index.html')||!fs.existsSync('v9-app/app.js'))throw new Error('v9-app candidate missing');
          console.log(canary?'Initial 1% canary configuration OK':'Pre-canary zero-traffic configuration OK');
          NODE
