name: Spain MITECO V9 contract

on:
  pull_request:
    paths:
      - 'scripts/build_spain_miteco_v9.py'
      - 'scripts/test_spain_miteco_v9.py'
      - 'tests/fixtures/spain_miteco_v9_sample.csv'
      - 'data/v9/spain-operator-aliases.json'
      - '.github/workflows/spain-miteco-v9-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Spain V9 static contract
        run: python scripts/test_spain_miteco_v9.py
