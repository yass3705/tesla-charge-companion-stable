name: Spain V9 pre-integration contract

on:
  pull_request:
    paths:
      - 'scripts/build_spain_miteco_v9.py'
      - 'scripts/enrich_spain_reve_crosswalk_v9.py'
      - 'scripts/test_spain_miteco_v9.py'
      - 'scripts/compile_global_subscriptions_v9.py'
      - 'scripts/test_global_subscriptions_v9.py'
      - 'scripts/dedupe_global_subscriptions_v9.py'
      - 'scripts/test_subscription_dedupe_v9.py'
      - 'scripts/test_v9_subscription_picker.py'
      - 'scripts/test_v9_subscription_engine_bridge.py'
      - 'scripts/test_v9_offer_engine.js'
      - 'scripts/test_spain_conditional_subscriptions_v9.py'
      - 'tests/fixtures/spain_miteco_v9_sample.csv'
      - 'tests/fixtures/spain_reve_v9_sample.json'
      - 'data/v9/spain-operator-aliases.json'
      - 'data/v9/subscription-entitlements-global.json'
      - 'data/v9/spain-conditional-subscription-evidence.json'
      - 'data/v9/france-emsp-offers.json'
      - 'data/netherlands_direct_tariffs_v1.json'
      - 'assets/v9-subscription-picker.js'
      - 'assets/v9-subscription-picker.css'
      - 'assets/v9-subscription-engine-bridge.js'
      - 'assets/v9-offer-engine.js'
      - '.github/workflows/spain-miteco-v9-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Spain V9 static and crosswalk contract
        run: python scripts/test_spain_miteco_v9.py
      - name: Validate global multi-country subscription contract
        run: python scripts/test_global_subscriptions_v9.py
      - name: Validate legacy subscription dedupe contract
        run: python scripts/test_subscription_dedupe_v9.py
      - name: Validate V9 subscription picker contract
        run: python scripts/test_v9_subscription_picker.py
      - name: Validate V9 subscription engine bridge contract
        run: python scripts/test_v9_subscription_engine_bridge.py
      - name: Validate V9 unified offer engine runtime
        run: node scripts/test_v9_offer_engine.js
      - name: Validate Spain conditional subscription evidence
        run: python scripts/test_spain_conditional_subscriptions_v9.py
