<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC V9 Rollout</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#101011;color:#eee}main{max-width:900px;margin:auto;padding:18px}.card{background:#1b1b1d;border:1px solid #343438;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{display:grid;gap:5px;color:#bbb;font-size:13px}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#111;color:#fff}.ok{color:#8fe39f}.warn{color:#ffd27a}.err{color:#ff8b8b}.pill{display:inline-block;padding:5px 8px;border:1px solid #444;border-radius:999px;margin:3px}.muted{color:#999}</style></head><body><main><h1>TCC V9 Rollout Control</h1><p class="muted">Console isolée de simulation. Elle ne modifie pas la production V8.</p><section class="card"><div class="grid"><label>Identité canary<input id="identity" value="preview-device"></label><label>Stage demandé<select id="stage"><option>preview</option><option>canary</option><option>production</option></select></label><label>Readiness<select id="readiness"><option value="READY">READY</option><option value="BLOCKED">BLOCKED</option><option value="UNKNOWN">UNKNOWN</option></select></label><label>Canary %<input id="percent" type="number" min="0" max="100" value="0"></label><label>Kill switch<select id="kill"><option value="false">off</option><option value="true">ON</option></select></label></div><p><button id="simulate">Simuler la décision</button></p><div id="result" class="muted">Aucune simulation.</div></section><section class="card"><h2>Configuration versionnée</h2><pre id="config">Chargement…</pre></section></main><script src="../assets/v9/rollout-engine.js"></script><script>(async()=>{const cfg=await fetch('../data/v9/rollout-config.json',{cache:'no-cache'}).then(r=>r.json());document.getElementById('config').textContent=JSON.stringify(cfg,null,2);document.getElementById('stage').value=cfg.stage;document.getElementById('percent').value=cfg.canaryPercent;document.getElementById('kill').value=String(cfg.killSwitch);document.getElementById('simulate').onclick=()=>{const stage=document.getElementById('stage').value,readinessValue=document.getElementById('readiness').value,readiness=readinessValue==='UNKNOWN'?null:{verdict:readinessValue,ready:readinessValue==='READY'},config={...cfg,stage,canaryPercent:Number(document.getElementById('percent').value),killSwitch:document.getElementById('kill').value==='true'},d=TCCV9RolloutEngine.decide({config,identity:document.getElementById('identity').value,readiness});const el=document.getElementById('result');el.className=d.engine==='v9'?'ok':'warn';el.innerHTML=`<span class="pill">${d.engine.toUpperCase()}</span><span class="pill">${d.stage}</span><span class="pill">bucket ${d.bucket.toFixed(2)}</span><p>Raison : ${d.reason} · destination : ${d.path}</p>`;};})();</script></body></html>
