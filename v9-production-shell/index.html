<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TCC V9 production shell</title>
<style>body{margin:0;background:#0b0b0c;color:#eee;font-family:system-ui,-apple-system,sans-serif}.boot{max-width:680px;margin:12vh auto;padding:24px}.small{color:#aaa}</style>
</head>
<body>
<div class="boot"><h1>⚡ Tesla Charge Companion</h1><p class="small">Chargement du shell V9 sécurisé…</p></div>
<script>
(async function(){
  'use strict';
  let cfg=null;
  const inferredFallback=location.pathname.includes('/v9-test/')?'../../':'../';
  const failClosed=(reason)=>{console.error('[TCC V9 shell] fail closed:',reason);location.replace(cfg?.controlFallback||inferredFallback);};
  try{
    const bridgeUrl=new URL('./bridge.js',location.href).href;
    const cfgResponse=await fetch('./shell-config.json',{cache:'no-store'});
    if(!cfgResponse.ok)throw new Error(`shell config ${cfgResponse.status}`);
    cfg=await cfgResponse.json();
    if(cfg.schemaVersion!==1||!['shadow','candidate'].includes(cfg.mode))throw new Error('invalid shell config');
    if(cfg.observedCandidateSha!=='8d2c20b7c76004389edd8f4a3b80d6b314900ba0')throw new Error('candidate SHA is not pinned');
    if(!cfg.controlBase||!cfg.controlIndex||!cfg.controlFallback)throw new Error('control paths missing');
    const controlResponse=await fetch(cfg.controlIndex,{cache:'no-store'});
    if(!controlResponse.ok)throw new Error(`control index ${controlResponse.status}`);
    const controlHtml=await controlResponse.text();
    const parsed=new DOMParser().parseFromString(controlHtml,'text/html');
    const build=parsed.querySelector('meta[name="tcc-build"]')?.content||'';
    if(build!==String(cfg.expectedControlBuild||''))throw new Error(`control build mismatch: ${build||'missing'}`);

    const base=parsed.createElement('base');base.setAttribute('href',cfg.controlBase);parsed.head.prepend(base);
    const marker=parsed.createElement('meta');marker.setAttribute('name','tcc-v9-shell');marker.setAttribute('content',cfg.mode);parsed.head.append(marker);
    parsed.title=`${parsed.title} · V9 ${cfg.mode}`;

    const configScript=parsed.createElement('script');
    configScript.textContent='window.__TCC_V9_SHELL_CONFIG__='+JSON.stringify(cfg).replace(/</g,'\\u003c')+';';
    parsed.body.append(configScript);

    const runtimeBase=String(cfg.runtimeBase||'.').replace(/\/$/,'');
    const dependencies=[
      'assets/v9/data-engine.js','assets/v9/offer-engine.js','assets/v9/pricing-engine.js','assets/v9/session-engine.js',
      'assets/v9/vehicle-profile-engine.js','assets/v9/charge-model-engine.js','assets/v9/session-planner-engine.js',
      'assets/v9/station-score-engine.js','assets/v9/routing-engine.js','assets/v9/browser-routing.js','assets/v9/runtime-engine.js',
      'assets/v9/adapters/tesla-json.js','assets/v9/adapters/national-compact.js','assets/v9/adapters/direct-offers.js',
      'assets/v9/adapters/legacy-direct-tariffs.js','assets/v9/adapters/legacy-direct-stations.js',
      'assets/v9/adapters/france-emsp-compact.js','assets/v9/adapters/france-crosswalk.js','assets/v9/adapters/france-irve-status.js',
      'assets/v9/adapters/morocco-public.js','assets/v9/browser-loaders.js'
    ];
    for(const path of dependencies){const script=parsed.createElement('script');script.defer=true;script.setAttribute('src',`${runtimeBase}/${path}`);parsed.body.append(script);}
    const bridge=parsed.createElement('script');bridge.defer=true;bridge.setAttribute('src',bridgeUrl);parsed.body.append(bridge);

    document.open();document.write('<!doctype html>'+parsed.documentElement.outerHTML);document.close();
  }catch(err){failClosed(err?.message||err);}
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=../"></noscript>
</body>
</html>
