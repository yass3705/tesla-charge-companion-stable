<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC V8↔V9 Shadow</title><style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#101011;color:#eee}main{max-width:1050px;margin:auto;padding:18px}.card{background:#1b1b1d;border:1px solid #343438;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;color:#bbb}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#111;color:#fff}button{font-weight:700;cursor:pointer}.muted{color:#999}.ok{color:#8fe39f}.warn{color:#ffd27a}.err{color:#ff8b8b}.gate{display:inline-block;border:1px solid #444;border-radius:999px;padding:5px 8px;margin:3px;font-size:12px}.row{padding:10px 0;border-top:1px solid #303035}.row:first-child{border-top:0}.diff{font-size:13px;margin-top:4px}.error{color:#ff9b9b}.warning{color:#ffd88a}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
</style></head><body><main>
<h1>TCC Shadow V8 ↔ V9</h1><p class="muted">Console de non-régression isolée. V8 reste la production ; V9 est seulement comparée sur la même requête.</p>
<section class="card"><div class="grid">
<label>Pays<select id="country"><option value="FR">France</option><option value="NL">Pays-Bas</option><option value="IT">Italie</option></select></label>
<label class="wide">Départ / adresse<input id="originText" value="Saint-Cyr-l'École" placeholder="Adresse ou ville"></label>
<label>Rayon km<input id="radius" type="number" min="1" max="100" value="20"></label>
<label>Profil véhicule<select id="vehicleProfile"></select></label>
<label>SOC départ %<input id="startSoc" type="number" min="0" max="100" value="20"></label>
<label>SOC cible %<input id="targetSoc" type="number" min="0" max="100" value="80"></label>
<label>Départ trajet<input id="startAt" type="datetime-local"></label>
<label>Débranchement<input id="disconnectAt" type="datetime-local"></label>
<label>Profil V8<select id="v8Profile"><option value="realistic">Réaliste</option><option value="optimistic">Optimiste</option><option value="conservative">Prudent</option></select></label>
<label>État batterie V8<select id="v8Condition"><option value="normal">Normale</option><option value="warm">Préconditionnée</option><option value="cold">Froide</option></select></label>
</div><p><button id="run">Lancer le shadow réel</button></p><div id="status" class="muted">Initialisation…</div></section>
<section class="card"><h2>Gates</h2><div id="gates" class="muted">Aucun run.</div><div id="summary" class="muted"></div></section>
<section class="card"><h2>Écarts</h2><div id="changes" class="muted">Aucun run.</div></section>
<iframe id="v8Frame" src="../index.html" title="TCC V8 runtime isolé"></iframe>
</main>
<script src="../assets/v9/data-engine.js"></script><script src="../assets/v9/offer-engine.js"></script><script src="../assets/v9/pricing-engine.js"></script><script src="../assets/v9/session-engine.js"></script><script src="../assets/v9/vehicle-profile-engine.js"></script><script src="../assets/v9/charge-model-engine.js"></script><script src="../assets/v9/session-planner-engine.js"></script><script src="../assets/v9/station-score-engine.js"></script><script src="../assets/v9/routing-engine.js"></script><script src="../assets/v9/browser-routing.js"></script><script src="../assets/v9/runtime-engine.js"></script><script src="../assets/v9/parity-engine.js"></script><script src="../assets/v9/v8-shadow-adapter.js"></script>
<script src="../assets/v9/adapters/tesla-json.js"></script><script src="../assets/v9/adapters/national-compact.js"></script><script src="../assets/v9/adapters/direct-offers.js"></script><script src="../assets/v9/adapters/legacy-direct-tariffs.js"></script><script src="../assets/v9/adapters/legacy-direct-stations.js"></script><script src="../assets/v9/adapters/france-emsp-compact.js"></script><script src="../assets/v9/adapters/france-crosswalk.js"></script><script src="../assets/v9/adapters/france-irve-status.js"></script><script src="../assets/v9/browser-loaders.js"></script><script src="app.js"></script>
</body></html>
