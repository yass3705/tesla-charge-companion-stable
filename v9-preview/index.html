<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC V9 Preview</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#111;color:#eee}main{max-width:980px;margin:auto;padding:20px}.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;color:#bbb}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#101010;color:#fff}button{cursor:pointer;font-weight:700}.muted{color:#999}.ok{color:#8fe39f}.err{color:#ff8b8b}.station{padding:10px 0;border-top:1px solid #2e2e2e}.station:first-child{border-top:0}.offer{font-size:13px;color:#ccc;margin-top:3px}.best{margin-top:6px;font-size:13px;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #444;border-radius:999px;padding:5px 8px;font-size:12px}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}</style></head><body><main><h1>Tesla Charge Companion V9</h1><p class="muted">Preview technique isolée — moteur unifié, tarifs, abonnements et score complet station.</p><section class="card"><div class="grid"><label>Pays<select id="country"><option value="FR">France</option><option value="NL">Pays-Bas</option></select></label><label>Latitude<input id="lat" inputmode="decimal" value="48.798"></label><label>Longitude<input id="lon" inputmode="decimal" value="2.061"></label><label>Rayon km<input id="radius" type="number" min="1" max="100" value="15"></label><label>Énergie session (kWh)<input id="energy" type="number" min="0" step="0.1" value="20"></label><label>Conso kWh/100 km<input id="consumption" type="number" min="1" step="0.1" value="15"></label><label>Puissance max véhicule (kW)<input id="vehicleMaxKw" type="number" min="1" step="1" value="250"></label><label>Début session<input id="startAt" type="datetime-local"></label><label>Heure de débranchement<input id="disconnectAt" type="datetime-local"></label><label>Trier par<select id="sortBy"><option value="finalCost">Coût final</option><option value="costPerRecoveredKm">Coût/km récupéré</option><option value="totalTime">Temps total</option><option value="distance">Distance</option></select></label><label>Couverture abonnement min.<input id="minCountries" type="number" min="1" max="20" value="1"></label><label class="wide">Pays abonnement (codes séparés par virgule)<input id="subCountries" placeholder="FR,NL"></label><label class="wide">Abonnements sélectionnés (IDs séparés par virgule)<input id="selectedSubscriptions" placeholder="atlante-plus,fastned-gold"></label></div><p><button id="load">Charger et classer la zone V9</button></p><div id="status" class="muted">Prêt.</div></section><section class="card"><h2>Abonnements disponibles</h2><div id="subs" class="chips"><span class="muted">Aucune recherche.</span></div></section><section class="card"><h2>Stations</h2><div id="summary" class="muted"></div><div id="stations"></div></section></main><script src="../assets/v9/data-engine.js"></script><script src="../assets/v9/offer-engine.js"></script><script src="../assets/v9/pricing-engine.js"></script><script src="../assets/v9/session-engine.js"></script><script src="../assets/v9/station-score-engine.js"></script><script src="../assets/v9/runtime-engine.js"></script><script src="../assets/v9/adapters/tesla-json.js"></script><script src="../assets/v9/adapters/national-compact.js"></script><script src="../assets/v9/adapters/direct-offers.js"></script><script src="../assets/v9/adapters/legacy-direct-tariffs.js"></script><script src="../assets/v9/adapters/legacy-direct-stations.js"></script><script src="../assets/v9/adapters/france-emsp-compact.js"></script><script src="../assets/v9/adapters/france-crosswalk.js"></script><script src="../assets/v9/adapters/france-irve-status.js"></script><script src="../assets/v9/browser-loaders.js"></script><script src="app.js"></script></body></html>
